<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STEP · Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12172B; --bg-2:#0D1122;
  --surface:#1B2140; --surface-2:#232A4D; --surface-3:#2B3260;
  --text:#EDEAE0; --text-muted:#A7ACC8; --text-faint:#6B7196;
  --teal:#4FA8A0; --teal-dim:#2C6D67;
  --amber:#E8B44C; --amber-dim:#3A3221;
  --red:#E2637A; --red-dim:#3A2530;
  --green:#6FCF97; --green-dim:#1E3A2C;
  --border:rgba(237,234,224,.12);
  --border-soft:rgba(237,234,224,.08);
  --radius:16px;
  --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 20% -10%, #1B2140 0%, var(--bg) 45%, var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
.mono{ font-family:'JetBrains Mono',monospace; }
a{color:inherit;}
button{ font-family:inherit; cursor:pointer; }
svg{ width:20px; height:20px; flex-shrink:0; vertical-align:middle; }
::selection{ background:var(--amber); color:#1a1408; }

#app{ max-width:640px; margin:0 auto; padding:0 16px 60px; min-height:100vh; }
.center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }

/* ---- Step motif ---- */
.step-mark{ display:flex; align-items:flex-end; gap:4px; height:26px; }
.step-mark i{ display:block; width:7px; background:var(--amber); border-radius:2px; opacity:.35; }
.step-mark i:nth-child(1){ height:8px; }
.step-mark i:nth-child(2){ height:14px; opacity:.6; }
.step-mark i:nth-child(3){ height:20px; opacity:.85; }
.step-mark i:nth-child(4){ height:26px; opacity:1; }

.brand{ display:flex; align-items:center; gap:10px; }
.brand .wordmark{ font-size:22px; font-weight:700; letter-spacing:.02em; }
.brand .wordmark span{ color:var(--amber); }

/* ---- Top bar ---- */
.topbar{
  position:sticky; top:0; z-index:20; height:60px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0; margin-bottom:6px;
  background:rgba(18,23,43,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar .left{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  transition:.15s; flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-3); border-color:var(--amber); }
.icon-btn svg{ width:18px; height:18px; }

/* ---- Cards / layout ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;
}
.clickable{ cursor:pointer; transition:.15s; }
.clickable:hover{ border-color:var(--teal); }
.grid{ display:grid; gap:12px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
@media (max-width:640px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; position:relative; overflow:hidden;
}
.stat:before{content:'';position:absolute;top:-20px;left:-20px;width:70px;height:70px;background:var(--amber);opacity:.08;border-radius:50%;}
.stat .num{ font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; color:var(--amber); }
.stat .label{ color:var(--text-muted); font-size:12.5px; margin-top:4px; }

.page-title{ font-size:22px; font-weight:800; margin:14px 0 4px; }
.page-sub{ color:var(--text-muted); font-size:13.5px; margin-bottom:18px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-weight:600; font-size:14.5px;
  transition:.15s;
}
.btn:hover{ background:var(--surface-3); border-color:var(--teal); }
.btn-primary{ background:var(--amber); border-color:var(--amber); color:#1a1408; }
.btn-primary:hover{ filter:brightness(1.08); background:var(--amber); }
.btn-amber{ background:var(--teal); border-color:var(--teal); color:#062420; }
.btn-amber:hover{ filter:brightness(1.08); background:var(--teal); }
.btn-danger{ background:transparent; border-color:var(--red); color:var(--red); }
.btn-danger:hover{ background:rgba(226,99,122,.1); }
.btn-ghost{ background:transparent; border-color:var(--border); }
.btn-block{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:8px; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }

input[type=text],input[type=tel],input[type=number],textarea{
  width:100%; background:var(--bg-2); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:10px; font-size:14.5px; font-family:inherit; outline:none;
}
input:focus,textarea:focus{ border-color:var(--teal); }
textarea{ resize:vertical; min-height:110px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6; }
label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
.field{ margin-bottom:14px; }

.row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.muted{ color:var(--text-muted); }
.faint{ color:var(--text-faint); }
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em;
}
.badge-teal{ background:rgba(79,168,160,.15); color:var(--teal); }
.badge-amber{ background:rgba(232,180,76,.15); color:var(--amber); }
.badge-red{ background:rgba(226,99,122,.15); color:var(--red); }
.badge-green{ background:rgba(111,207,151,.15); color:var(--green); }

.empty{ text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty .step-mark{ margin:0 auto 14px; opacity:.5; }

/* ---- Slide drawer (Qudurat style) ---- */
.overlay{position:fixed;inset:0;background:rgba(6,8,16,.6);z-index:29;opacity:0;pointer-events:none;transition:.25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.menu-overlay{
  position:fixed; inset:0; background:rgba(6,8,16,.6); z-index:50;
  display:flex; justify-content:flex-end;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.menu-panel{
  width:78%; max-width:320px; height:100%; background:var(--surface); border-left:1px solid var(--border);
  padding:0 0 20px; display:flex; flex-direction:column; gap:0;
  animation:slideIn .18s ease; overflow-y:auto;
}
@keyframes slideIn{ from{ transform:translateX(30px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
.menu-head{ padding:20px 20px 16px; border-bottom:1px solid var(--border); margin-bottom:8px; }
.menu-head .num{ font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:20px; color:var(--amber); }
.menu-head .tag{ color:var(--text-faint); font-size:12px; margin-top:2px; }
.menu-item{
  display:flex; align-items:center; gap:12px; padding:13px 20px;
  color:var(--text); font-weight:600; font-size:14.5px; border:1px solid transparent; text-decoration:none;
  border-right:3px solid transparent;
}
.menu-item:hover{ background:var(--surface-2); }
.menu-item.active{ background:var(--surface-2); border-right-color:var(--amber); }
.menu-item svg{ width:18px; height:18px; color:var(--teal); flex-shrink:0; }
.menu-foot{ margin-top:auto; padding-top:10px; border-top:1px solid var(--border); }

/* ---- Modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,9,14,.7); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:22px;
  box-shadow:var(--shadow);
}
.modal h3{ margin-top:0; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

/* ---- Question ---- */
.q-text{ font-size:17px; font-weight:600; line-height:1.6; margin-bottom:16px; }
.option{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:var(--radius-sm);
  border:1.5px solid var(--border); background:var(--surface-2); margin-bottom:10px; transition:.12s;
}
.option .letter{
  width:26px; height:26px; border-radius:50%; background:var(--surface); border:1.5px solid var(--text-faint);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted); flex-shrink:0;
}
.option.selected{ border-color:var(--amber); background:var(--amber-dim); }
.option.selected .letter{ background:var(--amber); color:#1a1408; border-color:var(--amber); }
.option.correct{ border-color:var(--green); background:var(--green-dim); }
.option.correct .letter{ background:var(--green); color:#0c2016; border-color:var(--green); }
.option.wrong{ border-color:var(--red); background:var(--red-dim); }
.option.wrong .letter{ background:var(--red); color:#2c0f16; border-color:var(--red); }

.qpalette{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
.qdot{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted);
  font-family:'JetBrains Mono',monospace; position:relative;
}
.qdot.current{ border-color:var(--teal); color:var(--teal); }
.qdot.answered{ background:rgba(79,168,160,.18); color:var(--teal); border-color:var(--teal-dim); }
.qdot.reviewed:after{
  content:''; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--amber);
}

.quiz-actions{ display:flex; gap:8px; }
.quiz-actions .icon-btn.active{ border-color:var(--amber); color:var(--amber); }
.quiz-actions .icon-btn.active-save{ border-color:var(--teal); color:var(--teal); }

.progress-track{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-bottom:18px; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--amber)); }

.timer{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-muted);
  display:flex; align-items:center; gap:6px;
}

.login-wrap{ width:100%; max-width:380px; }
.login-card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:34px 28px; box-shadow:var(--shadow); }
.login-hint{ font-size:12.5px; color:var(--text-faint); margin-top:14px; line-height:1.6; }

.spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--amber); animation:spin .7s linear infinite; margin:0 auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading-block{ padding:60px 0; text-align:center; color:var(--text-muted); }

hr.sep{ border:none; border-top:1px solid var(--border); margin:20px 0; }

table.simple{ width:100%; border-collapse:collapse; }
table.simple th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); }
table.simple td{ padding:12px 10px; border-bottom:1px solid var(--border-soft); font-size:14px; }
table.simple tr:last-child td{ border-bottom:none; }

.review-note{
  background:rgba(232,180,76,.1); border:1px solid rgba(232,180,76,.35); color:var(--amber);
  padding:12px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;
}

/* ---- merged features ---- */
.answer-check{display:inline-flex;align-items:center;margin:0;cursor:pointer;position:relative;}
.answer-check input{position:absolute;opacity:0;pointer-events:none;}
.answer-check .check-box{width:22px;height:22px;border:1.5px solid var(--text-faint);border-radius:6px;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800;font-size:14px;transition:.15s;}
.answer-check input:checked + .check-box{background:var(--green);border-color:var(--green);color:#0c2016;}
.report-button{color:var(--red)!important;border-color:rgba(226,99,122,.45)!important;}
.report-card{border-color:rgba(226,99,122,.45);}
/* ---- toast ---- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--amber);
  color:var(--text);padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:70;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90vw;}
.toast.show{opacity:1;bottom:34px;}

/* ---- switch (offline toggle) ---- */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-3);border-radius:24px;transition:.2s;}
.switch-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--text-muted);border-radius:50%;transition:.2s;}
.switch input:checked + .switch-slider{background:var(--amber);}
.switch input:checked + .switch-slider:before{transform:translateX(18px);background:#1a1408;}

/* ---- offline banner ---- */
.offline-banner{ display:flex;align-items:center;gap:8px;background:rgba(226,99,122,.1);border:1px solid var(--red);
  color:var(--red);padding:10px 14px;border-radius:12px;font-size:12.5px;margin-bottom:14px; }
.offline-tag{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--text-faint); }

/* ---- drag reorder ---- */
.drag-row{ display:flex; align-items:stretch; gap:0; margin-bottom:10px; }
.drag-handle{
  display:flex; align-items:center; justify-content:center; width:34px; flex-shrink:0;
  color:var(--text-faint); cursor:grab; touch-action:none; border-radius:9px 0 0 9px;
  background:var(--surface-2); border:1px solid var(--border); border-right:none;
}
.drag-handle:active{ cursor:grabbing; }
.drag-handle svg{ width:16px; height:16px; pointer-events:none; }
.drag-item-body{ flex:1; border:1px solid var(--border); border-radius:0 9px 9px 0; padding:14px 16px; background:var(--surface); }
.drag-row.dragging{ opacity:.5; }
.drag-row.drag-ghost{ position:fixed; z-index:80; pointer-events:none; box-shadow:var(--shadow); border-radius:9px; opacity:.95; }
.order-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px;
  border-radius:6px; background:var(--surface-3); color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; margin-inline-end:8px; }
.opt-drag-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.opt-drag-row .drag-handle{ border-radius:9px; border-right:1px solid var(--border); height:48px; }
.opt-drag-row .field-inline{ flex:1; display:flex; align-items:center; gap:10px; }

/* ---- quiz nav (circular Prev/Next) ---- */
.quiz-nav{ display:flex; align-items:center; justify-content:center; gap:26px; margin-top:6px; }
.nav-circle{
  width:52px; height:52px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); display:flex; align-items:center; justify-content:center; transition:.15s; flex-shrink:0;
}
.nav-circle svg{ width:22px; height:22px; }
.nav-circle:hover{ border-color:var(--teal); background:var(--surface-3); }
.nav-circle[disabled]{ opacity:.35; cursor:not-allowed; }
.nav-circle-primary{ background:var(--amber); border-color:var(--amber); color:#1a1408; }
.nav-circle-primary:hover{ background:var(--amber); filter:brightness(1.08); }

/* ---- notifications dropdown (admin home) ---- */
.notif-row{ padding:10px 0; border-top:1px solid var(--border-soft); }
.notif-row:first-child{ border-top:none; }
</style>
</head>

<div id="app">
  <div class="center-screen"><div class="spinner"></div></div>
</div>
<div class="toast" id="toast"></div>

/* ============ HELPERS ============ */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDuration(totalSec){
  totalSec = Math.max(0, Math.round(totalSec||0));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  if(h>0) return `${h}h ${m}m ${s}s`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}
function tsToDate(ts){
  if(!ts) return null;
  if(ts.toDate) return ts.toDate();
  if(ts.seconds) return new Date(ts.seconds*1000);
  if(ts instanceof Date) return ts;
  return new Date(ts);
}
function fmtDateTime(ts){
  const d = tsToDate(ts);
  if(!d) return '—';
  return d.toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}
function fmtTimeRange(startTs, endTs){
  const s = tsToDate(startTs), e = tsToDate(endTs);
  if(!s) return '—';
  const opts = { hour:'numeric', minute:'2-digit' };
  const dateStr = s.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const startStr = s.toLocaleTimeString('en-US', opts);
  const endStr = e ? e.toLocaleTimeString('en-US', opts) : startStr;
  return `${dateStr} · ${startStr} – ${endStr}`;
}
function sortByCreatedAt(arr, dir='asc'){
  return arr.sort((a,b)=>{
    const da = a.createdAt ? tsToDate(a.createdAt).getTime() : 0;
    const db_ = b.createdAt ? tsToDate(b.createdAt).getTime() : 0;
    return dir==='asc' ? da-db_ : db_-da;
  });
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function letterOf(i){ return ['A','B','C','D'][i]; }

/* ============ DRAG-TO-REORDER (hold handle, then drag) ============ */
function initDragReorder(container, onReorder){
  if(!container || container.__dragBound) return;
  container.__dragBound = true;
  const LONG_PRESS = 260, MOVE_TOLERANCE = 10;
  let active = false, dragEl = null, pointerId = null, holdTimer = null;

  function rows(){ return Array.from(container.querySelectorAll(':scope > .drag-row')); }

  function beginDrag(row, handle){
    active = true;
    dragEl = row;
    dragEl.classList.add('dragging');
    try{ handle.setPointerCapture(pointerId); }catch(err){}
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  function onDown(e){
    const handle = e.target.closest('.drag-handle');
    if(!handle || !container.contains(handle)) return;
    const row = handle.closest('.drag-row');
    if(!row) return;
    pointerId = e.pointerId;
    if(e.pointerType === 'touch' || e.pointerType === 'pen'){
      const downY = e.clientY, downX = e.clientX;
      let moved = false;
      const tmpMove = (ev)=>{ if(Math.abs(ev.clientY-downY)>MOVE_TOLERANCE || Math.abs(ev.clientX-downX)>MOVE_TOLERANCE) moved = true; };
      const tmpUp = ()=>{ clearTimeout(holdTimer); document.removeEventListener('pointermove', tmpMove); document.removeEventListener('pointerup', tmpUp); };
      document.addEventListener('pointermove', tmpMove);
      document.addEventListener('pointerup', tmpUp);
      holdTimer = setTimeout(()=>{
        document.removeEventListener('pointermove', tmpMove);
        document.removeEventListener('pointerup', tmpUp);
        if(!moved) beginDrag(row, handle);
      }, LONG_PRESS);
    } else {
      beginDrag(row, handle);
    }
  }

  function onMove(e){
    if(!active || !dragEl) return;
    e.preventDefault();
    const y = e.clientY;
    const list = rows();
    for(const r of list){
      if(r===dragEl) continue;
      const rect = r.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      const dragIsAfter = !!(r.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_FOLLOWING);
      if(y < mid && dragIsAfter){ container.insertBefore(dragEl, r); break; }
      else if(y > mid && !dragIsAfter){ container.insertBefore(dragEl, r.nextSibling); break; }
    }
  }

  function onUp(){
    if(!active) return;
    active = false;
    if(dragEl) dragEl.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    const ids = rows().map(r=>r.dataset.id);
    dragEl = null;
    onReorder(ids);
  }

  container.addEventListener('pointerdown', onDown);
}
function setupDragReorders(){
  const testsCont = document.getElementById('tests-drag-container');
  if(testsCont){
    initDragReorder(testsCont, async (ids)=>{
      await Data.reorderTests(testsCont.dataset.sectionId, ids);
      render();
    });
  }
  const qCont = document.getElementById('questions-drag-container');
  if(qCont){
    initDragReorder(qCont, async (ids)=>{
      await Data.reorderQuestions(qCont.dataset.testId, ids);
      render();
    });
  }
  const optCont = document.getElementById('question-modal-options');
  if(optCont){
    initDragReorder(optCont, ()=>{ /* order is read directly from the DOM on submit */ });
  }
}
function sortByOrder(arr){
  return arr.sort((a,b)=>{
    const oa = (typeof a.order==='number') ? a.order : 999999;
    const ob = (typeof b.order==='number') ? b.order : 999999;
    if(oa!==ob) return oa-ob;
    const da = a.createdAt ? tsToDate(a.createdAt).getTime() : 0;
    const db_ = b.createdAt ? tsToDate(b.createdAt).getTime() : 0;
    return da-db_;
  });
}

function parseQuickAddLettered(raw){
  // Format: "Q: text" then separate lines "A) opt" "B) opt" "C) opt" "D) opt", correct marked with trailing *
  const lines = raw.split('\n');
  let title = '';
  const questions = [];
  let current = null;
  for(let line of lines){
    line = line.trim();
    if(!line) continue;
    if(/^(title|عنوان الاختبار|عنوان)\s*:/i.test(line)){
      title = line.replace(/^(title|عنوان الاختبار|عنوان)\s*:/i,'').trim();
    } else if(/^q\s*\d*:/i.test(line)){
      if(current && current.text && current.options.length>=2) questions.push(current);
      current = { text: line.replace(/^q\s*\d*:/i,'').trim(), options: [], correctIndex: -1 };
    } else if(/^[a-dA-D]\)/.test(line)){
      if(!current) continue;
      let opt = line.replace(/^[a-dA-D]\)/,'').trim();
      let isCorrect = false;
      if(opt.endsWith('*')){ isCorrect = true; opt = opt.slice(0,-1).trim(); }
      current.options.push(opt);
      if(isCorrect) current.correctIndex = current.options.length - 1;
    }
  }
  if(current && current.text && current.options.length>=2) questions.push(current);
  return { title, questions };
}
function findOptionMarkers(text){
  // Locates a contiguous run of option letters A,B,C[,D] each followed by ':' or '-'.
  const regex = /\b([A-D])[.:\-]\s*/g;
  const matches = [];
  let m;
  while((m = regex.exec(text))){
    matches.push({ letter:m[1], index:m.index, end: m.index+m[0].length });
  }
  for(let i=0;i<matches.length;i++){
    if(matches[i].letter!=='A') continue;
    const seq = [matches[i]];
    let expected = 'B';
    let broken = false;
    for(let j=i+1;j<matches.length;j++){
      if(matches[j].letter===expected){
        seq.push(matches[j]);
        if(expected==='B') expected='C';
        else if(expected==='C') expected='D';
        else break; // found D, a run can be at most 4 options
      } else if(expected==='D'){
        break; // no D present — a 3-option question, which is fine
      } else {
        broken = true; break; // sequence interrupted before reaching at least A,B,C
      }
    }
    if(!broken && seq.length>=3) return seq;
  }
  return null;
}
function parseQuickAddInline(raw){
  // Format: "Q1: question text? A: opt1. B: opt2. C: opt3. D: opt4*" or "A- opt1 B- opt2 C- opt3*"
  // (3 or 4 options, either ':' or '-' as separator). May span 2 lines: a context line with no
  // options, then the actual question+options on the next line. Correct option is whichever one
  // ends with "*", not necessarily the last.
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let title = '';
  let i = 0;
  if(lines.length && /^(title|عنوان الاختبار|عنوان)\s*:/i.test(lines[0]) && !/\b[A-D][.:\-]/.test(lines[0])){
    title = lines[0].replace(/^(title|عنوان الاختبار|عنوان)\s*:/i,'').trim();
    i = 1;
  }
  const questions = [];
  let buffer = '';
  for(; i<lines.length; i++){
    const line = lines[i];
    const qMatch = line.match(/^Q\s*\d+\s*:\s*(.*)$/i);
    buffer = qMatch ? qMatch[1] : (buffer ? (buffer + ' ' + line) : line);
    const seq = findOptionMarkers(buffer);
    if(seq){
      const stem = buffer.slice(0, seq[0].index).trim();
      let correctIndex = -1;
      const options = seq.map((marker, idx) => {
        const start = marker.end;
        const end = (idx+1 < seq.length) ? seq[idx+1].index : buffer.length;
        let clean = buffer.slice(start, end).trim();
        if(/\*\s*$/.test(clean)){ correctIndex = idx; clean = clean.replace(/\*\s*$/,'').trim(); }
        clean = clean.replace(/\.\s*$/,'').trim();
        return clean;
      });
      if(stem && options.length>=3 && options.every(o=>o)) questions.push({ text: stem, options, correctIndex });
      buffer = '';
    }
  }
  return { title, questions };
}
function parseQuickAdd(raw){
  const lettered = parseQuickAddLettered(raw);
  if(lettered.questions.length) return lettered;
  return parseQuickAddInline(raw);
}

/* ============ ROUTER ============ */
let lastRouteKey = null;
let lastPageHtml = '';
let lastPageWithTopbar = false;
let hasRenderedOnce = false;
// Re-paints only the topbar/menu/modal chrome around the last-known page content,
// without re-running the page's async Firestore fetch. Used for opening/closing the
// hamburger menu and modals, which used to feel slow because a full render() re-fetched
// everything from the server just to flip a UI flag.
function renderChromeOnly(){
  if(!hasRenderedOnce){ render(); return; }
  app.innerHTML = wrap(lastPageHtml, lastPageWithTopbar);
  setupDragReorders();
}
async function render(){
  const hash = location.hash || '#/login';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);
  const routeKey = parts.join('/');

  // guard: require login for anything besides login/name
  if(parts[0] !== 'login' && parts[0] !== 'name' && !state.user){
    app.innerHTML = wrap(renderLoadingScreen());
    location.hash = '#/login';
    return;
  }

  // instant feedback: paint a spinner right away when the route actually changes,
  // so clicks feel responsive even while data is still loading from Firestore.
  if(routeKey !== lastRouteKey && parts[0]!=='login' && parts[0]!=='name'){
    app.innerHTML = wrap(renderLoadingScreen(), true);
  }
  lastRouteKey = routeKey;

  let html = '';
  try{
    if(parts[0]==='login') html = renderLogin();
    else if(parts[0]==='name') html = renderNamePrompt();
    else if(parts[0]==='user') html = await renderUserRoute(parts.slice(1));
    else if(parts[0]==='admin') html = await renderAdminRoute(parts.slice(1));
    else html = renderLogin();
  }catch(err){
    console.error(err);
    html = `<div class="empty">Something went wrong loading this page.<br><span class="faint">${esc(err.message||err)}</span></div>`;
  }
  lastPageHtml = html;
  lastPageWithTopbar = parts[0]!=='login' && parts[0]!=='name';
  hasRenderedOnce = true;
  app.innerHTML = wrap(lastPageHtml, lastPageWithTopbar);
  setupDragReorders();
}
function wrap(inner, withTopbar){
  return `${withTopbar ? renderTopbar() : ''}${inner}${renderMenu()}${renderModal()}`;
}
function renderLoadingScreen(){ return `<div class="center-screen"><div class="spinner"></div></div>`; }

async function renderUserRoute(segs){
  const [section] = segs;
  if(section==='home' || !section) return await renderUserHome();
  if(section==='wrong') return await renderWrongQuestions();
  if(section==='saved') return await renderSavedQuestions();
  if(section==='important') return await renderImportantQuestions();
  if(section==='settings') return await renderUserSettings();
  if(section==='history'){
    if(segs[1]) return await renderHistoryDetail(segs[1]);
    return await renderHistory();
  }
  if(section==='sections'){
    if(segs[1]) return await renderSectionTests(segs[1]);
    return await renderSections();
  }
  if(section==='quiz'){
    return await renderQuizRoute(segs.slice(1));
  }
  if(section==='result'){
    return await renderResult(segs[1]);
  }
  if(section==='offline'){
    if(segs[1]) return renderOfflineSectionTests(segs[1]);
    return renderOfflineSections();
  }
  return renderLoadingScreen();
}

async function enrichQuestionRefs(items){
  const snaps = await Promise.all(items.map(it => getDoc(doc(questionsCol, it.questionId))));
  const questions = snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
  const testIds = [...new Set(questions.map(q=>q.testId).filter(Boolean))];
  const sectionIds = [...new Set(questions.map(q=>q.sectionId).filter(Boolean))];
  const [testDocs, sectionDocs] = await Promise.all([
    Promise.all(testIds.map(id => Data.getTest(id))),
    Promise.all(sectionIds.map(id => Data.getSection(id))),
  ]);
  const testMap = Object.fromEntries(testIds.map((id,i)=>[id, testDocs[i]]));
  const sectionMap = Object.fromEntries(sectionIds.map((id,i)=>[id, sectionDocs[i]]));
  const snapById = Object.fromEntries(snaps.filter(s=>s.exists()).map(s=>[s.id, {id:s.id,...s.data()}]));
  const out = [];
  for(const it of items){
    const q = snapById[it.questionId];
    if(!q) continue;
    const test = testMap[q.testId], sec = sectionMap[q.sectionId];
    out.push({ ref:it, question:q, testTitle: test?.title||'—', sectionName: sec?.name||'—' });
  }
  return out;
}

/* ============ QUIZ ENGINE ============ */
async function buildQuizForScope(scope, sectionId, testId){
  let questions=[], testTitle='', sectionName='';
  if(scope==='test'){
    const [test,sec] = await Promise.all([Data.getTest(testId), Data.getSection(sectionId)]);
    questions = await Data.getQuestions(testId);
    testTitle = test?.title||'Test'; sectionName = sec?.name||'';
  } else if(scope==='sectionAll'){
    const sec = await Data.getSection(sectionId);
    questions = await Data.getQuestionsBySection(sectionId);
    testTitle = 'All Tests'; sectionName = sec?.name||'';
  } else if(scope==='allSections'){
    const snap = await getDocs(questionsCol);
    questions = snap.docs.map(d=>({id:d.id,...d.data()}));
    testTitle = 'All Sections'; sectionName = 'All Sections';
  } else if(scope==='important'){
    questions = await Data.getImportantQuestions();
    testTitle = 'Important Questions'; sectionName = 'Important';
  } else if(scope==='offlineTest'){
    const blob = getOfflineBlob();
    const sec = blob ? (blob.sections||[]).find(s=>s.id===sectionId) : null;
    const test = blob ? (blob.tests||[]).find(t=>t.id===testId) : null;
    questions = offlineQuestionsForTest(testId);
    testTitle = test?.title || 'Test'; sectionName = sec?.name || '';
  } else if(scope==='offlineSectionAll'){
    const blob = getOfflineBlob();
    const sec = blob ? (blob.sections||[]).find(s=>s.id===sectionId) : null;
    questions = sortByOrder((blob && blob.questions ? blob.questions.filter(q=>q.sectionId===sectionId) : []).slice());
    testTitle = 'All Tests'; sectionName = sec?.name || '';
  } else if(scope==='offlineAll'){
    const blob = getOfflineBlob();
    questions = sortByOrder((blob && blob.questions ? blob.questions.slice() : []));
    testTitle = 'All Sections'; sectionName = 'All Sections (Offline)';
  }
  return { scope, sectionId:sectionId||null, testId:testId||null, testTitle, sectionName, questions };
}
function newQuizSession(built, key){
  return {
    key,
    scope: built.scope, sectionId: built.sectionId, testId: built.testId,
    testTitle: built.testTitle, sectionName: built.sectionName,
    questions: built.questions,
    currentIndex: 0,
    answers: {}, savedSet: new Set(), reviewSet: new Set(), timeSpent: {},
    questionShownAt: Date.now(), quizStartedAt: Date.now(), startedAtWall: new Date(),
  };
}
async function attachSavedSet(session){
  try{
    const snap = await getDocs(query(savedCol, where('userId','==',state.user.id)));
    const savedQids = new Set(snap.docs.map(d=>d.data().questionId));
    session.questions.forEach(q=>{ if(savedQids.has(q.id)) session.savedSet.add(q.id); });
  }catch(e){ console.error('attachSavedSet failed (offline?)', e); }
}
async function renderQuizRoute(segs){
  const [scope, a, b] = segs;
  let sectionId=null, testId=null;
  if(scope==='test'){ sectionId=a; testId=b; }
  else if(scope==='sectionAll'){ sectionId=a; }
  else if(scope==='custom'){ testId=a; }
  else if(scope==='important'){ testId='important'; }
  else if(scope==='offlineTest'){ sectionId=a; testId=b; }
  else if(scope==='offlineSectionAll'){ sectionId=a; }

  const expectedKey = `${scope}:${sectionId||''}:${testId||''}`;
  if(!state.quiz || state.quiz.key!==expectedKey){
    let built;
    if(scope==='custom'){
      const ids = state.cache.customQuestionIds||[];
      const questions = await Data.getQuestionsByIds(ids);
      built = { scope:'custom', sectionId:null, testId:a,
        testTitle: a==='wrong' ? 'Wrong Questions Review' : 'Saved Questions Review',
        sectionName: 'Review', questions };
    } else {
      built = await buildQuizForScope(scope, sectionId, testId);
    }
    if(!built.questions.length) return emptyBlock('No questions available for this selection yet.');
    state.quiz = newQuizSession(built, expectedKey);
    if(!scope.startsWith('offline')) await attachSavedSet(state.quiz);
  }
  return renderQuizScreen();
}
function currentQuestion(){ return state.quiz.questions[state.quiz.currentIndex]; }
function accumulateCurrentQuestionTime(){
  const quiz = state.quiz; if(!quiz) return;
  const q = currentQuestion();
  const now = Date.now();
  quiz.timeSpent[q.id] = (quiz.timeSpent[q.id]||0) + (now - quiz.questionShownAt);
  quiz.questionShownAt = now;
}
function updateQuizTimerDisplay(){
  if(!state.quiz) return;
  const el = document.getElementById('quiz-timer');
  if(!el) return;
  const elapsed = Math.floor((Date.now()-state.quiz.quizStartedAt)/1000);
  const m = String(Math.floor(elapsed/60)).padStart(2,'0');
  const s = String(elapsed%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
}

function gotoQuestion(idx){
  accumulateCurrentQuestionTime();
  state.quiz.currentIndex = idx; state.quiz.questionShownAt = Date.now(); render();

function quizNext(){ if(state.quiz.currentIndex < state.quiz.questions.length-1) gotoQuestion(state.quiz.currentIndex+1); }
function quizPrev(){ if(state.quiz.currentIndex > 0) gotoQuestion(state.quiz.currentIndex-1); }
function buildReviewGateItems(){
  const quiz = state.quiz, items = [];
  quiz.questions.forEach((q,i)=>{ if(quiz.reviewSet.has(q.id)) items.push({index:i, text:q.text}); });
  return items;

async function finalizeQuiz(){
  const quiz = state.quiz;
  const durationSec = Math.round((Date.now()-quiz.quizStartedAt)/1000);
  const answersArr = quiz.questions.map(q => {
    const selectedIndex = quiz.answers[q.id] !== undefined ? quiz.answers[q.id] : -1;
    const isCorrect = selectedIndex === q.correctIndex;
    const timeSpentSec = Math.round((quiz.timeSpent[q.id]||0)/1000);
    return {
      questionId:q.id, text:q.text, options:q.options, correctIndex:q.correctIndex,
      selectedIndex, isCorrect, timeSpentSec, saved: quiz.savedSet.has(q.id), reviewed: quiz.reviewSet.has(q.id)
    };
  });
  const score = answersArr.filter(a=>a.isCorrect).length;
  const attemptData = {
    userId: state.user.id,
    scopeType: quiz.scope,
    sectionId: quiz.sectionId || null,
    sectionName: quiz.sectionName,
    testId: quiz.testId || null,
    testTitle: quiz.testTitle,
    startedAt: quiz.startedAtWall,
    finishedAt: new Date(),
    durationSec, score, total: answersArr.length,
    answers: answersArr,
  };
  if(quiz.scope.startsWith('offline')){
    state.lastAttempt = { id:'offline', ...attemptData };
    state.quiz = null; state.modal = null;
    navigate('#/user/result/offline');
    return;
  }
  let saveFailed = false;
  let attemptId = null;
  try{
    const wrongWritesPromise = Promise.all(quiz.questions.map(q => {
      const a = answersArr.find(x=>x.questionId===q.id);
      return a.isCorrect ? Data.removeWrong(state.user.id, q.id) : Data.upsertWrong(state.user.id, q);
    }));
    [attemptId] = await Promise.all([ Data.addAttempt(attemptData), wrongWritesPromise ]);
  }catch(e){
    console.error('finalizeQuiz save failed (offline?)', e);
    saveFailed = true;
  }
  state.quiz = null; state.modal = null;
  if(saveFailed){
    state.lastAttempt = { id:'offline', ...attemptData };
    navigate('#/user/result/offline');
  } else {
    navigate(`#/user/result/${attemptId}`);
  }
}
async function renderResult(attemptId){

  const backHtml = isOffline
    ? `<button class="btn btn-ghost" data-action="go" data-hash="#/user/offline">Back to Offline Sections</button>`
    : `<button class="btn btn-ghost" data-action="go" data-hash="#/user/sections">Back to Sections</button>`;
  return `
  <div class="center-screen" style="min-height:0;padding:30px 0;">
    <div style="width:100%;max-width:480px;">
      ${isOffline ? `<div class="offline-banner">⚠️ This result could not be saved to your history (no internet connection). It's shown here only.</div>` : ''}
      <div class="card" style="text-align:center;">
        <div class="step-mark" style="justify-content:center;margin-bottom:14px;"><i></i><i></i><i></i><i></i></div>
        <div style="font-size:38px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--amber);">${a.score}/${a.total}</div>
        <div class="muted" style="margin-bottom:10px;">${pct}% correct</div>
        <div class="muted mono" style="font-size:13px;">${ICON.clock} ${fmtDuration(a.durationSec)}</div>
      </div>
      <div class="row-between" style="gap:10px;flex-wrap:wrap;">
        ${nextTestHtml}${retakeHtml}
        ${backHtml}
      </div>
    </div>
  </div>
  ${wrongAnswers.length ? `<h2 style="margin-top:10px;">Missed Questions</h2>` : ''}
  ${wrongAnswers.map(w=>`
    <div class="card">
      <div class="q-text" style="font-size:15px;">${esc(w.text)}</div>
      ${w.options.map((opt,i)=>{
        let cls='';
        if(i===w.correctIndex) cls='correct'; else if(i===w.selectedIndex) cls='wrong';
        return `<div class="option ${cls}"><span class="letter">${letterOf(i)}</span><span>${esc(opt)}</span></div>`;
      }).join('')}
    </div>`).join('')}
  `;
}

async function approvePasswordRequest(id){
  const r = await Data.getReport(id); if(!r) return;
  if(!confirm(`Set this password for user #${r.requestedByNumber||''}?`)) return;
  try{
    await Data.setUserPassword(r.requestedBy, r.desiredPassword||'');
    await Data.finishReport({...r, changeSummary:'Password request approved'}, {number:state.user.number, name:state.user.name||''});
    if(state.user && state.user.id===r.requestedBy) state.user.password = r.desiredPassword||'';
    toast('Password updated for the user');
  }catch(e){ console.error(e); toast('Could not update the password'); }
  render();
}
async function rejectPasswordRequest(id){
  const r = await Data.getReport(id); if(!r) return;
  if(!confirm('Reject this password request?')) return;
  try{ await Data.finishReport({...r, changeSummary:'Password request rejected'}, {number:state.user.number, name:state.user.name||''}); toast('Request rejected'); }
  catch(e){ console.error(e); toast('Could not reject the request'); }

}

/* ============ MODAL SUBMIT HANDLERS ============ */
async function handleModalConfirm(){
  const m = state.modal;
  if(!m) return;
  if(m.type==='textInput'){
    const input = document.getElementById('modal-input-val');
    const val = input ? input.value.trim() : '';
    if(!val) return;
    if(m.purpose==='addSection'){ await Data.addSection(val); }
    else if(m.purpose==='editSection'){ await Data.updateSection(m.id, val); }
    else if(m.purpose==='setUserPassword'){
      await Data.setUserPassword(m.id, val);
      toast('Password saved');
    }
    else if(m.purpose==='requestPassword'){
      const hasPassword = !!(state.user && state.user.password);
      await Data.addPasswordRequest({ requestedBy: state.user.id, requestedByNumber: state.user.number, requestedByName: state.user.name||'', desiredPassword: val, hasExistingPassword: hasPassword });
      toast('Request sent to the admin');
    }
    else if(m.purpose==='editTestTitle'){
      const orderInput = document.getElementById('modal-input-order');
      const orderVal = orderInput && orderInput.value!=='' ? parseInt(orderInput.value,10) : null;
      const data = { title: val };
      if(orderVal!==null && !isNaN(orderVal)) data.order = orderVal;
      await Data.updateTest(m.id, data);
    }
    else if(m.purpose==='createTestManual'){
      const orderInput = document.getElementById('modal-input-order');
      const orderVal = orderInput && orderInput.value!=='' ? parseInt(orderInput.value,10) : undefined;
      const testId = await Data.addTest(m.sectionId, val, orderVal);
      state.modal = null;
      navigate(`#/admin/sections/${m.sectionId}/tests/${testId}`);
      return;
    }
  } else if(m.type==='confirm'){
    if(m.purpose==='deleteSection') await Data.deleteSection(m.id);
    else if(m.purpose==='deleteTest') await Data.deleteTest(m.id);
    else if(m.purpose==='deleteQuestion') await Data.deleteQuestion(m.id);
  }
  state.modal = null;
  render();
}
async function handleModalChoice(value){
  const m = state.modal;
  if(m.purpose==='addTestChoice'){
    if(value==='manual'){
      setModal({ type:'textInput', title:'New Test', label:'Test title', placeholder:'e.g. Test 1', confirmLabel:'Create', purpose:'createTestManual', sectionId:m.sectionId, showOrder:true, orderValue:null });
    } else {
      setModal({ type:'quickAdd', purpose:'createTestQuick', sectionId:m.sectionId });
    }
  }
}
async function handleQuickAddSubmit(){
  const m = state.modal;
  const ta = document.getElementById('modal-quickadd');
  const parsed = parseQuickAdd(ta ? ta.value : '');
  if(!parsed.questions.length){ alert('No questions detected. Check the format and try again.'); return; }
  const title = parsed.title || 'Untitled Test';
  const testId = await Data.addTest(m.sectionId, title);
  const valid = parsed.questions.filter(q => q.correctIndex >= 0 && q.options.length >= 2);
  await Promise.all(valid.map(q => Data.addQuestion(testId, m.sectionId, q)));
  state.modal = null;
  navigate(`#/admin/sections/${m.sectionId}/tests/${testId}`);
}
async function handleQuestionSubmit(editId){
  const m = state.modal;
  const text = document.getElementById('qm-text').value.trim();
  const orderInput = document.getElementById('qm-order');
  const orderVal = orderInput && orderInput.value!=='' ? parseInt(orderInput.value,10) : null;
  const optsContainer = document.getElementById('question-modal-options');
  const rows = optsContainer ? Array.from(optsContainer.querySelectorAll(':scope > .opt-drag-row')) : [];
  const rawOptions = rows.map(r => r.querySelector('.qm-opt-input').value.trim());
  let correctIndex = -1;
  rows.forEach((r,i)=>{ if(r.querySelector('.qm-radio').checked) correctIndex = i; });
  if(!text || !rawOptions[0] || !rawOptions[1] || !rawOptions[2] || correctIndex===-1){
    alert('Please fill in the question, at least options A–C, and select the correct answer.');
    return;
  }
  const options = rawOptions[3] ? rawOptions : rawOptions.slice(0,3);
  if(correctIndex >= options.length){
    alert('The selected correct answer must be one of the filled-in options.');
    return;
  }
  const data = { text, options, correctIndex };
  if(orderVal!==null && !isNaN(orderVal)) data.order = orderVal;
  if(m.important){ await addOrEditImportant(editId, data); return; }
  if(editId){
    await Data.updateQuestion(editId, data);
    if(state.quiz){ const qi=state.quiz.questions.findIndex(x=>x.id===editId); if(qi>=0) state.quiz.questions[qi]={...state.quiz.questions[qi],...data}; }
    if(m.reportId){ await Data.updateReport(m.reportId,{questionAfter:{...m.question,...data},changeSummary:`Question edited by #${state.user.number}`,editedBy:state.user.number}); state.modal=null; toast('Question updated'); navigate(`#/admin/reports/${m.reportId}`); return; }
  } else {
    await Data.addQuestion(m.testId, m.sectionId, data);
  }
  state.modal = null;
  render();
}

/* ============ GLOBAL EVENT BINDING (once) ============ */
async function onAppClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  if(t.tagName==='INPUT'){ return; } // let checkboxes toggle natively; handled by the 'change' listener
  e.preventDefault();
  const action = t.dataset.action;
  switch(action){
    case 'go': navigate(t.dataset.hash); break;
    case 'back': goBack(); break;
    case 'logout': doLogout(); break;
    case 'open-menu': state.menuOpen = true; renderChromeOnly(); break;
    case 'close-menu': state.menuOpen = false; renderChromeOnly(); break;
    case 'menu-backdrop': if(e.target === t){ state.menuOpen = false; renderChromeOnly(); } break;
    case 'modal-backdrop': if(e.target === t) closeModal(); break;
    case 'modal-cancel': closeModal(); break;

    case 'delete-ref': await deleteRefAction(t.dataset.kind, t.dataset.qid); break;
    case 'review-list': await startReviewListAction(t.dataset.source); break;

    case 'start-quiz': await startQuizAction(t.dataset.scope, t.dataset.sectionId, t.dataset.testId); break;
    case 'start-offline-quiz': await startOfflineQuizAction(t.dataset.scope, t.dataset.sectionId, t.dataset.testId); break;
    case 'refresh-offline': await refreshOfflineData(); break;
    case 'select-option': selectOption(parseInt(t.dataset.index,10)); break;
    case 'toggle-save': await toggleSave(); break;
    case 'toggle-review': toggleReview(); break;
    case 'goto-question': gotoQuestion(parseInt(t.dataset.index,10)); break;
    case 'quiz-next': quizNext(); break;
    case 'quiz-prev': quizPrev(); break;
    case 'quiz-submit': quizSubmitClicked(); break;
    case 'quiz-submit-final': await finalizeQuiz(); break;
    case 'review-jump': { state.modal = null; gotoQuestion(parseInt(t.dataset.index,10)); break; }

    case 'add-section': openAddSectionModal(); break;
    case 'edit-section': openEditSectionModal(t.dataset.id, t.dataset.name); break;
    case 'delete-section': openDeleteSectionConfirm(t.dataset.id, t.dataset.name); break;
    case 'add-test': openAddTestChoiceModal(t.dataset.sectionId); break;
    case 'edit-test-title': openEditTestTitleModal(t.dataset.id, t.dataset.sectionId, t.dataset.title, t.dataset.order); break;
    case 'delete-test': openDeleteTestConfirm(t.dataset.id, t.dataset.sectionId, t.dataset.title); break;
    case 'add-question': openQuestionModal(t.dataset.testId, t.dataset.sectionId); break;
    case 'edit-question': await openEditQuestionModal(t.dataset.id, t.dataset.testId, t.dataset.sectionId); break;
    case 'delete-question': openDeleteQuestionConfirm(t.dataset.id, t.dataset.testId, t.dataset.sectionId); break;

    case 'toggle-admin-mode':
      if(state.user && state.user.isAdmin){ state.viewMode=state.viewMode==='admin'?'user':'admin'; state.menuOpen=false; if(state.quiz) render(); else navigate(state.viewMode==='admin'?'#/admin/home':'#/user/home'); }
      break;
    case 'report-question': openQuestionReport(); break;
    case 'submit-report': await submitQuestionReport(); break;
    case 'start-important': await startImportantReview(); break;
    case 'edit-current-question': openQuestionModal(currentQuestion().testId,currentQuestion().sectionId); state.modal.editId=currentQuestion().id; state.modal.question=currentQuestion(); render(); break;
    case 'edit-report-question': await openReportEditor(t.dataset.id); break;
    case 'finish-report': await finishReport(t.dataset.id); break;
    case 'rename-user': await renameUser(t.dataset.id,t.dataset.name); break;
    case 'toggle-user-admin': await toggleUserAdmin(t.dataset.id,t.dataset.admin==='true'); break;
    case 'delete-user': await deleteUser(t.dataset.id); break;
    case 'set-user-password': openSetPasswordModal(t.dataset.id, t.dataset.has==='1'); break;
    case 'toggle-notifications': toggleAdminHomeNotifications(); break;
    case 'approve-password-request': await approvePasswordRequest(t.dataset.id); break;
    case 'reject-password-request': await rejectPasswordRequest(t.dataset.id); break;
    case 'request-password': openRequestPasswordModal(); break;
    case 'submit-login-password': await submitLoginPassword(); break;
    case 'add-important': openImportantEditor(null); break;
    case 'edit-important': { const qs=await Data.getImportantQuestions(); openImportantEditor(t.dataset.id,qs.find(q=>q.id===t.dataset.id)); break; }
    case 'delete-important': if(confirm('Delete this important question?')){await Data.deleteImportantQuestion(t.dataset.id);render();} break;

    case 'modal-confirm': await handleModalConfirm(); break;
    case 'modal-choice': await handleModalChoice(t.dataset.value); break;
    case 'modal-quickadd-submit': await handleQuickAddSubmit(); break;
    case 'modal-question-submit': await handleQuestionSubmit(t.dataset.editId || null); break;
  }
}
async function onAppChange(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  if(t.dataset.action==='toggle-offline'){ await toggleOfflineMode(t.checked); }
  else if(t.dataset.action==='toggle-live-grading'){ await toggleLiveGrading(t.checked); }
}
async function toggleLiveGrading(v){
  state.settings.liveGrading = v;
  try{
    await Data.updateSettings({ liveGrading: v });
    toast(v ? 'Live grading turned ON' : 'Live grading turned OFF');
  }catch(e){
    console.error('toggleLiveGrading failed', e);
    toast('Could not save the setting — check your connection');
  }
  render();
}
async function onAppSubmit(e){
  if(e.target.id === 'login-form'){
    e.preventDefault();
    const raw = document.getElementById('login-number').value.trim();
    if(!raw) return;
    const number = raw.replace(/\s+/g,'');
    if(number === ADMIN_NUMBER){
      let u = await Data.getUser(ADMIN_NUMBER);
      if(!u) u = await Data.createUser(ADMIN_NUMBER, 'Admin', true);
      state.user = u; state.viewMode='admin';
      saveSession(u);
      navigate('#/admin/home');
    } else {
      let u = await Data.getUser(number);
      if(u){
        if(u.password){
          state.pendingLoginUser = u;
          setModal({ type:'passwordPrompt' });
        } else {
          state.user = u; state.viewMode='user'; saveSession(u); navigate('#/user/home');
        }
      }
      else { state.pendingNumber = number; navigate('#/name'); }
    }
  } else if(e.target.id === 'name-form'){
    e.preventDefault();
    const name = document.getElementById('name-input').value.trim();
    if(!name) return;
    const u = await Data.createUser(state.pendingNumber, name, false);
    state.user = u; state.pendingNumber = null;
    saveSession(u);
    navigate('#/user/home');
  }
}
function saveSession(u){
  try{ localStorage.setItem('step_session', JSON.stringify({ number: u.number })); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('step_session'); }catch(e){}
}

/* ============ OFFLINE MODE (download sections/tests/questions for local browsing) ============ */
function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function offlineBlobKey(){ return 'step_offline_' + (state.user ? state.user.number : ''); }
function offlineToggleKey(){ return 'step_offline_on_' + (state.user ? state.user.number : ''); }
function offlineEnabled(){ return state.user ? localStorage.getItem(offlineToggleKey())==='1' : false; }
function setOfflineEnabled(v){ if(state.user) try{ localStorage.setItem(offlineToggleKey(), v?'1':'0'); }catch(e){} }
function getOfflineBlob(){
  if(!state.user) return null;
  try{ const v = localStorage.getItem(offlineBlobKey()); const b=v?JSON.parse(v):null; return b && Array.isArray(b.sections) && Array.isArray(b.tests) && Array.isArray(b.questions) ? b : null; }catch(e){ return null; }
}
function saveOfflineBlob(b){
  if(!state.user) return false;
  try{ b.syncedAt = Date.now(); localStorage.setItem(offlineBlobKey(), JSON.stringify(b)); return true; }
  catch(e){ console.error('offline save failed', e); return false; }
}
async function downloadOfflineData(){
  const [secSnap, testSnap, qSnap] = await Promise.all([ getDocs(sectionsCol), getDocs(testsCol), getDocs(questionsCol) ]);
  const sections = secSnap.docs.map(d=>({ id:d.id, name:d.data().name }));
  const tests = testSnap.docs.map(d=>({ id:d.id, sectionId:d.data().sectionId, title:d.data().title, order: (typeof d.data().order==='number'?d.data().order:0) }));
  const questions = qSnap.docs.map(d=>({
    id:d.id, testId:d.data().testId, sectionId:d.data().sectionId, text:d.data().text,
    options:d.data().options, correctIndex:d.data().correctIndex, order: (typeof d.data().order==='number'?d.data().order:0)
  }));
  const ok = saveOfflineBlob({ sections, tests, questions });
  if(!ok) throw new Error('Could not save the offline copy (storage full or unavailable)');
  return { sections, tests, questions };
}
async function toggleOfflineMode(v){
  setOfflineEnabled(v);
  if(v){
    toast('Downloading offline copy...');
    try{ await downloadOfflineData(); toast('Offline copy downloaded ✓'); }
    catch(e){ console.error(e); toast('Could not download right now — check your connection'); }
  } else {
    toast('Offline downloads turned off');
  }
  render();
}
async function refreshOfflineData(){
  toast('Refreshing offline data...');
  try{ await downloadOfflineData(); toast('Offline data refreshed ✓'); }
  catch(e){ console.error(e); toast('Could not refresh — check your connection'); }
  render();
}
function offlineTestsForSection(sectionId){
  const blob = getOfflineBlob();
  if(!blob) return [];
  return sortByOrder((blob.tests||[]).filter(t=>t.sectionId===sectionId));
}
function offlineQuestionsForTest(testId){
  const blob = getOfflineBlob();
  if(!blob) return [];
  return sortByOrder((blob.questions||[]).filter(q=>q.testId===testId));
}
function renderOfflineSections(){
  const blob = getOfflineBlob();
  if(!blob || !blob.sections || !blob.sections.length){
    return emptyBlock('No offline copy yet. Turn on "Download Sections" in the menu while you have an internet connection.');
  }
  return `
  <h1 class="page-title">Offline Sections</h1>
  <p class="page-sub">Last synced: ${blob.syncedAt ? new Date(blob.syncedAt).toLocaleString('en-US') : '—'}</p>
  <button class="btn btn-amber" style="margin-bottom:16px;" data-action="start-offline-quiz" data-scope="offlineAll">Test All Offline Sections</button>
  <div class="grid grid-2">
  ${blob.sections.map(s=>{
    const count = (blob.questions||[]).filter(q=>q.sectionId===s.id).length;
    return `<div class="card clickable" data-action="go" data-hash="#/user/offline/${s.id}">
      <div class="row-between"><div style="font-weight:700;font-size:16px;">${esc(s.name)}</div><span style="color:var(--teal);">${ICON.section}</span></div>
      <div class="muted" style="font-size:12.5px;margin-top:6px;">${count} question(s)</div>
    </div>`;
  }).join('')}
  </div>`;
}
function renderOfflineSectionTests(sectionId){
  const blob = getOfflineBlob();
  if(!blob) return emptyBlock('No offline copy yet.');
  const sec = (blob.sections||[]).find(s=>s.id===sectionId);
  const tests = offlineTestsForSection(sectionId);
  return `
  <h1 class="page-title">${esc(sec ? sec.name : 'Section')} <span class="offline-tag">(offline)</span></h1>
  <p class="page-sub">Choose a test to begin, or run the whole section — no internet needed.</p>
  ${tests.length ? `<button class="btn btn-amber" style="margin-bottom:16px;" data-action="start-offline-quiz" data-scope="offlineSectionAll" data-section-id="${sectionId}">Test All Tests in This Section</button>` : ''}
  ${tests.length===0 ? emptyBlock('No tests cached for this section yet.') :
    tests.map(t=>`
      <div class="card clickable" data-action="start-offline-quiz" data-scope="offlineTest" data-section-id="${sectionId}" data-test-id="${t.id}">
        <div class="row-between"><div style="font-weight:700;font-size:15.5px;"><span class="order-badge">${t.order!=null?t.order:'—'}</span>${esc(t.title)}</div><span style="color:var(--teal);">${ICON.check}</span></div>
      </div>`).join('')}
  `;
}

async function initApp(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('step_session') || 'null'); }catch(e){}
  const settingsPromise = Data.getSettings().catch(()=>({liveGrading:false}));
  if(saved && saved.number){
    try{
      const [u, s] = await Promise.all([ Data.getUser(saved.number), settingsPromise ]);
      state.settings = s;
      if(u){
        state.user = u; state.viewMode = u.isAdmin && location.hash.startsWith('#/admin') ? 'admin' : 'user';
        if(!location.hash || location.hash==='#/login' || location.hash==='#/name'){
          location.hash = u.isAdmin ? '#/admin/home' : '#/user/home';
        }
      } else {
        clearSession();
      }
    }catch(e){ clearSession(); }
  } else {
    state.settings = await settingsPromise;
  }
  if(!location.hash) location.hash = '#/login';
  render();
}

app.addEventListener('click', onAppClick);
app.addEventListener('change', onAppChange);
app.addEventListener('submit', onAppSubmit);
window.addEventListener('hashchange', render);
initApp();
</script>
