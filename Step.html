<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0F1620;
  --surface:#172233;
  --surface-2:#1E2C40;
  --border:#2A3B52;
  --border-soft:#22314A;
  --text:#E8ECEF;
  --text-muted:#8FA3B8;
  --text-faint:#5E7288;
  --teal:#3FA796;
  --teal-dim:#2C7A6D;
  --amber:#F2A65A;
  --red:#E15A4D;
  --green:#4CAF7D;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #14202E 0%, #0F1620 55%, #0B111A 100%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
.mono{ font-family:'JetBrains Mono',monospace; }
a{color:inherit;}
button{ font-family:inherit; cursor:pointer; }
::selection{ background:var(--teal); color:#08110E; }

#app{ max-width:960px; margin:0 auto; padding:0 20px 80px; min-height:100vh; }
.center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }

/* ---- Step motif ---- */
.step-mark{ display:flex; align-items:flex-end; gap:4px; height:26px; }
.step-mark i{ display:block; width:7px; background:var(--teal); border-radius:2px; opacity:.35; }
.step-mark i:nth-child(1){ height:8px; }
.step-mark i:nth-child(2){ height:14px; opacity:.6; }
.step-mark i:nth-child(3){ height:20px; opacity:.85; }
.step-mark i:nth-child(4){ height:26px; opacity:1; }

.brand{ display:flex; align-items:center; gap:10px; }
.brand .wordmark{ font-size:22px; font-weight:700; letter-spacing:.02em; }
.brand .wordmark span{ color:var(--teal); }

/* ---- Top bar ---- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 0; margin-bottom:10px;
  background:linear-gradient(var(--bg) 70%, transparent);
  backdrop-filter:blur(6px);
}
.topbar .left{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:40px; height:40px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  transition:.15s;
}
.icon-btn:hover{ background:var(--surface-2); border-color:var(--teal-dim); }
.icon-btn svg{ width:18px; height:18px; }

/* ---- Cards / layout ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-bottom:14px;
}
.card:hover.clickable{ border-color:var(--teal-dim); }
.clickable{ cursor:pointer; transition:.15s; }
.clickable:hover{ transform:translateY(-1px); }
.grid{ display:grid; gap:14px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
@media (max-width:640px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px;
}
.stat .num{ font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:var(--amber); }
.stat .label{ color:var(--text-muted); font-size:13px; margin-top:4px; }

.page-title{ font-size:26px; font-weight:700; margin:6px 0 4px; }
.page-sub{ color:var(--text-muted); font-size:14px; margin-bottom:20px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-weight:600; font-size:14px;
  transition:.15s;
}
.btn:hover{ border-color:var(--teal-dim); }
.btn-primary{ background:var(--teal); border-color:var(--teal); color:#062420; }
.btn-primary:hover{ background:#49bdaa; }
.btn-amber{ background:var(--amber); border-color:var(--amber); color:#3A1F02; }
.btn-danger{ background:transparent; border-color:var(--red); color:var(--red); }
.btn-danger:hover{ background:rgba(225,90,77,.1); }
.btn-ghost{ background:transparent; border-color:var(--border); }
.btn-block{ width:100%; }
.btn-sm{ padding:7px 12px; font-size:13px; border-radius:8px; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }

input[type=text],input[type=tel],input[type=number],textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:10px; font-size:15px; font-family:inherit; outline:none;
}
input:focus,textarea:focus{ border-color:var(--teal); }
textarea{ resize:vertical; min-height:120px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6; }
label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
.field{ margin-bottom:16px; }

.row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.muted{ color:var(--text-muted); }
.faint{ color:var(--text-faint); }
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em;
}
.badge-teal{ background:rgba(63,167,150,.15); color:var(--teal); }
.badge-amber{ background:rgba(242,166,90,.15); color:var(--amber); }
.badge-red{ background:rgba(225,90,77,.15); color:var(--red); }
.badge-green{ background:rgba(76,175,125,.15); color:var(--green); }

.empty{ text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty .step-mark{ margin:0 auto 14px; opacity:.5; }

/* ---- Slide menu ---- */
.menu-overlay{
  position:fixed; inset:0; background:rgba(5,9,14,.6); z-index:50;
  display:flex; justify-content:flex-end;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.menu-panel{
  width:300px; max-width:85vw; height:100%; background:var(--surface); border-left:1px solid var(--border);
  padding:22px; display:flex; flex-direction:column; gap:6px;
  animation:slideIn .18s ease;
}
@keyframes slideIn{ from{ transform:translateX(30px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
.menu-item{
  display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:10px;
  color:var(--text); font-weight:600; font-size:14.5px; border:1px solid transparent;
}
.menu-item:hover{ background:var(--surface-2); border-color:var(--border); }
.menu-item svg{ width:18px; height:18px; color:var(--teal); flex-shrink:0; }
.menu-foot{ margin-top:auto; padding-top:16px; border-top:1px solid var(--border); }

/* ---- Modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,9,14,.65); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:24px;
  box-shadow:var(--shadow);
}
.modal h3{ margin-top:0; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

/* ---- Question ---- */
.q-text{ font-size:17px; font-weight:600; line-height:1.5; margin-bottom:18px; }
.option{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface-2); margin-bottom:10px; transition:.12s;
}
.option .letter{
  width:26px; height:26px; border-radius:7px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted); flex-shrink:0;
}
.option.selected{ border-color:var(--teal); background:rgba(63,167,150,.1); }
.option.selected .letter{ background:var(--teal); color:#062420; border-color:var(--teal); }
.option.correct{ border-color:var(--green); background:rgba(76,175,125,.12); }
.option.correct .letter{ background:var(--green); color:#06210f; border-color:var(--green); }
.option.wrong{ border-color:var(--red); background:rgba(225,90,77,.12); }
.option.wrong .letter{ background:var(--red); color:#2a0906; border-color:var(--red); }

.qpalette{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
.qdot{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-muted);
  font-family:'JetBrains Mono',monospace; position:relative;
}
.qdot.current{ border-color:var(--teal); color:var(--teal); }
.qdot.answered{ background:rgba(63,167,150,.18); color:var(--teal); border-color:var(--teal-dim); }
.qdot.reviewed:after{
  content:''; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--amber);
}

.quiz-actions{ display:flex; gap:8px; }
.quiz-actions .icon-btn.active{ border-color:var(--amber); color:var(--amber); }
.quiz-actions .icon-btn.active-save{ border-color:var(--teal); color:var(--teal); }

.progress-track{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-bottom:22px; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--amber)); }

.timer{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-muted);
  display:flex; align-items:center; gap:6px;
}

.login-wrap{ width:100%; max-width:380px; }
.login-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:34px 28px; box-shadow:var(--shadow); }
.login-hint{ font-size:12.5px; color:var(--text-faint); margin-top:14px; line-height:1.6; }

.spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--teal); animation:spin .7s linear infinite; margin:0 auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading-block{ padding:60px 0; text-align:center; color:var(--text-muted); }

hr.sep{ border:none; border-top:1px solid var(--border); margin:20px 0; }

table.simple{ width:100%; border-collapse:collapse; }
table.simple th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); }
table.simple td{ padding:12px 10px; border-bottom:1px solid var(--border-soft); font-size:14px; }
table.simple tr:last-child td{ border-bottom:none; }

.review-note{
  background:rgba(242,166,90,.1); border:1px solid rgba(242,166,90,.35); color:var(--amber);
  padding:12px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;
}


/* ===== Qudurat theme overlay ===== */
:root{
  --bg:#12172B; --bg-2:#0D1122;
  --surface:#1B2140; --surface-2:#232A4D; --surface-3:#2B3260;
  --text:#EDEAE0; --text-dim:#A7ACC8; --text-faint:#6B7196;
  --accent:#E8B44C; --accent-dim:#3A3221;
  --accent2:#4FA8A0;
  --danger:#E2637A; --danger-dim:#3A2530;
  --success:#6FCF97; --success-dim:#1E3A2C;
  --border:rgba(237,234,224,.12);
  --radius:16px; --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 20% -10%, #1B2140 0%, var(--bg) 45%, var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent);color:#12172B;}
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(18,23,43,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:flex;align-items:center;justify-content:center;transition:.15s;}
.icon-btn:hover{background:var(--surface-3);border-color:var(--accent);}
.topbar-title{font-weight:700;color:var(--text-dim);font-size:14px;letter-spacing:.5px;}

/* ---- drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(6,8,16,.6);z-index:29;opacity:0;pointer-events:none;transition:.25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;right:0;width:78%;max-width:320px;background:var(--surface);z-index:30;
  transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 0;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.drawer-head .num{font-family:'Tajawal';font-weight:800;font-size:22px;color:var(--accent);}
.drawer-head .tag{color:var(--text-faint);font-size:12px;}
.drawer-item{display:flex;align-items:center;gap:12px;padding:14px 20px;color:var(--text);text-decoration:none;
  border-right:3px solid transparent;transition:.15s;font-size:15px;}
.drawer-item:hover,.drawer-item.active{background:var(--surface-2);border-right-color:var(--accent);}
.drawer-item .ic{width:20px;text-align:center;color:var(--accent2);}

/* ---- content ---- */
.page{padding:20px 16px 12px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-title{font-size:22px;font-weight:800;margin:4px 0 18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.stat-card:before{content:'';position:absolute;top:-20px;left:-20px;width:70px;height:70px;background:var(--accent);opacity:.08;border-radius:50%;}
.stat-num{font-family:'Tajawal';font-size:28px;font-weight:800;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14.5px;transition:.15s;width:100%;}
.btn:hover{background:var(--surface-3);}
.btn-primary{background:var(--accent);color:#1a1408;border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1px solid var(--accent2);color:var(--accent2);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-row{display:flex;gap:10px;}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;transition:.15s;cursor:pointer;}
.list-item:hover{border-color:var(--accent2);}
.list-item .title{font-weight:700;font-size:15.5px;}
.list-item .sub{font-size:12px;color:var(--text-faint);margin-top:3px;}
.chip{font-size:11px;background:var(--surface-3);color:var(--text-dim);padding:3px 9px;border-radius:20px;}
.chip-danger{background:var(--danger-dim);color:var(--danger);}
.chip-success{background:var(--success-dim);color:var(--success);}
.icon-action{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.icon-action:hover{border-color:var(--danger);color:var(--danger);}

input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);
  color:var(--text);font-family:inherit;font-size:14.5px;margin-bottom:12px;}
textarea{resize:vertical;min-height:100px;}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field{margin-bottom:14px;}

/* login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.login-mark{font-family:'Tajawal';font-weight:900;font-size:44px;letter-spacing:2px;color:var(--accent);position:relative;}
.login-mark:after{content:'';display:block;width:70px;height:6px;background:var(--accent);margin:10px auto 0;border-radius:4px;opacity:.5;}
.login-sub{color:var(--text-dim);margin:10px 0 34px;font-size:14px;}
.login-box{width:100%;max-width:340px;}

/* quiz */
.progress-wrap{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:18px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transition:.3s;}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--text-faint);}
.q-tag{color:var(--accent);font-weight:700;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.q-instruction{color:var(--accent2);font-weight:700;font-size:13.5px;margin-bottom:10px;}
.q-text{font-size:17px;line-height:1.9;font-weight:600;margin-bottom:6px;}
.q-passage-link{font-size:12.5px;color:var(--accent2);text-decoration:underline;cursor:pointer;margin-bottom:10px;display:inline-block;}
.answer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;transition:.15s;cursor:pointer;}
.answer:hover{border-color:var(--accent2);}
.answer.selected{border-color:var(--accent);background:var(--accent-dim);}
.answer .letter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text-faint);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;color:var(--text-dim);}
.answer.selected .letter{background:var(--accent);border-color:var(--accent);color:#1a1408;}
.answer.correct{border-color:var(--success);background:var(--success-dim);}
.answer.correct .letter{background:var(--success);border-color:var(--success);color:#0c2016;}
.answer.wrong{border-color:var(--danger);background:var(--danger-dim);}
.answer.wrong .letter{background:var(--danger);border-color:var(--danger);color:#2c0f16;}
.quiz-tools{display:flex;gap:10px;margin-bottom:14px;}
.tool-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:.15s;}
.tool-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.tool-btn.review-active{border-color:var(--accent2);color:var(--accent2);background:rgba(79,168,160,.12);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,8,16,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.center{align-items:center;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;max-width:640px;width:100%;
  max-height:82vh;overflow-y:auto;padding:20px;}
.modal-overlay.center .modal{border-radius:var(--radius);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);}

.empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.5;}
.divider{height:1px;background:var(--border);margin:18px 0;}
.hidden{display:none !important;}
.type-badge{display:inline-block;font-size:11px;background:var(--surface-3);color:var(--accent2);padding:4px 10px;border-radius:8px;margin-bottom:8px;}
.small-note{font-size:12px;color:var(--text-faint);line-height:1.7;}
.pill-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}

/* ============ HELPERS ============ */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDuration(totalSec){
  totalSec = Math.max(0, Math.round(totalSec||0));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  if(h>0) return `${h}h ${m}m ${s}s`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}
function tsToDate(ts){
  if(!ts) return null;
  if(ts.toDate) return ts.toDate();
  if(ts.seconds) return new Date(ts.seconds*1000);
  if(ts instanceof Date) return ts;
  return new Date(ts);
}
function fmtDateTime(ts){
  const d = tsToDate(ts);
  if(!d) return '—';
  return d.toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}
function fmtTimeRange(startTs, endTs){
  const s = tsToDate(startTs), e = tsToDate(endTs);
  if(!s) return '—';
  const opts = { hour:'numeric', minute:'2-digit' };
  const dateStr = s.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const startStr = s.toLocaleTimeString('en-US', opts);
  const endStr = e ? e.toLocaleTimeString('en-US', opts) : startStr;
  return `${dateStr} · ${startStr} – ${endStr}`;
}
function sortByCreatedAt(arr, dir='asc'){
  return arr.sort((a,b)=>{
    const da = a.createdAt ? tsToDate(a.createdAt).getTime() : 0;
    const db_ = b.createdAt ? tsToDate(b.createdAt).getTime() : 0;
    return dir==='asc' ? da-db_ : db_-da;
  });
}

function orderValue(item, fallback=0){
  const n = Number(item?.order);
  return Number.isFinite(n) ? n : fallback;
}
function sortByOrder(arr){
  return arr.slice().sort((a,b)=>{
    const ao = Number.isFinite(Number(a.order)) ? Number(a.order) : Number.POSITIVE_INFINITY;
    const bo = Number.isFinite(Number(b.order)) ? Number(b.order) : Number.POSITIVE_INFINITY;
    if(ao!==bo) return ao-bo;
    const ac = a.createdAt ? tsToDate(a.createdAt).getTime() : 0;
    const bc = b.createdAt ? tsToDate(b.createdAt).getTime() : 0;
    return ac-bc;
  });
}
function normalizeSequentialOrder(ids){
  return ids.map((id,i)=>({id,order:i+1}));
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function letterOf(i){ return ['A','B','C','D'][i]; }

function parseQuickAddLettered(raw){
  // Format: "Q: text" then separate lines "A) opt" "B) opt" "C) opt" "D) opt", correct marked with trailing *
  const lines = raw.split('\n');
  let title = '';
  const questions = [];
  let current = null;
  for(let line of lines){
    line = line.trim();
    if(!line) continue;
    if(/^(title|عنوان الاختبار|عنوان)\s*:/i.test(line)){
      title = line.replace(/^(title|عنوان الاختبار|عنوان)\s*:/i,'').trim();
    } else if(/^q\s*\d*:/i.test(line)){
      if(current && current.text && current.options.length>=2) questions.push(current);
      current = { text: line.replace(/^q\s*\d*:/i,'').trim(), options: [], correctIndex: -1 };
    } else if(/^[a-dA-D]\)/.test(line)){
      if(!current) continue;
      let opt = line.replace(/^[a-dA-D]\)/,'').trim();
      let isCorrect = false;
      if(opt.endsWith('*')){ isCorrect = true; opt = opt.slice(0,-1).trim(); }
      current.options.push(opt);
      if(isCorrect) current.correctIndex = current.options.length - 1;
    }
  }
  if(current && current.text && current.options.length>=2) questions.push(current);
  return { title, questions };
}
function findOptionMarkers(text){
  // Locates a contiguous run of option letters A,B,C[,D] each followed by ':' or '-'.
  const regex = /\b([A-D])[.:\-]\s*/g;
  const matches = [];
  let m;
  while((m = regex.exec(text))){
    matches.push({ letter:m[1], index:m.index, end: m.index+m[0].length });
  }
  for(let i=0;i<matches.length;i++){
    if(matches[i].letter!=='A') continue;
    const seq = [matches[i]];
    let expected = 'B';
    let broken = false;
    for(let j=i+1;j<matches.length;j++){
      if(matches[j].letter===expected){
        seq.push(matches[j]);
        if(expected==='B') expected='C';
        else if(expected==='C') expected='D';
        else break; // found D, a run can be at most 4 options
      } else if(expected==='D'){
        break; // no D present — a 3-option question, which is fine
      } else {
        broken = true; break; // sequence interrupted before reaching at least A,B,C
      }
    }
    if(!broken && seq.length>=3) return seq;
  }
  return null;
}
function parseQuickAddInline(raw){
  // Format: "Q1: question text? A: opt1. B: opt2. C: opt3. D: opt4*" or "A- opt1 B- opt2 C- opt3*"
  // (3 or 4 options, either ':' or '-' as separator). May span 2 lines: a context line with no
  // options, then the actual question+options on the next line. Correct option is whichever one
  // ends with "*", not necessarily the last.
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let title = '';
  let i = 0;
  if(lines.length && /^(title|عنوان الاختبار|عنوان)\s*:/i.test(lines[0]) && !/\b[A-D][.:\-]/.test(lines[0])){
    title = lines[0].replace(/^(title|عنوان الاختبار|عنوان)\s*:/i,'').trim();
    i = 1;
  }
  const questions = [];
  let buffer = '';
  for(; i<lines.length; i++){
    const line = lines[i];
    const qMatch = line.match(/^Q\s*\d+\s*:\s*(.*)$/i);
    buffer = qMatch ? qMatch[1] : (buffer ? (buffer + ' ' + line) : line);
    const seq = findOptionMarkers(buffer);
    if(seq){
      const stem = buffer.slice(0, seq[0].index).trim();
      let correctIndex = -1;
      const options = seq.map((marker, idx) => {
        const start = marker.end;
        const end = (idx+1 < seq.length) ? seq[idx+1].index : buffer.length;
        let clean = buffer.slice(start, end).trim();
        if(/\*\s*$/.test(clean)){ correctIndex = idx; clean = clean.replace(/\*\s*$/,'').trim(); }
        clean = clean.replace(/\.\s*$/,'').trim();
        return clean;
      });
      if(stem && options.length>=3 && options.every(o=>o)) questions.push({ text: stem, options, correctIndex });
      buffer = '';
    }
  }
  return { title, questions };
}
function parseQuickAdd(raw){
  const lettered = parseQuickAddLettered(raw);
  if(lettered.questions.length) return lettered;
  return parseQuickAddInline(raw);
}

/* ============ DATA LAYER ============ */
const Data = {
  // users
  async getUser(number){
    const snap = await getDoc(doc(usersCol, String(number)));
    return snap.exists() ? { id: snap.id, ...snap.data() } : null;
  },
  async createUser(number, name, isAdmin){
    const data = { number: String(number), name, isAdmin: !!isAdmin, createdAt: serverTimestamp() };
    await setDoc(doc(usersCol, String(number)), data);
    return { id: String(number), ...data, createdAt: new Date() };
  },
  async getAllUsers(){
    const snap = await getDocs(usersCol);
    return sortByCreatedAt(snap.docs.map(d=>({id:d.id,...d.data()})), 'desc');
  },

  // sections
  async getالأقسام(){
    const snap = await getDocs(sectionsCol);
    return sortByCreatedAt(snap.docs.map(d=>({id:d.id,...d.data()})), 'asc');
  },
  async getSection(id){
    const snap = await getDoc(doc(sectionsCol,id));
    return snap.exists() ? {id:snap.id,...snap.data()} : null;
  },
  async addSection(name, order=null){
    const existing = await Data.getالأقسام();
    const useOrder = Number.isFinite(Number(order)) && Number(order)>0 ? Number(order) : existing.length+1;
    const ref = await addDoc(sectionsCol, { name, order:useOrder, createdAt: serverTimestamp() });
    return ref.id;
  },
  async updateSection(id, name){ await updateDoc(doc(sectionsCol,id), { name }); },
  async deleteSection(id){
    const tests = await Data.getTests(id);
    await Promise.all(tests.map(t => Data.deleteTest(t.id)));
    await deleteDoc(doc(sectionsCol,id));
  },

  // tests
  async getTests(sectionId){
    const snap = await getDocs(query(testsCol, where('sectionId','==',sectionId)));
    return sortByOrder(snap.docs.map(d=>({id:d.id,...d.data()})));
  },
  async getTest(id){
    const snap = await getDoc(doc(testsCol,id));
    return snap.exists() ? {id:snap.id,...snap.data()} : null;
  },
  async nextTestOrder(sectionId){
    const tests = await Data.getTests(sectionId);
    return tests.length + 1;
  },
  async addTest(sectionId, title, order=null){
    const useOrder = Number.isFinite(Number(order)) && Number(order)>0 ? Number(order) : await Data.nextTestOrder(sectionId);
    const ref = await addDoc(testsCol, { sectionId, title, order:useOrder, createdAt: serverTimestamp() });
    return ref.id;
  },
  async updateTest(id, data){ await updateDoc(doc(testsCol,id), data); },
  async updateTestTitle(id, title, order=null){
    const data = { title };
    if(Number.isFinite(Number(order)) && Number(order)>0) data.order = Number(order);
    await Data.updateTest(id, data);
  },
  async reorderTests(sectionId, ids){
    const pairs = normalizeSequentialOrder(ids);
    const batch = writeBatch(db);
    pairs.forEach(({id,order})=> batch.update(doc(testsCol,id), {order}));
    await batch.commit();
  },
  async setTestOrder(sectionId, id, order){
    const tests = await Data.getTests(sectionId);
    const ids = tests.map(t=>t.id).filter(x=>x!==id);
    const target = Math.max(0, Math.min((parseInt(order,10)||1)-1, ids.length));
    ids.splice(target,0,id);
    await Data.reorderTests(sectionId, ids);
  },
  async deleteTest(id){
    const qs = await Data.getQuestions(id);
    const batch = writeBatch(db);
    qs.forEach(q => batch.delete(doc(questionsCol,q.id)));
    batch.delete(doc(testsCol,id));
    await batch.commit();
  },

  // questions
  async getQuestions(testId){
    const snap = await getDocs(query(questionsCol, where('testId','==',testId)));
    return sortByOrder(snap.docs.map(d=>({id:d.id,...d.data()})));
  },
  async getQuestionsBySection(sectionId){
    const [qSnap,tSnap] = await Promise.all([
      getDocs(query(questionsCol, where('sectionId','==',sectionId))),
      getDocs(query(testsCol, where('sectionId','==',sectionId)))
    ]);
    const tests = sortByOrder(tSnap.docs.map(d=>({id:d.id,...d.data()})));
    const testIdx = Object.fromEntries(tests.map((t,i)=>[t.id,i]));
    const list = qSnap.docs.map(d=>({id:d.id,...d.data()}));
    return list.sort((a,b)=>{
      const ta=testIdx[a.testId]??999999, tb=testIdx[b.testId]??999999;
      if(ta!==tb) return ta-tb;
      const ao=Number.isFinite(Number(a.order))?Number(a.order):999999;
      const bo=Number.isFinite(Number(b.order))?Number(b.order):999999;
      if(ao!==bo) return ao-bo;
      return (a.createdAt&&tsToDate(a.createdAt)?.getTime()||0)-(b.createdAt&&tsToDate(b.createdAt)?.getTime()||0);
    });
  },
  async getQuestionsByIds(ids){
    const snaps = await Promise.all(ids.map(id => getDoc(doc(questionsCol,id))));
    return sortByOrder(snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()})));
  },
  async nextQuestionOrder(testId){
    const questions = await Data.getQuestions(testId);
    return questions.length + 1;
  },
  async addQuestion(testId, sectionId, q){
    const useOrder = Number.isFinite(Number(q.order)) && Number(q.order)>0 ? Number(q.order) : await Data.nextQuestionOrder(testId);
    const ref = await addDoc(questionsCol, {
      testId, sectionId, text:q.text, options:q.options, correctIndex:q.correctIndex,
      order:useOrder, createdAt: serverTimestamp()
    });
    return ref.id;
  },
  async updateQuestion(id, data){ await updateDoc(doc(questionsCol,id), data); },
  async reorderQuestions(testId, ids){
    const pairs = normalizeSequentialOrder(ids);
    const batch = writeBatch(db);
    pairs.forEach(({id,order})=> batch.update(doc(questionsCol,id), {order}));
    await batch.commit();
  },
  async setQuestionOrder(testId, id, order){
    const questions = await Data.getQuestions(testId);
    const ids = questions.map(q=>q.id).filter(x=>x!==id);
    const target = Math.max(0, Math.min((parseInt(order,10)||1)-1, ids.length));
    ids.splice(target,0,id);
    await Data.reorderQuestions(testId, ids);
  },
  async deleteQuestion(id){ await deleteDoc(doc(questionsCol,id)); },

  // attempts
  async addAttempt(data){
    const ref = await addDoc(attemptsCol, { ...data, createdAt: serverTimestamp() });
    return ref.id;
  },
  async getAttempt(id){
    const snap = await getDoc(doc(attemptsCol,id));
    return snap.exists() ? {id:snap.id,...snap.data()} : null;
  },
  async getUserAttempts(userId){
    const snap = await getDocs(query(attemptsCol, where('userId','==',userId)));
    return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> tsToDate(b.startedAt) - tsToDate(a.startedAt));
  },
  async getAllAttemptsCount(){
    const snap = await getDocs(attemptsCol);
    return snap.size;
  },

  // saved
  savedId(userId, questionId){ return `${userId}_${questionId}`; },
  async isSaved(userId, questionId){
    const snap = await getDoc(doc(savedCol, Data.savedId(userId,questionId)));
    return snap.exists();
  },
  async addSaved(userId, q){
    await setDoc(doc(savedCol, Data.savedId(userId,q.id)), {
      userId, questionId:q.id, testId:q.testId, sectionId:q.sectionId, savedAt: serverTimestamp()
    });
  },
  async removeSaved(userId, questionId){
    await deleteDoc(doc(savedCol, Data.savedId(userId,questionId)));
  },
  async getSavedByUser(userId){
    const snap = await getDocs(query(savedCol, where('userId','==',userId)));
    return sortByCreatedAt(snap.docs.map(d=>({id:d.id,...d.data(), createdAt:d.data().savedAt})), 'desc');
  },

  // wrong
  wrongId(userId, questionId){ return `${userId}_${questionId}`; },
  async upsertWrong(userId, q){
    await setDoc(doc(wrongCol, Data.wrongId(userId,q.id)), {
      userId, questionId:q.id, testId:q.testId, sectionId:q.sectionId, updatedAt: serverTimestamp()
    });
  },
  async removeWrong(userId, questionId){
    try{ await deleteDoc(doc(wrongCol, Data.wrongId(userId,questionId))); }catch(e){}
  },
  async getWrongByUser(userId){
    const snap = await getDocs(query(wrongCol, where('userId','==',userId)));
    return sortByCreatedAt(snap.docs.map(d=>({id:d.id,...d.data(), createdAt:d.data().updatedAt})), 'desc');
  },
};

/* ============ OFFLINE PACK ============ */
function offlineKey(){ return `step_offline_${state.user?.number||'guest'}`; }
function offlineToggleKey(){ return `step_offline_on_${state.user?.number||'guest'}`; }
function offlineAttemptsKey(){ return `step_offline_attempts_${state.user?.number||'guest'}`; }
function offlineEnabled(){ return !!state.user && localStorage.getItem(offlineToggleKey())==='1'; }
function setOfflineEnabled(v){ if(state.user) localStorage.setItem(offlineToggleKey(), v?'1':'0'); }
function getOfflinePack(){
  try{ return JSON.parse(localStorage.getItem(offlineKey())||'null'); }catch(e){ return null; }
}
function saveOfflinePack(pack){
  try{
    pack.syncedAt=Date.now();
    localStorage.setItem(offlineKey(), JSON.stringify(pack));
    return true;
  }catch(e){ console.error('offline save failed',e); return false; }
}
async function downloadOfflinePack(){
  const [secSnap,testSnap,qSnap] = await Promise.all([
    getDocs(sectionsCol), getDocs(testsCol), getDocs(questionsCol)
  ]);
  const sections = sortByCreatedAt(secSnap.docs.map(d=>({id:d.id,...d.data()})),'asc');
  const tests = sortByOrder(testSnap.docs.map(d=>({id:d.id,...d.data()})));
  const questions = sortByOrder(qSnap.docs.map(d=>({id:d.id,...d.data()})));
  if(!saveOfflinePack({sections,tests,questions})) throw new Error('تعذّر حفظ النسخة المحلية. قد تكون مساحة التخزين ممتلئة.');
  return {sections,tests,questions};
}
async function enableOffline(v){
  setOfflineEnabled(v);
  if(!v){ toast('تم إيقاف وضع بدون اتصال'); render(); return; }
  toast('جارِ تنزيل بيانات STEP...');
  try{
    await downloadOfflinePack();
    toast('تم تنزيل الأقسام والاختبارات والأسئلة ✓');
  }catch(e){
    console.error(e);
    setOfflineEnabled(false);
    toast('تعذّر التنزيل. تحقّق من الاتصال وصلاحيات Firestore.');
  }
  render();
}
async function refreshOfflinePack(){
  state.menuOpen=false;
  toast('جارِ تحديث النسخة المحلية...');
  try{ await downloadOfflinePack(); toast('تم تحديث النسخة المحلية ✓'); }
  catch(e){ console.error(e); toast('تعذّر التحديث الآن'); }
  render();
}
function clearOfflinePack(){
  try{
    localStorage.removeItem(offlineKey());
    localStorage.removeItem(offlineToggleKey());
  }catch(e){}
  closeModal();
  toast('تم حذف البيانات المحلية');
  render();
}
function confirmClearOfflinePack(){
  setModal({type:'confirm',title:'حذف البيانات المحلية',message:'سيتم حذف نسخة الأقسام والاختبارات والأسئلة من هذا الجهاز فقط، ولن تتأثر قاعدة STEP. متابعة؟',confirmLabel:'حذف',purpose:'clearOffline'});
}
function offlineالأقسام(){
  const p=getOfflinePack();
  return p?.sections ? sortByCreatedAt(p.sections,'asc') : [];
}
function offlineTests(sectionId){
  const p=getOfflinePack();
  return p?.tests ? sortByOrder(p.tests.filter(t=>t.sectionId===sectionId)) : [];
}
function offlineQuestions(testId){
  const p=getOfflinePack();
  return p?.questions ? sortByOrder(p.questions.filter(q=>q.testId===testId)) : [];
}
function offlineAttemptList(){
  try{ return JSON.parse(localStorage.getItem(offlineAttemptsKey())||'[]'); }catch(e){ return []; }
}
function saveOfflineAttempt(attempt){
  const list=offlineAttemptList();
  const id=`offline_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
  list.unshift({id,...attempt});
  try{ localStorage.setItem(offlineAttemptsKey(),JSON.stringify(list.slice(0,50))); }catch(e){}
  return id;
}
function getOfflineAttempt(id){
  return offlineAttemptList().find(a=>a.id===id)||null;
}
function renderOfflineالأقسام(){
  const p=getOfflinePack();
  if(!p || !p.sections?.length) return emptyBlock('لا توجد نسخة محفوظة بعد. فعّل "تنزيل الأقسام" وأنت متصل بالإنترنت.');
  const sections=offlineالأقسام();
  return `
    <div class="offline-banner">${ICON.wifiOff}<span>بيانات محفوظة محليًا · آخر تحديث: ${p.syncedAt?new Date(p.syncedAt).toLocaleString('ar-SA'):'—'}</span></div>

function renderOfflineSection(sectionId){

      <button class="btn btn-amber btn-block" style="margin-bottom:14px;" data-action="start-quiz" data-scope="offlineSectionAll" data-section-id="${sectionId}">اختبار كل اختبارات القسم</button>
      ${tests.map(t=>`
        <div class="list-item clickable" data-action="start-quiz" data-scope="offlineTest" data-section-id="${sectionId}" data-test-id="${t.id}">
          <div style="flex:1;"><div class="title">${esc(t.title)}</div><div class="sub">اختبار رقم ${orderValue(t,1)} · ${offlineQuestions(t.id).length} سؤال</div></div>
          <span class="order-badge">${orderValue(t,1)}</span>
        </div>`).join('')}`}

function offlineResultHtml(attempt){
  const pct=attempt.total?Math.round((attempt.score/attempt.total)*100):0;
  const wrong=(attempt.answers||[]).filter(a=>!a.isCorrect);
  return `
    <div class="card" style="text-align:center;">

/* ============ ROUTER ============ */
let lastRouteKey = null;
async function render(){
  const hash = location.hash || '#/login';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);
  const routeKey = parts.join('/');

  // guard: require login for anything besides login/name
  if(parts[0] !== 'login' && parts[0] !== 'name' && !state.user){
    app.innerHTML = wrap(renderLoadingScreen());
    location.hash = '#/login';
    return;
  }

  // instant feedback: paint a spinner right away when the route actually changes,
  // so clicks feel responsive even while data is still loading from Firestore.
  if(routeKey !== lastRouteKey && parts[0]!=='login' && parts[0]!=='name'){
    app.innerHTML = wrap(renderLoadingScreen(), true);
  }
  lastRouteKey = routeKey;

  let html = '';
  try{
    if(parts[0]==='login') html = renderLogin();
    else if(parts[0]==='name') html = renderNamePrompt();
    else if(parts[0]==='user') html = await renderUserRoute(parts.slice(1));
    else if(parts[0]==='admin') html = await renderAdminRoute(parts.slice(1));
    else html = renderLogin();
  }catch(err){
    console.error(err);
    html = `<div class="empty">Something went wrong loading this page.<br><span class="faint">${esc(err.message||err)}</span></div>`;
  }
  app.innerHTML = wrap(html, parts[0]!=='login' && parts[0]!=='name');
}
function wrap(inner, withTopbar){
  return `${withTopbar ? renderTopbar() : ''}${inner}${renderMenu()}${renderModal()}`;
}
function renderLoadingScreen(){ return `<div class="center-screen"><div class="spinner"></div></div>`; }

async function renderUserRoute(segs){

  if(section==='home' || !section) return await renderUserHome();

  if(section==='saved') return await renderSavedQuestions();
  if(section==='history'){

    return await renderHistory();
  }
  if(section==='sections'){
    if(segs[1]) return await renderSectionTests(segs[1]);

  }
  if(section==='offline'){
    if(segs[1]) return renderOfflineSection(segs[1]);

  return renderLoadingScreen();
}

async function enrichQuestionRefs(items){
  const snaps = await Promise.all(items.map(it => getDoc(doc(questionsCol, it.questionId))));
  const questions = snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
  const testIds = [...new Set(questions.map(q=>q.testId).filter(Boolean))];
  const sectionIds = [...new Set(questions.map(q=>q.sectionId).filter(Boolean))];
  const [testDocs, sectionDocs] = await Promise.all([
    Promise.all(testIds.map(id => Data.getTest(id))),
    Promise.all(sectionIds.map(id => Data.getSection(id))),
  ]);
  const testMap = Object.fromEntries(testIds.map((id,i)=>[id, testDocs[i]]));
  const sectionMap = Object.fromEntries(sectionIds.map((id,i)=>[id, sectionDocs[i]]));
  const snapById = Object.fromEntries(snaps.filter(s=>s.exists()).map(s=>[s.id, {id:s.id,...s.data()}]));
  const out = [];
  for(const it of items){
    const q = snapById[it.questionId];
    if(!q) continue;
    const test = testMap[q.testId], sec = sectionMap[q.sectionId];
    out.push({ ref:it, question:q, testTitle: test?.title||'—', sectionName: sec?.name||'—' });
  }
  return out;
}

/* ============ QUIZ ENGINE ============ */
async function buildQuizForScope(scope, sectionId, testId){
  let questions=[], testTitle='', sectionName='';
  if(scope==='test' || scope==='offlineTest'){
    if(scope==='offlineTest'){
      const sec = offlineالأقسام().find(s=>s.id===sectionId);
      const test = offlineTests(sectionId).find(t=>t.id===testId);
      questions = offlineQuestions(testId);
      testTitle = test?.title||'Test'; sectionName = sec?.name||'';
    }else{
      const [test,sec] = await Promise.all([Data.getTest(testId), Data.getSection(sectionId)]);
      questions = await Data.getQuestions(testId);
      testTitle = test?.title||'Test'; sectionName = sec?.name||'';
    }
  } else if(scope==='sectionAll' || scope==='offlineSectionAll'){
    if(scope==='offlineSectionAll'){
      const sec = offlineالأقسام().find(s=>s.id===sectionId);
      const tests = offlineTests(sectionId);
      questions = tests.flatMap(t=>offlineQuestions(t.id));
      testTitle = 'كل اختبارات القسم'; sectionName = sec?.name||'';
    }else{
      const sec = await Data.getSection(sectionId);
      questions = await Data.getQuestionsBySection(sectionId);
      testTitle = 'All Tests'; sectionName = sec?.name||'';
    }
  } else if(scope==='allالأقسام'){
    const snap = await getDocs(questionsCol);
    questions = sortByOrder(snap.docs.map(d=>({id:d.id,...d.data()})));
    testTitle = 'All الأقسام'; sectionName = 'All الأقسام';
  }
  return { scope, sectionId:sectionId||null, testId:testId||null, testTitle, sectionName, questions,
    isOffline: scope==='offlineTest' || scope==='offlineSectionAll' };
}
function newQuizSession(built, key){
  return {
    key,
    scope: built.scope, sectionId: built.sectionId, testId: built.testId,
    testTitle: built.testTitle, sectionName: built.sectionName,
    questions: built.questions,
    isOffline: !!built.isOffline,
    currentIndex: 0,
    answers: {}, savedSet: new Set(), reviewSet: new Set(), timeSpent: {},
    questionShownAt: Date.now(), quizStartedAt: Date.now(), startedAtWall: new Date(),
  };
}
async function attachSavedSet(session){
  if(session.isOffline) return;
  try{
    const snap = await getDocs(query(savedCol, where('userId','==',state.user.id)));
    const savedQids = new Set(snap.docs.map(d=>d.data().questionId));
    session.questions.forEach(q=>{ if(savedQids.has(q.id)) session.savedSet.add(q.id); });
  }catch(e){ console.error('attachSavedSet failed',e); }
}
async function renderQuizRoute(segs){
  const [scope, a, b] = segs;
  let sectionId=null, testId=null;
  if(scope==='test' || scope==='offlineTest'){ sectionId=a; testId=b; }
  else if(scope==='sectionAll' || scope==='offlineSectionAll'){ sectionId=a; }
  else if(scope==='custom'){ testId=a; }

  const expectedKey = `${scope}:${sectionId||''}:${testId||''}`;
  if(!state.quiz || state.quiz.key!==expectedKey){
    let built;
    if(scope==='custom'){
      const ids = state.cache.customQuestionIds||[];
      const questions = await Data.getQuestionsByIds(ids);
      built = { scope:'custom', sectionId:null, testId:a,
        testTitle: a==='wrong' ? 'الأسئلة الخاطئة Review' : 'الأسئلة المحفوظة Review',
        sectionName: 'Review', questions };
    } else {
      built = await buildQuizForScope(scope, sectionId, testId);
    }
    if(!built.questions.length) return emptyBlock('No questions available for this selection yet.');
    state.quiz = newQuizSession(built, expectedKey);
    await attachSavedSet(state.quiz);
  }
  return renderQuizScreen();
}

function accumulateCurrentQuestionTime(){
  const quiz = state.quiz; if(!quiz) return;
  const q = currentQuestion();
  const now = Date.now();
  quiz.timeSpent[q.id] = (quiz.timeSpent[q.id]||0) + (now - quiz.questionShownAt);
  quiz.questionShownAt = now;
}

  if(!state.quiz) return;

  const elapsed = Math.floor((Date.now()-state.quiz.quizStartedAt)/1000);
  const m = String(Math.floor(elapsed/60)).padStart(2,'0');
  const s = String(elapsed%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
}

      : `<button class="btn btn-amber" data-action="quiz-submit">Submit Test</button>`}
  </div>`;
}

function toggleReview(){

function selectOption(idx){

  quiz.answers[q.id] = idx; render();

function gotoQuestion(idx){
  accumulateCurrentQuestionTime();
  state.quiz.currentIndex = idx; state.quiz.questionShownAt = Date.now(); render();
}
function quizNext(){ if(state.quiz.currentIndex < state.quiz.questions.length-1) gotoQuestion(state.quiz.currentIndex+1); }
function quizPrev(){ if(state.quiz.currentIndex > 0) gotoQuestion(state.quiz.currentIndex-1); }
function buildReviewGateItems(){
  const quiz = state.quiz, items = [];
  quiz.questions.forEach((q,i)=>{ if(quiz.reviewSet.has(q.id)) items.push({index:i, text:q.text}); });
  return items;
}
function quizSubmitClicked(){
  accumulateCurrentQuestionTime();
  const items = buildReviewGateItems();
  if(items.length>0){ setModal({ type:'reviewGate', items }); }
  else { finalizeQuiz(); }
}
async function finalizeQuiz(){
  const quiz = state.quiz;
  const durationSec = Math.round((Date.now()-quiz.quizStartedAt)/1000);
  const answersArr = quiz.questions.map(q => {
    const selectedIndex = quiz.answers[q.id] !== undefined ? quiz.answers[q.id] : -1;
    const isCorrect = selectedIndex === q.correctIndex;
    const timeSpentSec = Math.round((quiz.timeSpent[q.id]||0)/1000);
    return {
      questionId:q.id, text:q.text, options:q.options, correctIndex:q.correctIndex,
      selectedIndex, isCorrect, timeSpentSec,
      saved: quiz.savedSet.has(q.id), reviewed: quiz.reviewSet.has(q.id)
    };
  });
  const score = answersArr.filter(a=>a.isCorrect).length;

  if(quiz.isOffline){
    const attempt = {
      userId: state.user.id,
      scopeType: quiz.scope,
      sectionId: quiz.sectionId || null,
      sectionName: quiz.sectionName,
      testId: quiz.testId || null,
      testTitle: quiz.testTitle,
      startedAt: quiz.startedAtWall,
      finishedAt: new Date(),
      durationSec, score, total: answersArr.length,
      answers: answersArr,
      offline:true
    };
    const attemptId = saveOfflineAttempt(attempt);
    state.quiz = null; state.modal = null;
    navigate(`#/user/offline-result/${attemptId}`);
    return;
  }

  const wrongWritesPromise = Promise.all(quiz.questions.map(q => {
    const a = answersArr.find(x=>x.questionId===q.id);
    return a.isCorrect ? Data.removeWrong(state.user.id, q.id) : Data.upsertWrong(state.user.id, q);
  }));
  const [attemptId] = await Promise.all([
    Data.addAttempt({
      userId: state.user.id,
      scopeType: quiz.scope,
      sectionId: quiz.sectionId || null,
      sectionName: quiz.sectionName,
      testId: quiz.testId || null,
      testTitle: quiz.testTitle,
      startedAt: quiz.startedAtWall,
      finishedAt: new Date(),
      durationSec, score, total: answersArr.length,
      answers: answersArr,
    }),
    wrongWritesPromise,
  ]);
  state.quiz = null; state.modal = null;
  navigate(`#/user/result/${attemptId}`);
}

async function handleModalConfirm(){
  const m = state.modal;
  if(!m) return;
  if(m.type==='textInput'){
    const input = document.getElementById('modal-input-val');
    const val = input ? input.value.trim() : '';
    if(!val) return;
    if(m.purpose==='addSection'){ await Data.addSection(val); }
    else if(m.purpose==='editSection'){ await Data.updateSection(m.id, val); }
    else if(m.purpose==='createTestManual'){
      const testId = await Data.addTest(m.sectionId, val);
      state.modal = null;
      navigate(`#/admin/sections/${m.sectionId}/tests/${testId}`);
      return;
    }
  } else if(m.type==='testEdit'){
    const title = document.getElementById('test-edit-title')?.value.trim() || '';
    const orderRaw = document.getElementById('test-edit-order')?.value.trim() || '';
    const order = parseInt(orderRaw,10);
    if(!title){ toast('اكتب اسم الاختبار'); return; }
    if(!Number.isFinite(order) || order<1){ toast('اكتب رقم اختبار صحيح'); return; }
    await Data.updateTest(m.id,{title});
    await Data.setTestOrder(m.sectionId,m.id,order);
  } else if(m.type==='confirm'){
    if(m.purpose==='deleteSection') await Data.deleteSection(m.id);
    else if(m.purpose==='deleteTest') await Data.deleteTest(m.id);
    else if(m.purpose==='deleteQuestion') await Data.deleteQuestion(m.id);
    else if(m.purpose==='clearOffline'){ clearOfflinePack(); return; }
  }
  state.modal = null;
  render();
}

  const m = state.modal;
  if(m.purpose==='addTestChoice'){
    if(value==='manual'){
      setModal({ type:'textInput', title:'New Test', label:'Test title', placeholder:'e.g. Test 1', confirmLabel:'Create', purpose:'createTestManual', sectionId:m.sectionId });
    } else {

async function handleQuickAddSubmit(){
  const m = state.modal;
  const ta = document.getElementById('modal-quickadd');
  const parsed = parseQuickAdd(ta ? ta.value : '');
  if(!parsed.questions.length){ alert('No questions detected. Check the format and try again.'); return; }
  const title = parsed.title || 'Untitled Test';
  const testId = await Data.addTest(m.sectionId, title);
  const valid = parsed.questions.filter(q => q.correctIndex >= 0 && q.options.length >= 2);
  await Promise.all(valid.map(q => Data.addQuestion(testId, m.sectionId, q)));
  state.modal = null;
  navigate(`#/admin/sections/${m.sectionId}/tests/${testId}`);
}
async function handleQuestionSubmit(editId){
  const m = state.modal;
  const text = document.getElementById('qm-text').value.trim();
  const orderRaw = document.getElementById('qm-order')?.value.trim() || '';
  const parsedOrder = parseInt(orderRaw,10);
  if(!text || (editId && (!Number.isFinite(parsedOrder) || parsedOrder<1))){
    toast(editId ? 'أدخل نص السؤال ورقم السؤال بشكل صحيح' : 'أدخل نص السؤال بشكل صحيح');
    return;
  }

  const rows = [...document.querySelectorAll('#qm-options .answer-row')];
  const options = rows.map((row)=>{
    const input = row.querySelector('input[type="text"]');
    return input ? input.value.trim() : '';
  });
  const radio = document.querySelector('input[name="qm-correct"]:checked');
  const correctRowIndex = radio ? rows.findIndex(r=>r.contains(radio)) : -1;

  if(!options[0] || !options[1] || !options[2]){
    toast('أدخل على الأقل الإجابات أ، ب، ج وحدد الصحيحة');
    return;
  }
  const finalOptions = options[3] ? options : options.slice(0,3);
  const correctIndex = correctRowIndex;
  if(correctIndex<0 || correctIndex>=finalOptions.length){
    toast('حدد الإجابة الصحيحة');
    return;
  }

  const data = { text, options:finalOptions, correctIndex };
  if(editId){
    data.order = parsedOrder;
    await Data.updateQuestion(editId, data);
    await Data.setQuestionOrder(m.testId, editId, parsedOrder);
  }else{
    if(Number.isFinite(parsedOrder) && parsedOrder>0) data.order = parsedOrder;
    await Data.addQuestion(m.testId, m.sectionId, data);
  }
  state.modal = null;
  render();
}


/* ============ LONG-PRESS DRAG SORTING ============ */
const dragState = {
  timer:null, item:null, list:null, pointerId:null, dragging:false, didDrag:false
};
function clearDragState(){
  if(dragState.timer) clearTimeout(dragState.timer);
  if(dragState.item) dragState.item.classList.remove('dragging');
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  dragState.timer=null; dragState.item=null; dragState.list=null; dragState.pointerId=null; dragState.dragging=false;
}
function startLongPressDrag(handle,e){
  const item=handle.closest('.drag-item');
  const list=handle.closest('[data-sort-list]');
  if(!item || !list) return;
  dragState.didDrag=false; dragState.item=item; dragState.list=list; dragState.pointerId=e.pointerId;
  try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  dragState.timer=setTimeout(()=>{
    dragState.dragging=true;
    dragState.item.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(25);
  },380);
}
function moveLongPressDrag(e){
  if(!dragState.item || dragState.pointerId!==e.pointerId) return;
  if(!dragState.dragging) return;
  dragState.didDrag=true;
  e.preventDefault();
  const list=dragState.list, dragged=dragState.item;
  const siblings=[...list.querySelectorAll('.drag-item')].filter(x=>x!==dragged);
  let closest=null, closestOffset=Infinity;
  siblings.forEach(el=>{
    const rect=el.getBoundingClientRect();
    const offset=Math.abs(e.clientY-(rect.top+rect.height/2));
    if(offset<closestOffset){closestOffset=offset;closest=el;}
  });
  siblings.forEach(x=>x.classList.remove('drop-target'));
  if(!closest) return;
  closest.classList.add('drop-target');
  const rect=closest.getBoundingClientRect();
  const before=e.clientY < rect.top+rect.height/2;
  list.insertBefore(dragged, before?closest:closest.nextSibling);
}
async function finishLongPressDrag(e){
  if(dragState.pointerId!==e.pointerId) return;
  if(dragState.timer) clearTimeout(dragState.timer);
  if(!dragState.dragging){ clearDragState(); return; }
  const list=dragState.list;
  const kind=list?.dataset.sortList;
  const ids=[...list.querySelectorAll('.drag-item')].map(el=>el.dataset.id);
  const sectionId=list?.dataset.sectionId;
  const testId=list?.dataset.testId;
  const did=dragState.didDrag;
  clearDragState();
  if(!did) return;
  try{
    if(kind==='answers'){
      [...list.querySelectorAll('.answer-row')].forEach((row,i)=>{
        const badge=row.querySelector('.answer-order');
        if(badge) badge.textContent=String(i+1);
        row.dataset.answerIndex=String(i);
      });
      toast('تم تغيير ترتيب الإجابات — اضغط حفظ لتثبيته ✓');
      return;
    }
    if(kind==='tests') await Data.reorderTests(sectionId,ids);
    else if(kind==='questions') await Data.reorderQuestions(testId,ids);
    toast('تم تحديث الترتيب ✓');
    render();
  }catch(err){
    console.error(err);
    toast('تعذّر حفظ الترتيب');
    render();
  }
}

/* ============ GLOBAL EVENT BINDING (once) ============ */
async function onAppClick(e){
  if(dragState.didDrag){ dragState.didDrag=false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  e.preventDefault();
  const action = t.dataset.action;
  switch(action){
    case 'go': navigate(t.dataset.hash); break;
    case 'back': goBack(); break;
    case 'logout': doLogout(); break;
    case 'open-menu': state.menuOpen = true; render(); break;
    case 'close-menu': state.menuOpen = false; render(); break;
    case 'refresh-offline': await refreshOfflinePack(); break;
    case 'clear-offline': confirmClearOfflinePack(); break;
    case 'menu-backdrop': if(e.target === t){ state.menuOpen = false; render(); } break;
    case 'modal-backdrop': if(e.target === t) closeModal(); break;
    case 'modal-cancel': closeModal(); break;

    case 'delete-ref': await deleteRefAction(t.dataset.kind, t.dataset.qid); break;
    case 'review-list': await startReviewListAction(t.dataset.source); break;

    case 'start-quiz': await startQuizAction(t.dataset.scope, t.dataset.sectionId, t.dataset.testId); break;
    case 'select-option': selectOption(parseInt(t.dataset.index,10)); break;
    case 'toggle-save': await toggleSave(); break;
    case 'toggle-review': toggleReview(); break;
    case 'goto-question': gotoQuestion(parseInt(t.dataset.index,10)); break;
    case 'quiz-next': quizNext(); break;
    case 'quiz-prev': quizPrev(); break;
    case 'quiz-submit': quizSubmitClicked(); break;
    case 'quiz-submit-final': await finalizeQuiz(); break;
    case 'review-jump': { state.modal = null; gotoQuestion(parseInt(t.dataset.index,10)); break; }

    case 'add-section': openAddSectionModal(); break;
    case 'edit-section': openEditSectionModal(t.dataset.id, t.dataset.name); break;
    case 'delete-section': openDeleteSectionConfirm(t.dataset.id, t.dataset.name); break;
    case 'add-test': openAddTestChoiceModal(t.dataset.sectionId); break;
    case 'edit-test-title': openEditTestTitleModal(t.dataset.id, t.dataset.sectionId, t.dataset.title, t.dataset.order||''); break;
    case 'delete-test': openDeleteTestConfirm(t.dataset.id, t.dataset.sectionId, t.dataset.title); break;
    case 'add-question': openQuestionModal(t.dataset.testId, t.dataset.sectionId); break;
    case 'edit-question': await openEditQuestionModal(t.dataset.id, t.dataset.testId, t.dataset.sectionId); break;
    case 'delete-question': openDeleteQuestionConfirm(t.dataset.id, t.dataset.testId, t.dataset.sectionId); break;

    case 'modal-confirm': await handleModalConfirm(); break;
    case 'modal-choice': await handleModalChoice(t.dataset.value); break;
    case 'modal-quickadd-submit': await handleQuickAddSubmit(); break;
    case 'modal-question-submit': await handleQuestionSubmit(t.dataset.editId || null); break;
  }
}
async function onAppSubmit(e){
  if(e.target.id === 'login-form'){
    e.preventDefault();
    const raw = document.getElementById('login-number').value.trim();
    if(!raw) return;
    const number = raw.replace(/\s+/g,'');
    if(number === ADMIN_NUMBER){
      let u = await Data.getUser(ADMIN_NUMBER);
      if(!u) u = await Data.createUser(ADMIN_NUMBER, 'Admin', true);
      state.user = u;
      saveSession(u);
      navigate('#/admin/home');
    } else {
      let u = await Data.getUser(number);
      if(u){ state.user = u; saveSession(u); navigate('#/user/home'); }
      else { state.pendingNumber = number; navigate('#/name'); }
    }
  } else if(e.target.id === 'name-form'){
    e.preventDefault();
    const name = document.getElementById('name-input').value.trim();
    if(!name) return;
    const u = await Data.createUser(state.pendingNumber, name, false);
    state.user = u; state.pendingNumber = null;
    saveSession(u);
    navigate('#/user/home');
  }
}
function saveSession(u){
  try{ localStorage.setItem('step_session', JSON.stringify({ number: u.number })); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('step_session'); }catch(e){}
}

async function initApp(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('step_session') || 'null'); }catch(e){}
  if(saved && saved.number){
    try{
      const u = await Data.getUser(saved.number);
      if(u){
        state.user = u;
        if(!location.hash || location.hash==='#/login' || location.hash==='#/name'){
          location.hash = u.isAdmin ? '#/admin/home' : '#/user/home';
        }
      } else {
        clearSession();
      }
    }catch(e){ clearSession(); }
  }
  if(!location.hash) location.hash = '#/login';
  render();
}

app.addEventListener('click', onAppClick);
app.addEventListener('submit', onAppSubmit);
document.addEventListener('pointerdown', e=>{
  const h=e.target.closest?.('[data-drag-handle]');
  if(h) startLongPressDrag(h,e);
});
document.addEventListener('pointermove', e=>moveLongPressDrag(e), {passive:false});
document.addEventListener('pointerup', e=>finishLongPressDrag(e));
document.addEventListener('pointercancel', e=>finishLongPressDrag(e));
window.addEventListener('hashchange', render);
initApp();
</script>
