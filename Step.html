<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة STEP - ستيب التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --bg:#12172B; --bg-2:#0D1122;
  --surface:#1B2140; --surface-2:#232A4D; --surface-3:#2B3260;
  --text:#EDEAE0; --text-dim:#A7ACC8; --text-faint:#6B7196;
  --accent:#E8B44C; --accent-dim:#3A3221;
  --accent2:#4FA8A0;
  --danger:#E2637A; --danger-dim:#3A2530;
  --success:#6FCF97; --success-dim:#1E3A2C;
  --border:rgba(237,234,224,.12);
  --radius:16px; --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 20% -10%, #1B2140 0%, var(--bg) 45%, var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  min-height:100vh;
  user-select:none;
}
h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
button, input, select, textarea{font-family:inherit;}
button{cursor:pointer;}
::selection{background:var(--accent);color:#12172B;}
#app{max-width:680px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(18,23,43,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:flex;align-items:center;justify-content:center;transition:.15s;}
.icon-btn:hover{background:var(--surface-3);border-color:var(--accent);}
.topbar-title{font-weight:800;color:var(--accent);font-size:16px;letter-spacing:.5px;font-family:'Tajawal';}

.overlay{position:fixed;inset:0;background:rgba(6,8,16,.6);z-index:29;opacity:0;pointer-events:none;transition:.25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;right:0;width:78%;max-width:320px;background:var(--surface);z-index:30;
  transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 0;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.drawer-head .num{font-family:'Tajawal';font-weight:800;font-size:22px;color:var(--accent);}
.drawer-head .tag{color:var(--text-faint);font-size:12px;}
.drawer-item{display:flex;align-items:center;gap:12px;padding:14px 20px;color:var(--text);text-decoration:none;
  border-right:3px solid transparent;transition:.15s;font-size:15px;cursor:pointer;}
.drawer-item:hover,.drawer-item.active{background:var(--surface-2);border-right-color:var(--accent);}
.drawer-item .ic{width:20px;text-align:center;color:var(--accent2);}

.page{padding:20px 16px 12px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-title{font-size:22px;font-weight:800;margin:4px 0 18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.stat-card:before{content:'';position:absolute;top:-20px;left:-20px;width:70px;height:70px;background:var(--accent);opacity:.08;border-radius:50%;}
.stat-num{font-family:'Tajawal';font-size:28px;font-weight:800;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14.5px;transition:.15s;width:100%;}
.btn:hover{background:var(--surface-3);}
.btn-primary{background:var(--accent);color:#1a1408;border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1px solid var(--accent2);color:var(--accent2);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-row{display:flex;gap:10px;}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;transition:.15s;cursor:pointer;position:relative;}
.list-item:hover{border-color:var(--accent2);}
.list-item.dragging{opacity:0.4;border-style:dashed;border-color:var(--accent);}
.list-item.drag-over{border-color:var(--accent);background:var(--surface-2);transform:scale(1.01);}

.drag-handle{cursor:grab;padding:6px 8px;margin-left:4px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;touch-action:none;}
.drag-handle:active{cursor:grabbing;color:var(--accent);}

.list-item .title{font-weight:700;font-size:15.5px;}
.list-item .sub{font-size:12px;color:var(--text-faint);margin-top:3px;}
.chip{font-size:11px;background:var(--surface-3);color:var(--text-dim);padding:3px 9px;border-radius:20px;}
.chip-accent{background:var(--accent-dim);color:var(--accent);}
.icon-action{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.icon-action:hover{border-color:var(--accent);color:var(--accent);}
.icon-action.danger:hover{border-color:var(--danger);color:var(--danger);}

input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);
  color:var(--text);font-family:inherit;font-size:14.5px;margin-bottom:12px;}
textarea{resize:vertical;min-height:90px;}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}

.answer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;transition:.15s;cursor:pointer;}
.answer:hover{border-color:var(--accent2);}
.answer.selected{border-color:var(--accent);background:var(--accent-dim);}
.answer .letter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text-faint);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;color:var(--text-dim);}
.answer.selected .letter{background:var(--accent);border-color:var(--accent);color:#1a1408;}
.answer.correct{border-color:var(--success);background:var(--success-dim);}
.answer.correct .letter{background:var(--success);border-color:var(--success);color:#0c2016;}
.answer.wrong{border-color:var(--danger);background:var(--danger-dim);}
.answer.wrong .letter{background:var(--danger);border-color:var(--danger);color:#2c0f16;}

.answer-edit-item{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;margin-bottom:8px;}
.answer-edit-item.correct-choice{border-color:var(--success);background:rgba(111,207,151,0.08);}

.modal-overlay{position:fixed;inset:0;background:rgba(6,8,16,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.center{align-items:center;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;max-width:640px;width:100%;
  max-height:85vh;overflow-y:auto;padding:20px;}
.modal-overlay.center .modal{border-radius:var(--radius);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;}

.empty{text-align:center;padding:40px 20px;color:var(--text-faint);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--accent);
  color:var(--text);padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;bottom:34px;}
.loader{text-align:center;padding:60px 20px;color:var(--text-faint);}

.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-3);border-radius:24px;transition:.2s;}
.switch-slider:before{content:'';position:absolute;height:18px;width:18px;right:3px;bottom:3px;background:var(--text-dim);border-radius:50%;transition:.2s;}
.switch input:checked + .switch-slider{background:var(--accent);}
.switch input:checked + .switch-slider:before{transform:translateX(-18px);background:#1a1408;}

.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.q-text{font-size:17px;line-height:1.9;font-weight:600;margin-bottom:10px;}
.q-passage{background:var(--surface-2);border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text-dim);border:1px solid var(--border);}
.q-tag{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBbZtSY_IIyH0cXsWX3lbyIN4UwLD_5j04",
  authDomain: "qudurat-2da37.firebaseapp.com",
  projectId: "qudurat-2da37",
  storageBucket: "qudurat-2da37.firebasestorage.app",
  messagingSenderId: "565850407112",
  appId: "1:565850407112:web:94f1b6b5edf501c675e5fd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

let state = {
  userNumber: null,
  isAdmin: false,
  sections: [],
  sectionsLoaded: false,
  drawerOpen: false,
  route: { name: 'login', params: {} },
  history: [],
  quiz: null,
  draggedItemIndex: null,
  activeDragType: null // 'test' | 'question' | 'answer'
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}س ${m}د ${s}ث`;
  if(m>0) return `${m}د ${s}ث`;
  return `${s}ث`;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function nav(name, params = {}){
  if(state.route && state.route.name){
    state.history.push({ name: state.route.name, params: state.route.params });
  }
  state.route = { name, params };
  state.drawerOpen = false;
  render();
  window.scrollTo(0,0);
}

function goBack(){
  if(state.route.name === 'quiz'){
    openModal(`
      <div class="modal-head"><h3 style="margin:0;">إنهاء الاختبار؟</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
      <p class="sub">سيتم الخروج من الاختبار الحالي بدون حفظ نتيجته. هل تريد الاستمرار؟</p>
      <div class="btn-row"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn btn-danger" onclick="closeModal();actuallyGoBack();">خروج</button></div>
    `, true);
    return;
  }
  actuallyGoBack();
}

function actuallyGoBack(){
  if(state.history.length > 0){
    state.route = state.history.pop();
  } else {
    state.route = { name: 'home', params: {} };
  }
  state.drawerOpen = false;
  render();
  window.scrollTo(0,0);
}

async function sessionSave(num, isAdmin){
  try{ localStorage.setItem('step_session', JSON.stringify({num, isAdmin})); }catch(e){}
}
async function sessionLoad(){
  try{ const r = localStorage.getItem('step_session'); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
async function sessionClear(){
  try{ localStorage.removeItem('step_session'); }catch(e){}
}

function offlineBlobKey(){ return 'step_offline_' + state.userNumber; }
function offlineToggleKey(){ return 'step_offline_on_' + state.userNumber; }
function offlineEnabled(){ return state.userNumber ? localStorage.getItem(offlineToggleKey()) === '1' : false; }
function setOfflineEnabled(v){ if(state.userNumber) localStorage.setItem(offlineToggleKey(), v?'1':'0'); }

function getOfflineBlob(){
  if(!state.userNumber) return null;
  try{ const v = localStorage.getItem(offlineBlobKey()); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}

function saveOfflineBlob(b){
  if(!state.userNumber) return false;
  try{
    b.syncedAt = Date.now();
    localStorage.setItem(offlineBlobKey(), JSON.stringify(b));
    return true;
  }catch(e){
    console.error('Offline save error', e);
    return false;
  }
}

async function downloadOfflineData(){
  const secSnap = await db.collection('sections').orderBy('createdAt','asc').get();
  const sections = secSnap.docs.map(d => ({id: d.id, ...d.data()}));
  
  const testSnap = await db.collection('tests').get();
  const tests = testSnap.docs.map(d => ({id: d.id, ...d.data()}));
  
  const qSnap = await db.collection('questions').get();
  const questions = qSnap.docs.map(d => ({id: d.id, ...d.data()}));
  
  const ok = saveOfflineBlob({ sections, tests, questions });
  if(!ok) throw new Error('تعذّر حفظ النسخة محلياً');
  return { sections, tests, questions };
}

async function onToggleOffline(v){
  setOfflineEnabled(v);
  if(v){
    toast('جارِ تنزيل بيانات أقسام واختبارات ستيب...');
    try{
      await downloadOfflineData();
      toast('تم التنزيل للعمل بدون اتصال بنجاح ✓');
    }catch(e){
      console.error(e);
      toast('تعذّر تنزيل البيانات، تحقّق من الاتصال بالإنترنت');
    }
  } else {
    toast('تم إيقاف وضع عدم الاتصال');
  }
  render();
}

async function manualRefreshOffline(){
  toggleDrawer(false);
  toast('جارِ تحديث البيانات...');
  try{
    await downloadOfflineData();
    toast('تم تحديث المحتوى بنجاح ✓');
  }catch(e){
    toast('تعذّر الاتصال بالشبكة');
  }
  render();
}

async function findOrCreateUser(number){
  const isAdmin = number === '330';
  const ref = db.collection('users').doc(number);
  const snap = await ref.get();
  if(!snap.exists){
    await ref.set({ number, isAdmin, createdAt: FieldValue.serverTimestamp() });
  }
  return { number, isAdmin };
}

async function loadSections(force){
  if(state.sectionsLoaded && !force) return state.sections;
  const snap = await db.collection('sections').orderBy('number','asc').get();
  state.sections = snap.docs.map(d => ({id: d.id, ...d.data()}));
  state.sectionsLoaded = true;
  return state.sections;
}

async function addSection(name, number){
  const num = parseInt(number) || (state.sections.length + 1);
  await db.collection('sections').add({ name, number: num, createdAt: FieldValue.serverTimestamp() });
  state.sectionsLoaded = false;
}

async function updateSection(id, name, number){
  const num = parseInt(number) || 1;
  await db.collection('sections').doc(id).update({ name, number: num });
  state.sectionsLoaded = false;
}

async function deleteSection(id){
  const testsSnap = await db.collection('tests').where('sectionId','==',id).get();
  const batch = db.batch();
  for(let td of testsSnap.docs){
    const qSnap = await db.collection('questions').where('testId','==',td.id).get();
    qSnap.docs.forEach(q => batch.delete(q.ref));
    batch.delete(td.ref);
  }
  batch.delete(db.collection('sections').doc(id));
  await batch.commit();
  state.sectionsLoaded = false;
}

/* Tests operations */
async function getTestsBySection(sectionId){
  const snap = await db.collection('tests').where('sectionId','==',sectionId).get();
  let list = snap.docs.map(d => ({id: d.id, ...d.data()}));
  return list.sort((a,b) => (a.number ?? a.order ?? 0) - (b.number ?? b.order ?? 0));
}

async function addTest(sectionId, name, number){
  const existing = await getTestsBySection(sectionId);
  const num = parseInt(number) || (existing.length + 1);
  await db.collection('tests').add({
    sectionId, name, number: num, order: num, createdAt: FieldValue.serverTimestamp()
  });
}

async function updateTest(id, name, number){
  const num = parseInt(number) || 1;
  await db.collection('tests').doc(id).update({ name, number: num, order: num });
}

async function updateTestsOrder(testsList){
  const batch = db.batch();
  testsList.forEach((t, idx) => {
    const ref = db.collection('tests').doc(t.id);
    batch.update(ref, { number: idx + 1, order: idx + 1 });
  });
  await batch.commit();
}

async function deleteTest(id){
  const qSnap = await db.collection('questions').where('testId','==',id).get();
  const batch = db.batch();
  qSnap.docs.forEach(q => batch.delete(q.ref));
  batch.delete(db.collection('tests').doc(id));
  await batch.commit();
}

/* Questions operations */
async function getQuestionsByTest(testId){
  const snap = await db.collection('questions').where('testId','==',testId).get();
  let list = snap.docs.map(d => ({id: d.id, ...d.data()}));
  return list.sort((a,b) => (a.number ?? a.order ?? 0) - (b.number ?? b.order ?? 0));
}

async function addQuestion(testId, sectionId, qData){
  const existing = await getQuestionsByTest(testId);
  const num = parseInt(qData.number) || (existing.length + 1);
  await db.collection('questions').add({
    testId, sectionId, ...qData, number: num, order: num, createdAt: FieldValue.serverTimestamp()
  });
}

async function updateQuestion(id, qData){
  const num = parseInt(qData.number) || 1;
  await db.collection('questions').doc(id).update({
    ...qData, number: num, order: num
  });
}

async function updateQuestionsOrder(questionsList){
  const batch = db.batch();
  questionsList.forEach((q, idx) => {
    const ref = db.collection('questions').doc(q.id);
    batch.update(ref, { number: idx + 1, order: idx + 1 });
  });
  await batch.commit();
}

async function deleteQuestion(id){
  await db.collection('questions').doc(id).delete();
  await db.collection('users').doc(state.userNumber||'').collection('wrong').doc(id).delete().catch(()=>{});
}

/* Attempts & stats */
async function addAttempt(userNumber, attempt){
  await db.collection('users').doc(userNumber).collection('attempts').add({
    ...attempt, createdAt: FieldValue.serverTimestamp()
  });
}

async function getAttempts(userNumber){
  const snap = await db.collection('users').doc(userNumber).collection('attempts').orderBy('createdAt','desc').get();
  return snap.docs.map(d => ({id: d.id, ...d.data()}));
}

async function setWrong(userNumber, q){
  await db.collection('users').doc(userNumber).collection('wrong').doc(q.id).set({
    questionId: q.id, testId: q.testId, sectionId: q.sectionId, addedAt: FieldValue.serverTimestamp()
  });
}

async function clearWrong(userNumber, questionId){
  await db.collection('users').doc(userNumber).collection('wrong').doc(questionId).delete();
}

async function getWrongList(userNumber){
  const snap = await db.collection('users').doc(userNumber).collection('wrong').orderBy('addedAt','desc').get();
  return snap.docs.map(d => d.data());
}

async function toggleSaved(userNumber, q, save){
  const ref = db.collection('users').doc(userNumber).collection('saved').doc(q.id);
  if(save){
    await ref.set({ questionId: q.id, testId: q.testId, sectionId: q.sectionId, addedAt: FieldValue.serverTimestamp() });
  } else {
    await ref.delete();
  }
}

async function getSavedList(userNumber){
  const snap = await db.collection('users').doc(userNumber).collection('saved').orderBy('addedAt','desc').get();
  return snap.docs.map(d => d.data());
}

async function isSaved(userNumber, questionId){
  const d = await db.collection('users').doc(userNumber).collection('saved').doc(questionId).get();
  return d.exists;
}

async function userStats(userNumber){
  const attempts = await getAttempts(userNumber);
  let totalScore = 0, totalQ = 0, totalTime = 0;
  attempts.forEach(a => {
    totalScore += a.score || 0;
    totalQ += a.total || 0;
    totalTime += a.durationSeconds || 0;
  });
  return {
    totalAttempts: attempts.length,
    totalScore, totalQ,
    avgPercent: totalQ ? Math.round((totalScore/totalQ)*100) : 0,
    totalTime
  };
}

function svgIcon(path, extra=''){

async function doLogin(){
  const val = document.getElementById('loginInput').value.trim();
  if(!val){ toast('يرجى إدخال رقم المستخدم'); return; }
  document.getElementById('app').innerHTML = `<div class="loader">جارِ تسجيل الدخول...</div>`;
  try{
    const u = await findOrCreateUser(val);
    state.userNumber = u.number;
    state.isAdmin = u.isAdmin;
    await sessionSave(u.number, u.isAdmin);
    nav('home');
  }catch(e){
    console.error(e);
    toast('تعذّر تسجيل الدخول');
    render();
  }
}

  `;
  
  setupDragAndDrop('questionsContainer', questions, async (reorderedList) => {
    await updateQuestionsOrder(reorderedList);
    toast('تم إعادة ترتيب الأسئلة وتعديل أرقامها تلقائياً ✓');
    renderAdminQuestions(testId, testName, sectionId);
  });
}

/* Question Modal with Answers Draggable Reordering & Correct Index Selector */
let currentAnswersFormState = [];
let currentCorrectIndex = 0;

async function openQuestionModal(testId, sectionId, questionId = null, defaultNum = 1){
  let qData = {
    question: '', passage: '', answers: ['الخيار الأول', 'الخيار الثاني', 'الخيار الثالث', 'الخيار الرابع'], correctIndex: 0, number: defaultNum
  };
  
  if(questionId){
    const doc = await db.collection('questions').doc(questionId).get();
    if(doc.exists) qData = { id: doc.id, ...doc.data() };
  }
  
  currentAnswersFormState = [...(qData.answers || [])];
  currentCorrectIndex = qData.correctIndex || 0;
  
  const renderFormContent = () => `
    <div class="modal-head"><h3 style="margin:0;">${questionId ? 'تعديل سؤال' : 'إضافة سؤال'}</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
    <label>رقم السؤال (ترتيب العرض داخل الاختبار)</label>
    <input type="number" id="qNumInput" value="${qData.number || defaultNum}">
    
    <label>نص قطعة القراءة / الاستماع (اختياري)</label>
    <textarea id="qPassageInput" placeholder="إذا كان السؤال يتبع قطعة أو نص قراءة/استماع أدخله هنا...">${escapeHtml(qData.passage || '')}</textarea>
    
    <label>نص السؤال</label>
    <textarea id="qTextInput" placeholder="أدخل السؤال هنا...">${escapeHtml(qData.question || qData.sentence || '')}</textarea>
    
    <label>الخيارات (يمكنك سحب الخيار من الأيقونة ☰ لإعادة ترتيب خيارات الإجابة تلقائياً):</label>
    <div id="answersEditList">
      ${renderAnswersEditListHTML()}
    </div>
    
    <button class="btn btn-outline" style="margin-bottom:12px;" onclick="addNewAnswerChoice()">${iconPlus()} إضافة خيار إضافي</button>
    
    <label>الخيار الصحيح:</label>
    <select id="qCorrectSelect" onchange="currentCorrectIndex=parseInt(this.value); updateAnswersUI();">
      ${currentAnswersFormState.map((_, idx) => `
        <option value="${idx}" ${idx === currentCorrectIndex ? 'selected' : ''}>الخيار (${LETTERS[idx] || (idx+1)})</option>
      `).join('')}
    </select>
    
    <button class="btn btn-primary" onclick="doSaveQuestion('${testId}', '${sectionId}', ${questionId ? `'${questionId}'` : 'null'})">حفظ السؤال</button>
  `;
  
  openModal(renderFormContent(), false);
  setupAnswerChoicesDragAndDrop();
}

function renderAnswersEditListHTML(){
  return currentAnswersFormState.map((ans, idx) => `
    <div class="answer-edit-item ${idx === currentCorrectIndex ? 'correct-choice' : ''}" data-index="${idx}" draggable="true">
      <div class="drag-handle" title="سحب الخيار للترتيب">${iconDragHandle()}</div>
      <span style="font-weight:700;color:var(--accent);width:24px;">${LETTERS[idx] || (idx+1)}</span>
      <input type="text" value="${escapeHtml(ans)}" oninput="currentAnswersFormState[${idx}]=this.value" style="margin-bottom:0;flex:1;">
      ${currentAnswersFormState.length > 2 ? `<button class="icon-action danger" style="width:28px;height:28px;" onclick="removeAnswerChoice(${idx})">${iconX()}</button>` : ''}
    </div>
  `).join('');
}

function updateAnswersUI(){
  const container = document.getElementById('answersEditList');
  if(container) container.innerHTML = renderAnswersEditListHTML();
  const select = document.getElementById('qCorrectSelect');
  if(select){
    select.innerHTML = currentAnswersFormState.map((_, idx) => `
      <option value="${idx}" ${idx === currentCorrectIndex ? 'selected' : ''}>الخيار (${LETTERS[idx] || (idx+1)})</option>
    `).join('');
  }
  setupAnswerChoicesDragAndDrop();
}

function addNewAnswerChoice(){
  currentAnswersFormState.push('خيار جديد');
  updateAnswersUI();
}

function removeAnswerChoice(idx){
  if(currentAnswersFormState.length <= 2){ toast('يجب أن يحتوي السؤال على خيارين على الأقل'); return; }
  currentAnswersFormState.splice(idx, 1);
  if(currentCorrectIndex >= currentAnswersFormState.length) currentCorrectIndex = 0;
  updateAnswersUI();
}

function setupAnswerChoicesDragAndDrop(){
  const container = document.getElementById('answersEditList');
  if(!container) return;
  
  let draggedIdx = null;
  const items = container.querySelectorAll('.answer-edit-item');
  
  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedIdx = parseInt(item.getAttribute('data-index'));
      e.dataTransfer.effectAllowed = 'move';
      item.classList.add('dragging');
    });
    
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      item.classList.add('drag-over');
    });
    
    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over');
    });
    
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetIdx = parseInt(item.getAttribute('data-index'));
      if(draggedIdx !== null && draggedIdx !== targetIdx){
        const movedAns = currentAnswersFormState.splice(draggedIdx, 1)[0];
        currentAnswersFormState.splice(targetIdx, 0, movedAns);
        
        if(currentCorrectIndex === draggedIdx){
          currentCorrectIndex = targetIdx;
        } else if(draggedIdx < currentCorrectIndex && targetIdx >= currentCorrectIndex){
          currentCorrectIndex--;
        } else if(draggedIdx > currentCorrectIndex && targetIdx <= currentCorrectIndex){
          currentCorrectIndex++;
        }
        
        updateAnswersUI();
      }
    });
    
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
    });
  });
}

async function doSaveQuestion(testId, sectionId, questionId){
  const num = parseInt(document.getElementById('qNumInput').value) || 1;
  const passage = document.getElementById('qPassageInput').value.trim();
  const text = document.getElementById('qTextInput').value.trim();
  
  if(!text){ toast('يرجى إدخال نص السؤال'); return; }
  
  const qData = {
    number: num,
    passage: passage,
    question: text,
    sentence: text,
    answers: currentAnswersFormState,
    correctIndex: currentCorrectIndex
  };
  
  closeModal();
  if(questionId && questionId !== 'null'){
    await updateQuestion(questionId, qData);
    toast('تم تعديل السؤال بنجاح ✓');
  } else {
    await addQuestion(testId, sectionId, qData);
    toast('تمت إضافة السؤال بنجاح ✓');
  }
  renderAdminQuestions(testId, state.route.params.testName, sectionId);
}

function confirmDeleteQuestion(qId, testId, testName, sectionId){
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">حذف السؤال؟</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
    <p class="sub">هل أنت أكتد من حذف هذا السؤال النهائي؟</p>
    <div class="btn-row"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn btn-danger" onclick="doDeleteQuestion('${qId}', '${testId}', '${testName}', '${sectionId}')">حذف</button></div>
  `, true);
}

async function doDeleteQuestion(qId, testId, testName, sectionId){
  closeModal();
  await deleteQuestion(qId);
  toast('تم حذف السؤال');
  renderAdminQuestions(testId, testName, sectionId);
}

/* Generic Drag and Drop helper for list reordering */
function setupDragAndDrop(containerId, listArray, onReordered){
  const container = document.getElementById(containerId);
  if(!container) return;
  
  let draggedIdx = null;
  const items = container.querySelectorAll('.list-item');
  
  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedIdx = parseInt(item.getAttribute('data-index'));
      e.dataTransfer.effectAllowed = 'move';
      item.classList.add('dragging');
    });
    
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      item.classList.add('drag-over');
    });
    
    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over');
    });
    
    item.addEventListener('drop', async (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetIdx = parseInt(item.getAttribute('data-index'));
      if(draggedIdx !== null && draggedIdx !== targetIdx){
        const copyList = [...listArray];
        const movedItem = copyList.splice(draggedIdx, 1)[0];
        copyList.splice(targetIdx, 0, movedItem);
        await onReordered(copyList);
      }
    });
    
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
    });
  });
}

async function startTest(testId, testName){
  document.getElementById('page-content').innerHTML = `<div class="loader">جارِ تجهيز الاختبار...</div>`;
  let questions = [];
  
  if(offlineEnabled()){
    const blob = getOfflineBlob();
    if(blob && blob.questions){
      questions = blob.questions.filter(q => q.testId === testId);
    }
  } else {
    questions = await getQuestionsByTest(testId);
  }
  
  if(questions.length === 0){
    toast('لا توجد أسئلة متوفرة في هذا الاختبار');
    renderUserSections();
    return;
  }
  
  state.quiz = {
    testId,
    testName,
    questions,
    currentIndex: 0,
    userAnswers: {},
    startTime: Date.now(),
    savedSet: new Set()
  };
  
  nav('quiz');
}

function renderQuizScreen(){
  const qz = state.quiz;
  if(!qz) { goBack(); return; }
  
  const q = qz.questions[qz.currentIndex];
  const total = qz.questions.length;
  const progressPercent = Math.round(((qz.currentIndex + 1) / total) * 100);
  const selectedAns = qz.userAnswers[q.id];
  
  const cont = document.getElementById('page-content');
  cont.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-faint);margin-bottom:6px;">
        <span>${escapeHtml(qz.testName)}</span>
        <span>السؤال ${qz.currentIndex + 1} من ${total}</span>
      </div>
      <div style="height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;">
        <div style="height:100%;width:${progressPercent}%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.3s;"></div>
      </div>
    </div>
    
    <div class="q-card">
      ${q.passage ? `<div class="q-passage"><b>النص المرفق:</b><br>${escapeHtml(q.passage)}</div>` : ''}
      <div class="q-text">${escapeHtml(q.question || q.sentence || '')}</div>
      
      <div style="margin-top:16px;">
        ${(q.answers || []).map((ans, idx) => `
          <div class="answer ${selectedAns === idx ? 'selected' : ''}" onclick="selectQuizAnswer('${q.id}', ${idx})">
            <div class="letter">${LETTERS[idx] || (idx+1)}</div>
            <div style="flex:1;">${escapeHtml(ans)}</div>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div style="display:flex;justify-content:space-between;gap:10px;">
      <button class="btn btn-outline" style="width:auto;" onclick="prevQuizQuestion()" ${qz.currentIndex === 0 ? 'disabled style="opacity:0.4;"' : ''}>السابق</button>
      <button class="btn icon-btn" style="width:44px;height:44px;" onclick="toggleSaveCurrentQuizQuestion('${q.id}')">${iconBookmark(qz.savedSet.has(q.id))}</button>
      ${qz.currentIndex < total - 1 ? `
        <button class="btn btn-primary" style="width:auto;flex:1;" onclick="nextQuizQuestion()">السؤال التالي</button>
      ` : `
        <button class="btn btn-primary" style="width:auto;flex:1;background:var(--success);border-color:var(--success);color:#0a2014;" onclick="finishQuizSession()">إنهاء الاختبار</button>
      `}
    </div>
  `;
}

function selectQuizAnswer(qId, idx){
  state.quiz.userAnswers[qId] = idx;
  renderQuizScreen();
}

function nextQuizQuestion(){
  if(state.quiz.currentIndex < state.quiz.questions.length - 1){
    state.quiz.currentIndex++;
    renderQuizScreen();
  }
}

function prevQuizQuestion(){
  if(state.quiz.currentIndex > 0){
    state.quiz.currentIndex--;
    renderQuizScreen();
  }
}

async function toggleSaveCurrentQuizQuestion(qId){
  const qz = state.quiz;
  const isSavedNow = qz.savedSet.has(qId);
  if(isSavedNow){
    qz.savedSet.delete(qId);
    if(!offlineEnabled()) await toggleSaved(state.userNumber, { id: qId, testId: qz.testId }, false);
    toast('تمت إزالة السؤال من المحفوظات');
  } else {
    qz.savedSet.add(qId);
    if(!offlineEnabled()) await toggleSaved(state.userNumber, { id: qId, testId: qz.testId }, true);
    toast('تم حفظ السؤال');
  }
  renderQuizScreen();
}

async function finishQuizSession(){
  const qz = state.quiz;
  const durationSec = Math.round((Date.now() - qz.startTime) / 1000);
  let score = 0;
  
  qz.questions.forEach(q => {
    const userAns = qz.userAnswers[q.id];
    if(userAns === q.correctIndex){
      score++;
      if(!offlineEnabled()) clearWrong(state.userNumber, q.id);
    } else {
      if(!offlineEnabled()) setWrong(state.userNumber, q);
    }
  });
  
  const total = qz.questions.length;
  const percent = Math.round((score / total) * 100);
  
  if(!offlineEnabled()){
    await addAttempt(state.userNumber, {
      testId: qz.testId,
      testName: qz.testName,
      score,
      total,
      durationSeconds: durationSec
    });
  }
  
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">نتيجة الاختبار</h3><div class="modal-close" onclick="closeModal();nav('sections');">${iconClose()}</div></div>
    <div style="text-align:center;padding:10px 0;">
      <div style="font-size:42px;font-weight:900;color:var(--accent);">${percent}%</div>
      <div style="font-size:16px;margin:8px 0;">الإجابات الصحيحة: ${score} من أصل ${total}</div>
      <div style="color:var(--text-dim);font-size:13px;">الوقت المستغرق: ${fmtDuration(durationSec)}</div>
    </div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="closeModal();nav('sections');">العودة للأقسام</button>
  `, true);
}

async function renderWrongQuestions(){
  const cont = document.getElementById('page-content');
  cont.innerHTML = `<div class="loader">جارِ التحميل...</div>`;
  const list = await getWrongList(state.userNumber);
  if(list.length === 0){
    cont.innerHTML = `<div class="empty">لا توجد أسئلة خاطئة محفوظة حالياً. ممتاز!</div>`;
    return;
  }
  
  cont.innerHTML = `
    <div class="section-title">الأسئلة الخاطئة (${list.length})</div>
    ${list.map(w => `
      <div class="list-item" style="cursor:default;">
        <div style="flex:1;">
          <div class="title">معرّف السؤال: ${w.questionId}</div>
          <div class="sub">تمت إضافته تلقائياً عند الخطأ فيه</div>
        </div>
        <button class="icon-action danger" onclick="removeWrongItem('${w.questionId}')">${iconTrash()}</button>
      </div>
    `).join('')}
  `;
}

async function removeWrongItem(qid){
  await clearWrong(state.userNumber, qid);
  toast('تمت إزالة السؤال');
  renderWrongQuestions();
}

async function renderSavedQuestions(){
  const cont = document.getElementById('page-content');
  cont.innerHTML = `<div class="loader">جارِ التحميل...</div>`;
  const list = await getSavedList(state.userNumber);
  if(list.length === 0){
    cont.innerHTML = `<div class="empty">لا توجد أسئلة في المحفوظات.</div>`;
    return;
  }
  
  cont.innerHTML = `
    <div class="section-title">الأسئلة المحفوظة (${list.length})</div>
    ${list.map(s => `
      <div class="list-item" style="cursor:default;">
        <div style="flex:1;">
          <div class="title">سؤال محفوظ برقم: ${s.questionId}</div>
        </div>
        <button class="icon-action danger" onclick="removeSavedItem('${s.questionId}')">${iconTrash()}</button>
      </div>
    `).join('')}
  `;
}

async function removeSavedItem(qid){
  await toggleSaved(state.userNumber, { id: qid }, false);
  toast('تمت الإزالة من المحفوظات');
  renderSavedQuestions();
}

async function renderHistory(){
  const cont = document.getElementById('page-content');
  cont.innerHTML = `<div class="loader">جارِ تحميل سجل الاختبارات...</div>`;
  const attempts = await getAttempts(state.userNumber);
  if(attempts.length === 0){
    cont.innerHTML = `<div class="empty">لم تقم بإجراء أية اختبارات بعد.</div>`;
    return;
  }
  
  cont.innerHTML = `
    <div class="section-title">سجل الاختبارات السابقة</div>
    ${attempts.map(a => `
      <div class="list-item" style="cursor:default;">
        <div>
          <div class="title">${escapeHtml(a.testName || 'اختبار STEP')}</div>
          <div class="sub">النتيجة: ${a.score}/${a.total} (${Math.round(((a.score||0)/(a.total||1))*100)}%) - الوقت: ${fmtDuration(a.durationSeconds||0)}</div>
        </div>
        <span class="chip chip-accent">${Math.round(((a.score||0)/(a.total||1))*100)}%</span>
      </div>
    `).join('')}
  `;
}

function renderOfflineSections(){
  const cont = document.getElementById('page-content');
  const blob = getOfflineBlob();
  if(!blob || !blob.sections || blob.sections.length === 0){
    cont.innerHTML = `<div class="empty">لا توجد أية بيانات محلياً. قُم بتمكين السويتش بالإنترنت أولاً للتنزيل.</div>`;
    return;
  }
  
  cont.innerHTML = `
    <div class="section-title">المحتوى المحفوظ (بدون اتصال)</div>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:14px;">آخر تحديث: ${blob.syncedAt ? new Date(blob.syncedAt).toLocaleString('ar-SA') : '-'}</div>
    ${blob.sections.map(s => {
      const tests = (blob.tests || []).filter(t => t.sectionId === s.id);
      return `
        <div class="card" style="margin-bottom:14px;">
          <div style="font-weight:800;font-size:17px;color:var(--accent);margin-bottom:10px;">القسم ${s.number}: ${escapeHtml(s.name)}</div>
          ${tests.map(t => `
            <div class="list-item" onclick="startTest('${t.id}', '${escapeHtml(t.name).replace(/'/g,"\\'")}')">
              <div class="title">اختبار رقم ${t.number}: ${escapeHtml(t.name)}</div>
              <div>${iconChev()}</div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('')}
  `;
}

function openModal(contentHtml, center = true){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = `modal-overlay ${center ? 'center' : ''}`;
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal">${contentHtml}</div>`;
  document.body.appendChild(overlay);
}

function closeModal(){
  const m = document.getElementById('activeModal');
  if(m) m.remove();
}

async function render(){
  const app = document.getElementById('app');
  if(!state.userNumber && state.route.name !== 'login'){
    const savedSession = await sessionLoad();
    if(savedSession){
      state.userNumber = savedSession.num;
      state.isAdmin = savedSession.isAdmin;
      state.route = { name: 'home', params: {} };
    } else {
      state.route = { name: 'login', params: {} };
    }
  }

  app.innerHTML = `
    ${renderTopbar()}
    ${renderDrawer()}
    <div class="page" id="page-content"></div>
  `;

  if(state.route.name === 'login') renderLogin();
  else if(state.route.name === 'home') renderHome();
  else if(state.route.name === 'sections') renderUserSections();
  else if(state.route.name === 'quiz') renderQuizScreen();
  else if(state.route.name === 'wrong') renderWrongQuestions();
  else if(state.route.name === 'saved') renderSavedQuestions();
  else if(state.route.name === 'history') renderHistory();
  else if(state.route.name === 'offline-sections') renderOfflineSections();
  else if(state.route.name === 'admin-sections') renderAdminSections();
  else if(state.route.name === 'admin-tests') renderAdminTests(state.route.params.sectionId, state.route.params.sectionName);
  else if(state.route.name === 'admin-questions') renderAdminQuestions(state.route.params.testId, state.route.params.testName, state.route.params.sectionId);
}

/* Initial Boot */
window.onload = function(){
  render();
};
</script>
