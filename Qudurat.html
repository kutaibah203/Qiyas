<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قُدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --bg:#12172B; --bg-2:#0D1122;
  --surface:#1B2140; --surface-2:#232A4D; --surface-3:#2B3260;
  --text:#EDEAE0; --text-dim:#A7ACC8; --text-faint:#6B7196;
  --accent:#E8B44C; --accent-dim:#3A3221;
  --accent2:#4FA8A0;
  --danger:#E2637A; --danger-dim:#3A2530;
  --success:#6FCF97; --success-dim:#1E3A2C;
  --border:rgba(237,234,224,.12);
  --radius:16px; --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 20% -10%, #1B2140 0%, var(--bg) 45%, var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent);color:#12172B;}
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(18,23,43,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:flex;align-items:center;justify-content:center;transition:.15s;}
.icon-btn:hover{background:var(--surface-3);border-color:var(--accent);}
.topbar-title{font-weight:700;color:var(--text-dim);font-size:14px;letter-spacing:.5px;}

/* ---- drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(6,8,16,.6);z-index:29;opacity:0;pointer-events:none;transition:.25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;right:0;width:78%;max-width:320px;background:var(--surface);z-index:30;
  transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 0;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.drawer-head .num{font-family:'Tajawal';font-weight:800;font-size:22px;color:var(--accent);}
.drawer-head .tag{color:var(--text-faint);font-size:12px;}
.drawer-item{display:flex;align-items:center;gap:12px;padding:14px 20px;color:var(--text);text-decoration:none;
  border-right:3px solid transparent;transition:.15s;font-size:15px;}
.drawer-item:hover,.drawer-item.active{background:var(--surface-2);border-right-color:var(--accent);}
.drawer-item .ic{width:20px;text-align:center;color:var(--accent2);}

/* ---- content ---- */
.page{padding:20px 16px 12px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-title{font-size:22px;font-weight:800;margin:4px 0 18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.stat-card:before{content:'';position:absolute;top:-20px;left:-20px;width:70px;height:70px;background:var(--accent);opacity:.08;border-radius:50%;}
.stat-num{font-family:'Tajawal';font-size:28px;font-weight:800;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14.5px;transition:.15s;width:100%;}
.btn:hover{background:var(--surface-3);}
.btn-primary{background:var(--accent);color:#1a1408;border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1px solid var(--accent2);color:var(--accent2);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-row{display:flex;gap:10px;}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;transition:.15s;cursor:pointer;}
.list-item:hover{border-color:var(--accent2);}
.list-item .title{font-weight:700;font-size:15.5px;}
.list-item .sub{font-size:12px;color:var(--text-faint);margin-top:3px;}
.chip{font-size:11px;background:var(--surface-3);color:var(--text-dim);padding:3px 9px;border-radius:20px;}
.chip-danger{background:var(--danger-dim);color:var(--danger);}
.chip-success{background:var(--success-dim);color:var(--success);}
.icon-action{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.icon-action:hover{border-color:var(--danger);color:var(--danger);}
.list-item.selectable{cursor:pointer;}
.list-item.picked{border-color:var(--accent);background:var(--accent-dim);}
.pick-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--text-faint);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#1a1408;font-weight:900;font-size:13px;}
.list-item.picked .pick-box{background:var(--accent);border-color:var(--accent);}

input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);
  color:var(--text);font-family:inherit;font-size:14.5px;margin-bottom:12px;}
textarea{resize:vertical;min-height:100px;}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field{margin-bottom:14px;}

/* login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.login-mark{font-family:'Tajawal';font-weight:900;font-size:44px;letter-spacing:2px;color:var(--accent);position:relative;}
.login-mark:after{content:'';display:block;width:70px;height:6px;background:var(--accent);margin:10px auto 0;border-radius:4px;opacity:.5;}
.login-sub{color:var(--text-dim);margin:10px 0 34px;font-size:14px;}
.login-box{width:100%;max-width:340px;}

/* quiz */
.progress-wrap{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:18px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transition:.3s;}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--text-faint);}
.q-tag{color:var(--accent);font-weight:700;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.q-instruction{color:var(--accent2);font-weight:700;font-size:13.5px;margin-bottom:10px;}
.q-text{font-size:17px;line-height:1.9;font-weight:600;margin-bottom:6px;}
.q-passage-link{font-size:12.5px;color:var(--accent2);text-decoration:underline;cursor:pointer;margin-bottom:10px;display:inline-block;}
.answer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;transition:.15s;cursor:pointer;}
.answer:hover{border-color:var(--accent2);}
.answer.selected{border-color:var(--accent);background:var(--accent-dim);}
.answer .letter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text-faint);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;color:var(--text-dim);}
.answer.selected .letter{background:var(--accent);border-color:var(--accent);color:#1a1408;}
.answer.correct{border-color:var(--success);background:var(--success-dim);}
.answer.correct .letter{background:var(--success);border-color:var(--success);color:#0c2016;}
.answer.wrong{border-color:var(--danger);background:var(--danger-dim);}
.answer.locked{cursor:default;pointer-events:none;}
.answer.wrong .letter{background:var(--danger);border-color:var(--danger);color:#2c0f16;}
.quiz-tools{display:flex;gap:10px;margin-bottom:14px;}
.tool-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:.15s;}
.tool-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.tool-btn.review-active{border-color:var(--accent2);color:var(--accent2);background:rgba(79,168,160,.12);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,8,16,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.center{align-items:center;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;max-width:640px;width:100%;
  max-height:82vh;overflow-y:auto;padding:20px;}
.modal-overlay.center .modal{border-radius:var(--radius);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);}

.empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.5;}
.divider{height:1px;background:var(--border);margin:18px 0;}
.hidden{display:none !important;}
.type-badge{display:inline-block;font-size:11px;background:var(--surface-3);color:var(--accent2);padding:4px 10px;border-radius:8px;margin-bottom:8px;}
.small-note{font-size:12px;color:var(--text-faint);line-height:1.7;}
.pill-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill{padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-dim);}
.pill.active{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--accent);
  color:var(--text);padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;bottom:34px;}
.loader{text-align:center;padding:60px 20px;color:var(--text-faint);}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-3);border-radius:24px;transition:.2s;}
.switch-slider:before{content:'';position:absolute;height:18px;width:18px;right:3px;bottom:3px;background:var(--text-dim);border-radius:50%;transition:.2s;}
.switch input:checked + .switch-slider{background:var(--accent);}
.switch input:checked + .switch-slider:before{transform:translateX(-18px);background:#1a1408;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBbZtSY_IIyH0cXsWX3lbyIN4UwLD_5j04",
  authDomain: "qudurat-2da37.firebaseapp.com",
  projectId: "qudurat-2da37",
  storageBucket: "qudurat-2da37.firebasestorage.app",
  messagingSenderId: "565850407112",
  appId: "1:565850407112:web:94f1b6b5edf501c675e5fd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

/* ================= constants ================= */
const QTYPES = {
  contextual_error: { label:'الخطأ السياقي', instruction:'استخرج الخطأ السياقي' },
  analogy: { label:'التناظر اللفظي', instruction:'استخرج التناظر' },
  reading: { label:'فهم المقروء', instruction:'استخرج المطلوب من النص:' },
  odd_word: { label:'المفردة الشاذة', instruction:'استخرج المفردة الشاذة' },
  sentence_completion: { label:'إكمال الجمل', instruction:'أكمل الجملة الآتية:' }
};
const LETTERS = ['أ','ب','ج','د'];

/* ================= state ================= */
let state = {
  userNumber:null, isAdmin:false,
  sections:[], sectionsLoaded:false,
  importantQuestions:[], importantLoaded:false,
  drawerOpen:false,
  route:{name:'login', params:{}},
  history:[],
  quiz:null, // active quiz session
  cache:{}
};

/* ================= helpers ================= */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function fmtDuration(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return `${h}س ${m}د ${s}ث`;
  if(m>0) return `${m}د ${s}ث`;
  return `${s}ث`;
}
function fmtDate(ts){
  if(!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'});
}
function fmtTime(ts){
  if(!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
}
function nav(name, params={}){
  if(state.route && state.route.name){ state.history.push({name:state.route.name, params:state.route.params}); }
  state.route={name,params}; state.drawerOpen=false; render();
  window.scrollTo(0,0);
}
function actuallyGoBack(){
  if(state.history.length>0){ state.route = state.history.pop(); }
  else{ state.route = {name:'home',params:{}}; }
  state.drawerOpen=false; render();
  window.scrollTo(0,0);
}
function goBack(){
  if(state.route.name==='quiz'){
    openModal(`
      <div class="modal-head"><h3 style="margin:0;">إنهاء الاختبار؟</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
      <p class="sub">سيتم الخروج من الاختبار الحالي بدون حفظ نتيجته. متابعة؟</p>
      <div class="btn-row"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn btn-danger" onclick="closeModal();actuallyGoBack();">خروج</button></div>
    `, true);
    return;
  }
  actuallyGoBack();
}
async function sessionSave(num,isAdmin){
  try{ localStorage.setItem('qudurat_session', JSON.stringify({num,isAdmin})); }catch(e){}
}
async function sessionLoad(){
  try{ const r=localStorage.getItem('qudurat_session'); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
async function sessionClear(){ try{ localStorage.removeItem('qudurat_session'); }catch(e){} }

/* ================= offline local browsing (download sections) ================= */
function offlineBlobKey(){ return 'qudurat_offline_'+state.userNumber; }
function offlineToggleKey(){ return 'qudurat_offline_on_'+state.userNumber; }
function offlineEnabled(){ return state.userNumber ? localStorage.getItem(offlineToggleKey())==='1' : false; }
function setOfflineEnabled(v){ if(state.userNumber) localStorage.setItem(offlineToggleKey(), v?'1':'0'); }
function getOfflineBlob(){
  if(!state.userNumber) return null;
  try{ const v = localStorage.getItem(offlineBlobKey()); return v? JSON.parse(v): null; }catch(e){ return null; }
}
function saveOfflineBlob(b){
  if(!state.userNumber) return false;
  try{ b.syncedAt=Date.now(); localStorage.setItem(offlineBlobKey(), JSON.stringify(b)); return true; }
  catch(e){ console.error('offline save failed', e); return false; }
}
function tsToPlain(ts){
  if(ts && typeof ts==='object'){
    if(typeof ts.seconds==='number') return {seconds:ts.seconds};
    if(typeof ts.toDate==='function'){ try{ return {seconds:Math.floor(ts.toDate().getTime()/1000)}; }catch(e){} }
  }
  return {seconds:0};
}
async function downloadSectionsData(){
  const secSnap = await db.collection('sections').orderBy('createdAt','asc').get();
  const sections = secSnap.docs.map(d=>({id:d.id,...d.data(),createdAt:tsToPlain(d.data().createdAt)}));
  const qSnap = await db.collection('questions').get();
  const questions = qSnap.docs.map(d=>({id:d.id,...d.data(),createdAt:tsToPlain(d.data().createdAt)}));
  const ok = saveOfflineBlob({sections, questions});
  if(!ok) throw new Error('تعذّر حفظ النسخة محلياً (مساحة التخزين ممتلئة أو غير متاحة)');
  return {sections, questions};
}
async function onToggleOffline(v){
  setOfflineEnabled(v);
  if(v){
    toast('جارِ تنزيل نسخة الأقسام...');
    try{ await downloadSectionsData(); toast('تم تنزيل الأقسام بنجاح ✓'); }
    catch(e){ console.error(e); toast('تعذّر التنزيل الآن — تحقّق من الاتصال أو صلاحيات Firestore'); }
  }else{
    toast('تم إيقاف تنزيل الأقسام');
  }
  render();
}
async function manualRefreshOffline(){
  toggleDrawer(false);
  toast('جارِ تحديث البيانات...');
  try{ await downloadSectionsData(); toast('تم تحديث البيانات بنجاح ✓'); }
  catch(e){ console.error(e); toast('تعذّر الاتصال الآن، حاول لاحقاً'); }
  render();
}
function confirmClearLocalData(){
  toggleDrawer(false);
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">حذف البيانات المحلية</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
    <p class="sub">سيتم حذف نسخة الأقسام والأسئلة المحفوظة محلياً على هذا الجهاز فقط، ولن يتأثر أي شيء في قاعدة البيانات الفعلية. متابعة؟</p>
    <div class="btn-row"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn btn-danger" onclick="doClearLocalData()">حذف</button></div>
  `, true);
}
async function doClearLocalData(){
  if(state.userNumber) localStorage.removeItem(offlineBlobKey());
  closeModal();
  toast('تم حذف البيانات المحلية');
  render();
}
function startOfflineQuiz(sectionId, sectionName){
  const blob = getOfflineBlob();
  if(!blob){ toast('لا توجد بيانات محفوظة بعد'); return; }
  let qs, secName;
  if(sectionId==='all'){
    qs = sortAllBySectionThenOrder(blob.questions||[], blob.sections||[]);
    secName = 'كل الأقسام (بدون اتصال)';
  }else{
    qs = sortByOrder((blob.questions||[]).filter(q=>q.sectionId===sectionId));
    secName = sectionName || ((blob.sections||[]).find(s=>s.id===sectionId)||{}).name || '';
  }
  if(!qs || qs.length===0){ toast('لا توجد أسئلة محفوظة لهذا الاختيار'); return; }
  beginQuizSession(qs, secName, sectionId, true);
}
function renderOfflineSections(){
  const cont = document.getElementById('page-content');
  const blob = getOfflineBlob();
  if(!blob || !blob.sections || blob.sections.length===0){
    cont.innerHTML = emptyState('لا توجد نسخة محفوظة بعد','فعّل السويتش أو اضغط "تحديث البيانات" وأنت متصل بالإنترنت');
    return;
  }
  cont.innerHTML = `
    <div class="section-title">الأقسام المحفوظة (بدون اتصال)</div>
    <div class="small-note" style="margin-bottom:14px;">آخر تحديث: ${blob.syncedAt? new Date(blob.syncedAt).toLocaleString('ar-SA'):'-'}</div>
    <button class="btn btn-outline" style="margin-bottom:16px;" onclick="startOfflineQuiz('all')">${iconGrid()} اختبر جميع الأقسام</button>
    ${blob.sections.map(s=>{
      const count = (blob.questions||[]).filter(q=>q.sectionId===s.id).length;
      return `<div class="list-item" style="cursor:default;">
        <div style="flex:1;cursor:pointer;" onclick="nav('offline-section-view',{id:'${s.id}',name:'${escapeHtml(s.name).replace(/'/g,"\\'")}'})">
          <div class="title">${escapeHtml(s.name)}</div><div class="sub">${count} سؤال</div>
        </div>
        <div class="icon-action" title="ابدأ اختبار القسم" onclick="startOfflineQuiz('${s.id}','${escapeHtml(s.name).replace(/'/g,"\\'")}')">${iconGrid()}</div>
      </div>`;
    }).join('')}
  `;
}
function renderOfflineQuestionBody(q){
  if(q.type==='reading'){
    return `<div class="small-note" style="margin-bottom:8px;line-height:1.9;"><b>النص:</b> ${escapeHtml(q.passage)}</div><div class="q-text">${escapeHtml(q.question)}</div>`;
  }
  if(q.type==='odd_word') return '';
  if(q.type==='analogy') return `<div class="q-text">${escapeHtml(q.word1)} : ${escapeHtml(q.word2)}</div>`;
  return `<div class="q-text">${escapeHtml(q.sentence)}</div>`;
}
function renderOfflineAnswers(q){
  return (q.answers||[]).map((a,i)=>{
    const label = q.type==='analogy' ? `${a.w1} : ${a.w2}` : a;
    const cls = i===q.correctIndex ? 'correct' : '';
    return `<div class="answer ${cls}"><div class="letter">${LETTERS[i]}</div><div>${escapeHtml(label)}</div></div>`;
  }).join('');
}
function renderOfflineSectionView(sectionId, sectionName){
  const cont = document.getElementById('page-content');
  const blob = getOfflineBlob();
  if(!blob){ cont.innerHTML = emptyState('لا توجد بيانات محفوظة',''); return; }
  const sec = (blob.sections||[]).find(s=>s.id===sectionId);
  const questions = sortByOrder((blob.questions||[]).filter(q=>q.sectionId===sectionId));
  cont.innerHTML = `
    <div class="section-title">${escapeHtml(sec? sec.name : (sectionName||'قسم'))}</div>
    ${questions.length>0? `<button class="btn btn-primary" style="margin-bottom:16px;" onclick="startOfflineQuiz('${sectionId}','${escapeHtml((sec?sec.name:sectionName)||'').replace(/'/g,"\\'")}')">ابدأ اختبار هذا القسم</button>`:''}
    ${questions.length===0? emptyState('لا توجد أسئلة محفوظة لهذا القسم',''):''}
    ${questions.map(q=>`
      <div class="q-card" style="margin-bottom:14px;">
        <div class="type-badge">${QTYPES[q.type].label}</div>
        <div class="q-instruction">${QTYPES[q.type].instruction}</div>
        ${renderOfflineQuestionBody(q)}
        <div style="margin-top:12px;">${renderOfflineAnswers(q)}</div>
      </div>`).join('')}
  `;
}

/* ================= data layer ================= */
async function findOrCreateUser(number){
  const isAdmin = number === '330';
  const ref = db.collection('users').doc(number);
  const snap = await ref.get();
  if(!snap.exists){
    await ref.set({ number, isAdmin, createdAt: FieldValue.serverTimestamp() });
  }
  return { number, isAdmin };
}
async function loadSections(force){
  if(state.sectionsLoaded && !force) return state.sections;
  const snap = await db.collection('sections').orderBy('createdAt','asc').get();
  state.sections = snap.docs.map(d=>({id:d.id,...d.data()}));
  state.sectionsLoaded = true;
  return state.sections;
}
async function addSection(name, number){
  const ref = await db.collection('sections').add({name, number: number||'', createdAt:FieldValue.serverTimestamp()});
  state.sectionsLoaded=false;
  return ref.id;
}
async function updateSection(id,name){
  await db.collection('sections').doc(id).update({name});
  state.sectionsLoaded=false;
}
async function deleteSection(id){
  const qs = await db.collection('questions').where('sectionId','==',id).get();
  const batch = db.batch();
  qs.docs.forEach(d=>batch.delete(d.ref));
  batch.delete(db.collection('sections').doc(id));
  await batch.commit();
  state.sectionsLoaded=false;
}
function sortByOrder(list){
  return list.slice().sort((a,b)=> (a.order??a.createdAt?.seconds??0) - (b.order??b.createdAt?.seconds??0));
}
function sortAllBySectionThenOrder(list, sections){
  const idx = {}; (sections||[]).forEach((s,i)=>idx[s.id]=i);
  return list.slice().sort((a,b)=>{
    const sa = idx[a.sectionId]??999999, sb = idx[b.sectionId]??999999;
    if(sa!==sb) return sa-sb;
    return (a.order??a.createdAt?.seconds??0) - (b.order??b.createdAt?.seconds??0);
  });
}
async function getQuestions(sectionId){
  const snap = await db.collection('questions').where('sectionId','==',sectionId).get();
  let list = snap.docs.map(d=>({id:d.id,...d.data()}));
  return sortByOrder(list);
}
async function getAllQuestions(){
  await loadSections();
  const snap = await db.collection('questions').get();
  let list = snap.docs.map(d=>({id:d.id,...d.data()}));
  return sortAllBySectionThenOrder(list, state.sections);
}
async function nextOrderForSection(sectionId){
  const snap = await db.collection('questions').where('sectionId','==',sectionId).get();
  return snap.size;
}
/* ================= IMPORTANT QUESTIONS (admin-managed, global, not tied to a section) ================= */
async function loadImportantQuestions(force){
  if(state.importantLoaded && !force) return state.importantQuestions;
  const snap = await db.collection('important_questions').get();
  state.importantQuestions = sortByOrder(snap.docs.map(d=>({id:d.id,...d.data()})));
  state.importantLoaded = true;
  return state.importantQuestions;
}
async function addImportantQuestion(type, data){
  let order = data.order;
  if(order===undefined || order===null || isNaN(order)){
    const list = await loadImportantQuestions(true);
    order = list.length;
  }
  await db.collection('important_questions').add({type,...data,order,createdAt:FieldValue.serverTimestamp()});
  state.importantLoaded = false;
}
async function updateImportantQuestion(id,type,data){
  await db.collection('important_questions').doc(id).update({type,...data});
  state.importantLoaded = false;
  if(typeof questionCache!=='undefined') delete questionCache[id];
}
async function deleteImportantQuestion(id){
  await db.collection('important_questions').doc(id).delete();
  await db.collection('users').doc(state.userNumber||'').collection('wrong').doc(id).delete().catch(()=>{});
  if(typeof questionCache!=='undefined') delete questionCache[id];
  state.importantLoaded = false;
}
async function addQuestion(sectionId,type,data){
  let order = data.order;
  if(order===undefined || order===null || isNaN(order)) order = await nextOrderForSection(sectionId);
  await db.collection('questions').add({sectionId,type,...data,order,createdAt:FieldValue.serverTimestamp()});
}
async function updateQuestion(id,type,data){
  await db.collection('questions').doc(id).update({type,...data});
  if(typeof questionCache!=='undefined') delete questionCache[id];
}
async function deleteQuestion(id){
  await db.collection('questions').doc(id).delete();
  await db.collection('users').doc(state.userNumber||'').collection('wrong').doc(id).delete().catch(()=>{});
  if(typeof questionCache!=='undefined') delete questionCache[id];
}

/* ================= APP SETTINGS (global, set by admin — stored in Firestore: settings/app) ================= */
const SETTINGS_LS_KEY = 'qudurat_settings_cache';
let appSettings = (function(){
  try{ const r = localStorage.getItem(SETTINGS_LS_KEY); if(r) return Object.assign({instantFeedback:false}, JSON.parse(r)); }catch(e){}
  return {instantFeedback:false};
})();
function cacheSettings(){ try{ localStorage.setItem(SETTINGS_LS_KEY, JSON.stringify(appSettings)); }catch(e){} }
async function refreshSettings(timeoutMs){
  try{
    const snap = await Promise.race([
      db.collection('settings').doc('app').get(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), timeoutMs||2500))
    ]);
    const d = snap.exists ? snap.data() : {};
    appSettings = { instantFeedback: !!d.instantFeedback };
    cacheSettings();
  }catch(e){ console.error('refreshSettings failed, using cached value', e); }
  return appSettings;
}
async function saveSetting(key, value){
  await db.collection('settings').doc('app').set({[key]:value}, {merge:true});
  appSettings = {...appSettings, [key]:value};
  cacheSettings();
}

async function addAttempt(userNumber, attempt){
  const ref = await db.collection('users').doc(userNumber).collection('attempts').add({

}
async function getAttempts(userNumber){

async function getAttempt(userNumber, id){

}

async function setWrong(userNumber, q){

}
async function getWrongList(userNumber){

async function toggleSaved(userNumber, q, save){
  const ref = db.collection('users').doc(userNumber).collection('saved').doc(q.id);

  else{ await ref.delete(); }

async function getSavedList(userNumber){

  return snap.docs.map(d=>d.data());
}
async function isSaved(userNumber, questionId){

}

async function adminStats(){
  const [secSnap, qSnap, attSnap] = await Promise.all([
    db.collection('sections').get(),
    db.collection('questions').get(),
    db.collectionGroup('attempts').get()
  ]);
  return { sections:secSnap.size, questions:qSnap.size, attempts:attSnap.size };
}
async function userStats(userNumber){
  const attempts = await getAttempts(userNumber);
  const bySection = new Set(attempts.filter(a=>a.sectionId && a.sectionId!=='all').map(a=>a.sectionId));
  let totalScore=0,totalQ=0,totalTime=0;
  attempts.forEach(a=>{ totalScore+=a.score||0; totalQ+=a.total||0; totalTime+=a.durationSeconds||0; });
  return {
    testedSections:bySection.size,
    totalAttempts:attempts.length,
    totalScore, totalQ,
    avgPercent: totalQ? Math.round((totalScore/totalQ)*100):0,
    totalTime,
    avgTime: attempts.length? Math.round(totalTime/attempts.length):0
  };
}

/* ================= question rendering helpers ================= */
function questionPrompt(q){
  if(q.type==='reading') return q.question;
  if(q.type==='contextual_error' || q.type==='analogy') return q.sentence || (q.word1? `${q.word1} : ${q.word2}`:'');
  if(q.type==='sentence_completion') return q.sentence;
  if(q.type==='odd_word') return '';
  return q.sentence||q.question||'';
}
function answerLabel(q, idx){
  if(q.type==='analogy'){
    const a=q.answers[idx];
    return `${a.w1} : ${a.w2}`;
  }
  return q.answers[idx];
}
function questionSummaryText(q){
  if(q.type==='reading') return q.question;
  if(q.type==='analogy') return `${q.word1} : ${q.word2}`;
  return q.sentence || '';
}

function renderLogin(){
  return `

async function doLogin(){
  const val = document.getElementById('loginInput').value.trim();
  if(!val){ toast('أدخل رقم المستخدم'); return; }
  document.getElementById('app').innerHTML = `<div class="loader">جارِ الدخول...</div>`;
  try{
    const u = await findOrCreateUser(val);
    state.userNumber = u.number; state.isAdmin = u.isAdmin;
    await sessionSave(u.number, u.isAdmin);
    nav('home');
  }catch(e){
    console.error(e);
    const code = e.code || '';
    let msg = 'تعذّر تسجيل الدخول: ' + (e.message || 'خطأ غير معروف');
    if(code==='permission-denied' || /Missing or insufficient permissions/i.test(e.message||'')){
      msg = 'الوصول مرفوض من Firestore Rules — افتح Firebase Console > Firestore Database > Rules واسمح بالقراءة/الكتابة.';
    }
    document.getElementById('app').innerHTML = `<div class="page"><div class="card" style="border-color:var(--danger);">
      <b style="color:var(--danger);">خطأ في الاتصال بقاعدة البيانات</b>
      <p class="sub" style="margin-top:8px;">${escapeHtml(msg)}</p>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="render()">حاول مرة أخرى</button>
    </div></div>`;
  }
}

function toggleUserSectionsSelectMode(){

function toggleUserSectionPick(id){

function startSelectedSectionsQuiz(){
  if(userSelectedSectionIds.size<2){ toast('اختر قسمين على الأقل'); return; }

}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function openModal(html, center){

/* ================= QUIZ ENGINE ================= */
async function startQuiz(sectionId){
  const cont = document.getElementById('app');
  cont.innerHTML = `<div class="loader">جارِ تجهيز الاختبار...</div>`;
  try{
    let qs=[]; let secName='';
    if(sectionId==='all'){
      qs = await getAllQuestions();
      secName='كل الأقسام';
    }else if(Array.isArray(sectionId)){
      await loadSections();
      const idsSet = new Set(sectionId);
      const pickedSections = state.sections.filter(s=>idsSet.has(s.id));
      const lists = await Promise.all(sectionId.map(id=>getQuestions(id)));
      qs = sortAllBySectionThenOrder(lists.flat(), pickedSections);
      secName = `أقسام محددة (${pickedSections.length})`;
    }else{
      qs = await getQuestions(sectionId);
      const sec = state.sections.find(s=>s.id===sectionId);
      secName = sec?sec.name:'';
    }
    if(qs.length===0){ toast('لا توجد أسئلة في هذا الاختيار بعد'); nav('sections'); return; }
    beginQuizSession(qs, secName, sectionId);
  }catch(e){
    console.error(e);
    showRenderError(e);
  }
}
async function beginQuizSession(questions, sectionName, sectionId, isOfflineQuiz){
  if(!isOfflineQuiz) await refreshSettings();   // آخر قيمة لإعداد التصحيح المباشر (وفي وضع بدون اتصال تُستخدم القيمة المخزنة)
  if(state.route && state.route.name && state.route.name!=='quiz'){ state.history.push({name:state.route.name, params:state.route.params}); }
  state.quiz = {
    sectionId, sectionName,
    isOfflineQuiz: !!isOfflineQuiz,
    instantFeedback: !!appSettings.instantFeedback,
    questions, index:0,
    answers: questions.map(q=>({questionId:q.id, sectionId:q.sectionId||null, type:q.type, selectedIndex:null, saved:false, reviewed:false, timeSpentSeconds:0})),
    startedAt: Date.now(),
    qStartedAt: Date.now(),
    savedFlags:{}, reviewFlags:{},
    reviewMode:false
  };
  state.route={name:'quiz',params:{}};
  render();
  preloadSavedFlags();
}
async function preloadSavedFlags(){
  state.quiz.savedFlags = state.quiz.savedFlags || {};
  try{
    const snap = await db.collection('users').doc(state.userNumber).collection('saved').get();
    const set = new Set(snap.docs.map(d=>d.id));
    state.quiz.questions.forEach(q=>{ state.quiz.savedFlags[q.id]=set.has(q.id); });
  }catch(e){
    console.error('preloadSavedFlags failed (offline?)', e);
  }
  renderQuizScreen();
}
function currentQ(){ return state.quiz.questions[state.quiz.index]; }
function currentAns(){ return state.quiz.answers[state.quiz.index]; }

function renderQuizScreen(){
  const cont = document.getElementById('page-content');
  if(!cont) return;
  const quiz = state.quiz;
  const q = currentQ();
  const ans = currentAns();
  const pct = Math.round(((quiz.index)/quiz.questions.length)*100);
  const saved = quiz.savedFlags[q.id];
  const reviewed = quiz.reviewFlags[q.id];

  let bodyHtml = '';
  const instr = QTYPES[q.type].instruction;

  if(q.type==='reading'){
    bodyHtml = `
      <div class="q-instruction">${instr}</div>
      <div class="q-passage-link" onclick="showPassage()">${iconEye()} إظهار النص</div>
      <div class="q-text">${escapeHtml(q.question)}</div>
    `;
  }else if(q.type==='odd_word'){
    bodyHtml = `<div class="q-instruction">${instr}</div>`;
  }else if(q.type==='analogy'){
    bodyHtml = `<div class="q-instruction">${instr}</div><div class="q-text">${escapeHtml(q.word1)} : ${escapeHtml(q.word2)}</div>`;
  }else{
    bodyHtml = `<div class="q-instruction">${instr}</div><div class="q-text">${escapeHtml(q.sentence)}</div>`;
  }

  const revealed = !!quiz.instantFeedback && ans.selectedIndex!==null;   // التصحيح المباشر: يظهر فور اختيار الإجابة
  const answersHtml = q.answers.map((a,i)=>{
    const label = q.type==='analogy' ? `${a.w1} : ${a.w2}` : a;
    let cls = '';
    if(revealed){
      if(i===q.correctIndex) cls = 'correct locked';
      else if(i===ans.selectedIndex) cls = 'wrong locked';
      else cls = 'locked';
    }else if(ans.selectedIndex===i){
      cls = 'selected';
    }
    return `<div class="answer ${cls}" ${revealed?'':`onclick="selectAnswer(${i})"`}>
      <div class="letter">${LETTERS[i]}</div>
      <div>${escapeHtml(label)}</div>
    </div>`;
  }).join('');
  const feedbackHtml = revealed
    ? (ans.selectedIndex===q.correctIndex
        ? `<div style="margin-top:6px;font-size:13px;font-weight:700;color:var(--success);">✓ إجابة صحيحة</div>`
        : `<div style="margin-top:6px;font-size:13px;font-weight:700;color:var(--danger);">✗ إجابة خاطئة — الصحيحة هي ${LETTERS[q.correctIndex]}</div>`)
    : '';

  const isLast = quiz.index === quiz.questions.length-1;

  const cont2 = `
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>
    <div class="q-meta"><span>سؤال ${quiz.index+1} من ${quiz.questions.length}</span><span class="q-tag">${quiz.sectionName}</span></div>
    <div class="quiz-tools">
      <div class="tool-btn ${saved?'active':''}" onclick="toggleSaveCurrent()" title="حفظ السؤال">${iconBookmark(saved)}</div>
      <div class="tool-btn ${reviewed?'review-active':''}" onclick="toggleReviewCurrent()" title="إضافة للمراجعة">${iconCircle(reviewed)}</div>
    </div>
    <div class="q-card">${bodyHtml}<div style="margin-top:14px;">${answersHtml}${feedbackHtml}</div></div>
    <div class="btn-row">
      ${quiz.index>0?`<button class="btn" onclick="prevQuestion()">السابق</button>`:''}
      <button class="btn btn-primary" onclick="${isLast?'goToReviewScreen()':'nextQuestion()'}">${isLast?'مراجعة قبل الإرسال':'التالي'}</button>
    </div>
  `;
  cont.innerHTML = cont2;
}
function showPassage(){
  const q = currentQ();
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">النص</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
    <div style="line-height:2;font-size:15px;">${escapeHtml(q.passage)}</div>
  `, true);
}
function selectAnswer(i){
  if(state.quiz.instantFeedback && currentAns().selectedIndex!==null) return;   // مقفول بعد التصحيح المباشر
  currentAns().selectedIndex = i;
  renderQuizScreen();
}
function recordTimeSpent(){
  const now = Date.now();
  const spent = (now - state.quiz.qStartedAt)/1000;
  currentAns().timeSpentSeconds += spent;
  state.quiz.qStartedAt = now;
}
function nextQuestion(){
  recordTimeSpent();
  if(state.quiz.index < state.quiz.questions.length-1){ state.quiz.index++; renderQuizScreen(); }
}
function prevQuestion(){
  recordTimeSpent();
  if(state.quiz.index>0){ state.quiz.index--; renderQuizScreen(); }
}
function toggleSaveCurrent(){
  const q = currentQ();
  const nv = !state.quiz.savedFlags[q.id];
  state.quiz.savedFlags[q.id]=nv;
  toggleSaved(state.userNumber, q, nv).catch(e=>console.error('save failed (offline?)', e));
  toast(nv?'تم حفظ السؤال':'تم إلغاء الحفظ');
  renderQuizScreen();
}
function toggleReviewCurrent(){
  const q = currentQ();
  state.quiz.reviewFlags[q.id] = !state.quiz.reviewFlags[q.id];
  renderQuizScreen();
}
function goToReviewScreen(){
  recordTimeSpent();
  renderReviewScreen();
}
function renderReviewScreen(){
  const cont = document.getElementById('app');
  const quiz = state.quiz;
  const flagged = quiz.questions.map((q,i)=>({q,i})).filter(x=>quiz.reviewFlags[x.q.id]);
  const unanswered = quiz.answers.map((a,i)=>({a,i})).filter(x=>x.a.selectedIndex===null);
  cont.innerHTML = `
    <div class="topbar"><button class="icon-btn" onclick="renderQuizFromRoute()">${iconBack()}</button><div class="topbar-title">مراجعة قبل الإرسال</div><div style="width:40px;"></div></div>
    <div class="page">
      <div class="section-title">قبل الإرسال</div>
      ${unanswered.length? `<div class="card"><b>أسئلة غير مجابة (${unanswered.length})</b><div style="margin-top:10px;">
        ${unanswered.map(u=>`<span class="pill" style="cursor:pointer;display:inline-block;margin-left:6px;margin-bottom:6px;" onclick="jumpTo(${u.i})">سؤال ${u.i+1}</span>`).join('')}
      </div></div>`:''}
      ${flagged.length? `<div class="card"><b>أسئلة معلّمة للمراجعة (${flagged.length})</b><div style="margin-top:10px;">
        ${flagged.map(f=>`<span class="pill active" style="cursor:pointer;display:inline-block;margin-left:6px;margin-bottom:6px;" onclick="jumpTo(${f.i})">سؤال ${f.i+1}</span>`).join('')}
      </div></div>`:''}
      ${(!flagged.length && !unanswered.length) ? `<div class="empty"><div class="ic">✓</div>لا توجد أسئلة معلّمة أو ناقصة، جاهز للإرسال</div>`:''}
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn" onclick="renderQuizFromRoute()">رجوع للأسئلة</button>
        <button class="btn btn-primary" onclick="submitQuiz()">إرسال الاختبار</button>
      </div>
    </div>`;
}
function jumpTo(i){ state.quiz.index=i; renderQuizFromRoute(); }
function renderQuizFromRoute(){ render(); }

async function submitQuiz(){
  const quiz = state.quiz;
  document.getElementById('app').innerHTML = `<div class="loader">جارِ تصحيح الاختبار...</div>`;
  let score=0;
  quiz.answers.forEach((ans,i)=>{
    const q = quiz.questions[i];
    ans.isCorrect = ans.selectedIndex!==null && ans.selectedIndex===q.correctIndex;
    ans.saved = !!quiz.savedFlags[q.id];
    ans.reviewed = !!quiz.reviewFlags[q.id];
    if(ans.isCorrect) score++;
  });
  const durationSeconds = (Date.now()-quiz.startedAt)/1000;
  const attempt = {
    sectionId: quiz.sectionId, sectionName: quiz.sectionName,
    score, total: quiz.questions.length, durationSeconds,
    startedAtClient: quiz.startedAt, endedAtClient: Date.now(),
    answers: quiz.answers
  };
  let attemptId = null;
  let saveFailed = false;
  try{
    attemptId = await addAttempt(state.userNumber, attempt);
    for(let i=0;i<quiz.answers.length;i++){
      const ans = quiz.answers[i];
      if(ans.isCorrect) await clearWrong(state.userNumber, ans.questionId);
      else await setWrong(state.userNumber, {id:ans.questionId, sectionId:ans.sectionId, type:ans.type});
    }
  }catch(e){
    console.error('submitQuiz save failed (offline?)', e);
    saveFailed = true;
    attemptId = 'unsaved_'+Date.now();
  }
  showResultScreen(attemptId, attempt, quiz, saveFailed);
}

function questionToQuickAddBlock(q){
  let out = `نوع السؤال: ${QTYPES[q.type].label}\n`;
  out += `رقم السؤال: ${q.order!==undefined && q.order!==null ? q.order : ''}\n`;
  if(q.type==='analogy'){
    out += `المفردة الأولى: ${q.word1||''}\n`;
    out += `المفردة الثانية: ${q.word2||''}\n`;
  }else if(q.type==='reading'){
    out += `النص: ${q.passage||''}\n`;
    out += `السؤال: ${q.question||''}\n`;
  }else if(q.type==='contextual_error' || q.type==='sentence_completion'){
    out += `الجملة: ${q.sentence||''}\n`;
  }
  out += `الإجابات:\n`;
  (q.answers||[]).forEach((a,i)=>{
    const num = i+1;
    const isCorrect = i===q.correctIndex;
    const suffix = isCorrect? ' --- هذه الإجابة الصحيحة':'';
    if(q.type==='analogy'){
      out += `${num} المفردة الأولى: ${a.w1||''} المفردة الثانية: ${a.w2||''}${suffix}\n`;
    }else{
      out += `${num} ${a}${suffix}\n`;
    }
  });
  return out;
}

function questionFormFields(type, existing, suggestedOrder){
  const ans = existing?.answers || (type==='analogy'? [{w1:'',w2:''},{w1:'',w2:''},{w1:'',w2:''},{w1:'',w2:''}] : ['','','','']);
  const correctIndex = existing?.correctIndex ?? 0;
  const orderVal = existing?.order!==undefined && existing?.order!==null ? existing.order : (suggestedOrder!==undefined? suggestedOrder : '');
  const orderField = `<div class="field"><label>رقم السؤال</label><input type="number" id="f_order" min="1" placeholder="مثال: 1" value="${orderVal}"></div>`;
  if(type==='contextual_error'){
    return `
      ${orderField}
      <div class="field"><label>الجملة (السؤال)</label><textarea id="f_sentence">${escapeHtml(existing?.sentence)}</textarea></div>
      ${answersBlock(ans,correctIndex,false)}
    `;
  }
  if(type==='analogy'){
    return `
      ${orderField}
      <div class="field"><label>المفردة الأولى للسؤال</label><input type="text" id="f_word1" value="${escapeHtml(existing?.word1)}"></div>
      <div class="field"><label>المفردة الثانية للسؤال</label><input type="text" id="f_word2" value="${escapeHtml(existing?.word2)}"></div>
      ${answersBlockAnalogy(ans, correctIndex)}
    `;
  }
  if(type==='reading'){
    return `
      ${orderField}
      <div class="field"><label>النص</label><textarea id="f_passage" style="min-height:140px;">${escapeHtml(existing?.passage)}</textarea></div>
      <div class="field"><label>السؤال</label><input type="text" id="f_question" value="${escapeHtml(existing?.question)}"></div>
      ${answersBlock(ans,correctIndex,false)}
    `;
  }
  if(type==='odd_word'){
    return `${orderField}${answersBlock(ans,correctIndex,false)}`;
  }
  if(type==='sentence_completion'){
    return `
      ${orderField}
      <div class="field"><label>الجملة (استخدم ........ لتحديد الفراغ)</label><textarea id="f_sentence">${escapeHtml(existing?.sentence)}</textarea></div>
      ${answersBlock(ans,correctIndex,false)}
    `;
  }
  return '';
}
function answersBlock(ans, correctIndex){
  return `<div class="field"><label>الإجابات (حدد الصحيحة)</label>
    ${[0,1,2,3].map(i=>`
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
        <input type="radio" name="correctAns" value="${i}" ${correctIndex==i?'checked':''} style="width:auto;margin:0;">
        <input type="text" id="f_ans_${i}" placeholder="إجابة ${LETTERS[i]}" value="${escapeHtml(ans[i])}" style="margin-bottom:0;">
      </div>`).join('')}
  </div>`;
}
function answersBlockAnalogy(ans, correctIndex){
  return `<div class="field"><label>الإجابات (حدد الصحيحة)</label>
    ${[0,1,2,3].map(i=>`

let quickParsed = null;
function extractBetween(text, startLabel, endLabels){
  // returns text right after startLabel up to the first occurrence of any endLabel (or end of string)
  const startIdx = text.indexOf(startLabel);
  if(startIdx===-1) return null;
  const from = startIdx + startLabel.length;
  let endIdx = text.length;
  endLabels.forEach(lbl=>{
    const idx = text.indexOf(lbl, from);
    if(idx!==-1 && idx<endIdx) endIdx = idx;
  });
  return text.slice(from, endIdx).trim();
}
function toWesternDigits(str){
  return String(str).replace(/[٠-٩]/g, d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
}
/* تقسيم الإجابات المرقمة (1 2 3 4) بالترتيب؛ يتعامل بشكل صحيح مع إجابات تحتوي أرقاماً مثل "12 إلى 35" أو "2 : 8" */
function splitNumberedAnswers(text){
  const s = text.trim();
  const m1 = s.match(/^1\s+/);
  if(!m1) return null;
  const parts = [];
  let pos = m1[0].length;
  for(let k=2;k<=4;k++){
    const re = new RegExp('\\s'+k+'\\s','g');
    re.lastIndex = pos;
    const m = re.exec(s);
    if(!m) break;
    parts.push(s.slice(pos, m.index).trim());
    pos = m.index + m[0].length;
  }
  parts.push(s.slice(pos).trim());
  return parts;
}
function parseQuickAdd(rawText){
  // normalize: collapse all whitespace/newlines into single spaces so the parser
  // works whether the admin writes each field on its own line or as continuous text.
  const norm = rawText.replace(/\s+/g,' ').trim();

  const titleRaw = extractBetween(norm, 'عنوان ورقم القسم:', ['نوع السؤال:']);
  if(titleRaw===null) throw new Error('لم أجد "عنوان ورقم القسم:" في النص');
  const titleParts = titleRaw.split(/\s+/);
  const isNumTok = t => /^[0-9٠-٩]+$/.test(t);
  let secNumber = '', titleStart = 0;
  if(titleParts.length && isNumTok(titleParts[0])){ secNumber = toWesternDigits(titleParts[0]); titleStart = 1; }
  // الرقم الأول يُحفظ كرقم للقسم، وباقي العنوان (بما فيه الرقم الهندي مثل ١١) يُحفظ كاسم للقسم
  const secTitle = titleParts.slice(titleStart).join(' ') || titleRaw;

  const blocks = norm.split(/(?=نوع السؤال:)/g).slice(1);
  if(blocks.length===0) throw new Error('لم أجد أي سؤال (تأكد من كتابة "نوع السؤال:" قبل كل سؤال)');

  const questions = blocks.map((block, bi)=>parseQuestionBlock(block, bi+1, true));

  return { secNumber, secTitle, questions };
}
/* يحلل كتلة سؤال واحدة (تبدأ بـ "نوع السؤال:"). requireOrder=true يفرض وجود "رقم السؤال:" (تُستخدم مع الأقسام)،
   requireOrder=false يتجاهله (تُستخدم مع الأسئلة المهمة التي لا رقم لها) */
function parseQuestionBlock(block, n, requireOrder){
  const typeLabel = extractBetween(block, 'نوع السؤال:', ['رقم السؤال:','المفردة الأولى:','النص:','الجملة:','الإجابات:']);
  const typeKey = Object.keys(QTYPES).find(k=>QTYPES[k].label===typeLabel);
  if(!typeKey) throw new Error(`نوع السؤال غير معروف في السؤال رقم ${n}: "${typeLabel}"`);

  let qOrder;
  if(requireOrder){
    const qNumMatch = block.match(/رقم السؤال:\s*([0-9٠-٩]+)/);
    if(!qNumMatch) throw new Error(`لم أجد "رقم السؤال:" في السؤال رقم ${n} (بالترتيب داخل النص)`);
    qOrder = parseInt(toWesternDigits(qNumMatch[1]),10);
  }

  const answersIdx = block.indexOf('الإجابات:');
  if(answersIdx===-1) throw new Error(`لم أجد "الإجابات:" في السؤال رقم ${n}`);
  const header = block.slice(0, answersIdx);
  const answersRaw = block.slice(answersIdx + 'الإجابات:'.length).trim();
  if(!answersRaw) throw new Error(`قائمة الإجابات فارغة في السؤال رقم ${n}`);

  let word1,word2,sentence,passage,question;
  if(typeKey==='analogy'){
    word1 = extractBetween(header,'المفردة الأولى:',['المفردة الثانية:']) || '';
    word2 = extractBetween(header,'المفردة الثانية:',[]) || '';
  }else if(typeKey==='reading'){
    const passageStart = header.indexOf('النص:');
    const passageFrom = passageStart===-1? -1 : passageStart + 'النص:'.length;
    const qLabelIdx = passageFrom===-1? -1 : header.indexOf('السؤال:', passageFrom);
    passage = passageFrom===-1? '' : (qLabelIdx===-1? header.slice(passageFrom).trim() : header.slice(passageFrom, qLabelIdx).trim());
    question = qLabelIdx===-1? '' : header.slice(qLabelIdx + 'السؤال:'.length).trim();
  }else if(typeKey==='contextual_error' || typeKey==='sentence_completion'){
    sentence = extractBetween(header,'الجملة:',[]) || '';
  }

  let answers, correctIndex=-1;
  if(typeKey==='analogy'){
    const chunks = answersRaw.split(/(?=[1-4]\s*المفردة الأولى:)/g).map(c=>c.trim()).filter(Boolean);
    if(chunks.length<1) throw new Error(`تعذّر تقسيم إجابات التناظر في السؤال رقم ${n}`);
    answers = chunks.map((chunk,i)=>{
      if(/---\s*هذه الإجابة الصحيحة/.test(chunk)) correctIndex=i;
      const w1 = extractBetween(chunk,'المفردة الأولى:',['المفردة الثانية:']) || '';
      let w2 = extractBetween(chunk,'المفردة الثانية:',[]) || '';
      w2 = w2.replace(/---\s*هذه الإجابة الصحيحة.*$/,'').trim();
      return { w1, w2 };
    });
  }else{
    const chunks = splitNumberedAnswers(answersRaw);
    if(!chunks || chunks.length<1) throw new Error(`تعذّر تقسيم الإجابات في السؤال رقم ${n} (تأكد من ترقيمها 1 2 3 4)`);
    answers = chunks.map((chunk,i)=>{
      if(/---\s*هذه الإجابة الصحيحة/.test(chunk)) correctIndex=i;
      return chunk.replace(/---\s*هذه الإجابة الصحيحة.*$/,'').trim();
    });
  }
  if(correctIndex===-1) throw new Error(`لم أجد إجابة معلّمة بـ "--- هذه الإجابة الصحيحة" في السؤال رقم ${n}`);

  return { type:typeKey, order:qOrder, answers, correctIndex, word1, word2, sentence, passage, question };
}
/* أسئلة مهمة: يقبل سؤالاً أو أكثر بدون عنوان قسم وبدون "رقم السؤال:" */
function parseImportantQuickAdd(rawText){
  const norm = rawText.replace(/\s+/g,' ').trim();
  const blocks = norm.split(/(?=نوع السؤال:)/g).map(b=>b.trim()).filter(b=>b.startsWith('نوع السؤال:'));
  if(blocks.length===0) throw new Error('لم أجد أي سؤال (تأكد من كتابة "نوع السؤال:" قبل كل سؤال)');
  return blocks.map((block,bi)=>parseQuestionBlock(block, bi+1, false));
}

            <div class="sub" style="color:var(--success);">الصحيحة: ${escapeHtml(q.type==='analogy'? (q.answers[q.correctIndex].w1+' : '+q.answers[q.correctIndex].w2) : q.answers[q.correctIndex])}</div>
          </div>`).join('')}

    document.getElementById('quickSaveBtn').style.display='none';
  }
}
function buildQuestionData(q){
  const data = {correctIndex:q.correctIndex, answers:q.answers, order:q.order};
  if(q.word1!==undefined){ data.word1=q.word1; data.word2=q.word2; }
  if(q.sentence!==undefined) data.sentence=q.sentence;
  if(q.passage!==undefined){ data.passage=q.passage; data.question=q.question; }
  return data;
}
async function saveParsedSectionBatch(parsed){
  const secRef = db.collection('sections').doc();
  let batch = db.batch(); let ops = 0;
  batch.set(secRef, {name:parsed.secTitle, number:parsed.secNumber||'', createdAt:FieldValue.serverTimestamp()}); ops++;
  for(const q of parsed.questions){
    batch.set(db.collection('questions').doc(), {
      sectionId:secRef.id, type:q.type, ...buildQuestionData(q), createdAt:FieldValue.serverTimestamp()
    });
    ops++;
    if(ops>=400){ await batch.commit(); batch = db.batch(); ops = 0; }
  }
  if(ops>0) await batch.commit();
  state.sectionsLoaded = false;
  return secRef.id;
}

function parseMultiSections(rawText){
  const LABEL = 'عنوان ورقم القسم:';
  const pieces = rawText.split(LABEL).slice(1);
  if(pieces.length===0) throw new Error('لم أجد "عنوان ورقم القسم:" في النص');
  const sections = [], errors = [];
  pieces.forEach((piece,i)=>{
    try{
      sections.push(parseQuickAdd(LABEL + piece));
    }catch(e){
      const head = piece.trim().split(/\s+/).slice(0,4).join(' ');
      errors.push(`القسم ${i+1} (${head}): ${e.message}`);
    }
  });
  return { sections, errors };
}
function parsedCorrectText(q){
  const a = q.answers[q.correctIndex];
  return q.type==='analogy' ? (a.w1+' : '+a.w2) : a;
}

    <button class="btn btn-primary" style="margin-bottom:16px;" onclick="openAddImportantChoice()">${iconPlus()} إضافة سؤال</button>
    <div class="sub" style="margin-bottom:10px;">عدد الأسئلة: ${questions.length}</div>
    ${questions.length===0? emptyState('لا توجد أسئلة مهمة بعد','ابدأ بإضافة أول سؤال'):''}
    ${questions.map((q,i)=>`
      <div class="list-item" style="cursor:default;">
        <div style="flex:1;">
          <span class="type-badge">${QTYPES[q.type].label}</span>
          <div class="title">${escapeHtml(questionSummaryText(q))||('سؤال '+(i+1))}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="icon-action" onclick="nav('admin-question-add',{sectionId:'important',questionId:'${q.id}'})">${iconEdit()}</div>
          <div class="icon-action" onclick="confirmDeleteQuestion('${q.id}','important')">${iconTrash()}</div>
        </div>
      </div>`).join('')}
    <button class="btn btn-outline" style="margin-top:16px;" onclick="nav('home')">رجوع للرئيسية</button>
  `;
}
function openAddImportantChoice(){
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">إضافة سؤال مهم</h3><div class="modal-close" onclick="closeModal()">${iconClose()}</div></div>
    <button class="btn btn-primary" style="margin-bottom:10px;" onclick="closeModal();nav('admin-question-add',{sectionId:'important'});">إضافة يدوية</button>
    <button class="btn btn-outline" onclick="closeModal();nav('admin-important-quick-add');">إضافة سريعة</button>
  `, true);
}
function renderAdminImportantQuickAdd(){
  const cont = document.getElementById('page-content');
  cont.innerHTML = `
    <div class="section-title">إضافة سريعة (الأسئلة المهمة)</div>
    <div class="small-note card">
      اكتب سؤالاً واحداً أو أكثر بنفس تنسيق الإضافة السريعة، لكن بدون سطر "عنوان ورقم القسم:" وبدون سطر "رقم السؤال:". كل سؤال يبدأ بسطر "نوع السؤال:". مثال:
      <pre style="white-space:pre-wrap;font-size:11.5px;color:var(--text-faint);margin-top:8px;">نوع السؤال: التناظر اللفظي
المفردة الأولى: أبحاث
المفردة الثانية: تطور
الإجابات:
1 المفردة الأولى: عمل المفردة الثانية: شهادة
2 المفردة الأولى: تجارة المفردة الثانية: استثمار
3 المفردة الأولى: شيبة المفردة الثانية: ضعف --- هذه الإجابة الصحيحة
4 المفردة الأولى: فوز المفردة الثانية: جهد</pre>
    </div>
    <textarea id="importantQuickAddText" placeholder="الصق النص هنا..." style="min-height:260px;"></textarea>
    <div class="btn-row">
      <button class="btn" onclick="previewImportantQuickAdd()">معاينة</button>
      <button class="btn btn-primary" id="importantQuickSaveBtn" style="display:none;" onclick="saveImportantQuickAdd()">حفظ الأسئلة</button>
    </div>
    <div id="importantQuickPreview"></div>
    <button class="btn btn-outline" style="margin-top:16px;" onclick="nav('admin-important')">رجوع</button>
  `;
}
let importantQuickParsed = null;
function previewImportantQuickAdd(){
  const text = document.getElementById('importantQuickAddText').value;
  const box = document.getElementById('importantQuickPreview');
  const saveBtn = document.getElementById('importantQuickSaveBtn');
  if(!text.trim()){ box.innerHTML=''; toast('الصق النص أولاً'); return; }
  try{
    const list = parseImportantQuickAdd(text);
    importantQuickParsed = list;
    box.innerHTML = `
      <div class="card" style="margin-top:14px;">
        <b>عدد الأسئلة المستخرجة: ${list.length}</b>
        ${list.map((q,i)=>`
          <div style="padding:10px 0;border-bottom:1px solid var(--border);">
            <span class="type-badge">سؤال ${i+1} · ${QTYPES[q.type].label}</span>
            ${q.answers.length<2?`<span class="chip" style="margin-right:6px;color:var(--accent);">⚠ إجابة واحدة فقط</span>`:''}
            <div style="font-size:13.5px;margin-top:4px;">${escapeHtml(questionSummaryText(q))||'(بدون نص ظاهر)'}</div>
            <div class="sub" style="color:var(--success);">الصحيحة: ${escapeHtml(parsedCorrectText(q))}</div>
          </div>`).join('')}
      </div>`;
    saveBtn.textContent = `حفظ ${list.length} سؤال`;
    saveBtn.style.display='flex';
  }catch(e){
    importantQuickParsed=null;
    box.innerHTML = `<div class="card" style="border-color:var(--danger);color:var(--danger);margin-top:14px;">خطأ في التنسيق: ${escapeHtml(e.message)}</div>`;
    saveBtn.style.display='none';
  }
}
async function saveImportantQuickAdd(){
  if(!importantQuickParsed || importantQuickParsed.length===0) return;
  const btn = document.getElementById('importantQuickSaveBtn');
  btn.disabled = true; btn.textContent = 'جارِ الحفظ...';
  try{
    const existing = await loadImportantQuestions(true);
    const base = existing.length;
    let batch = db.batch(); let ops = 0;
    importantQuickParsed.forEach((q,i)=>{
      const ref = db.collection('important_questions').doc();
      batch.set(ref, {type:q.type, ...buildQuestionData({...q, order: base+i}), createdAt:FieldValue.serverTimestamp()});
      ops++;
      if(ops>=400){ /* batches over 400 ops are unlikely here, kept as a safety net */ }
    });
    await batch.commit();
    state.importantLoaded = false;
    toast(`تم حفظ ${importantQuickParsed.length} سؤال بنجاح`);
    importantQuickParsed = null;
    nav('admin-important');
  }catch(e){
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'حفظ الأسئلة';
    toast('حدث خطأ أثناء الحفظ');
  }
}

/* ================= ADMIN: SETTINGS ================= */
async function renderAdminSettings(){
  const cont = document.getElementById('page-content');
  cont.innerHTML = `<div class="loader">جارِ التحميل...</div>`;
  await refreshSettings();
  cont.innerHTML = `
    <div class="section-title">الإعدادات</div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
        <div>
          <div style="font-weight:700;">التصحيح المباشر</div>
          <div class="small-note" style="margin-top:4px;">عند التفعيل يظهر تصحيح كل سؤال فور اختيار الإجابة أثناء الاختبار، ولا يمكن تغيير الإجابة بعدها. عند الإيقاف يكون التصحيح في نهاية الاختبار بعد الإرسال. ينطبق الإعداد على جميع المستخدمين.</div>
        </div>
        <label class="switch"><input type="checkbox" ${appSettings.instantFeedback?'checked':''} onchange="onToggleInstantFeedback(this)"><span class="switch-slider"></span></label>
      </div>
    </div>
  `;
}
async function onToggleInstantFeedback(el){
  const v = el.checked;
  el.disabled = true;
  try{
    await saveSetting('instantFeedback', v);
    toast(v ? 'تم تفعيل التصحيح المباشر' : 'تم إيقاف التصحيح المباشر');
  }catch(e){
    console.error(e);
    el.checked = !v;
    toast('تعذّر حفظ الإعداد');
  }
  el.disabled = false;
}

/* ================= ROUTER / RENDER ================= */
async function render(){
  const app = document.getElementById('app');
  if(!state.userNumber){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = `${renderTopbar()}${renderDrawer()}<div class="page" id="page-content"></div>`;
  const r = state.route;
  try{
    if(r.name==='home') await renderHome();
    else if(r.name==='sections') await renderSections();
    else if(r.name==='wrong') await (async()=>{ await hydrateWithSections(); await renderWrong(); })();
    else if(r.name==='saved') await (async()=>{ await hydrateWithSections(); await renderSaved(); })();
    else if(r.name==='history') await renderHistory();
    else if(r.name==='admin-sections') await renderAdminSections();
    else if(r.name==='admin-section-edit') await renderAdminSectionEdit(r.params.id);
    else if(r.name==='admin-question-add'){ questionDraftType = null; await renderAdminQuestionAdd(r.params.sectionId, r.params.questionId); }
    else if(r.name==='admin-quick-add') renderAdminQuickAdd();
    else if(r.name==='admin-multi-add') renderAdminMultiAdd();
    else if(r.name==='admin-settings') await renderAdminSettings();
    else if(r.name==='admin-important') await renderAdminImportant();
    else if(r.name==='admin-important-quick-add') renderAdminImportantQuickAdd();
    else if(r.name==='important') await renderImportant();
    else if(r.name==='quiz') renderQuizScreen();
    else if(r.name==='offline-sections') renderOfflineSections();
    else if(r.name==='offline-section-view') renderOfflineSectionView(r.params.id, r.params.name);
  }catch(e){
    console.error('render error:', e);
    showRenderError(e);
  }
}
function showRenderError(e){
  const cont = document.getElementById('page-content') || document.getElementById('app');
  if(!cont) return;
  cont.innerHTML = `<div class="page"><div class="card" style="border-color:var(--danger);">
    <b style="color:var(--danger);">حدث خطأ</b>
    <p class="sub" style="margin-top:8px;">${escapeHtml(e.message||'خطأ غير معروف')}</p>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="render()">إعادة المحاولة</button>
  </div></div>`;
}
window.addEventListener('unhandledrejection', function(ev){
  console.error('unhandled:', ev.reason);
  const err = ev.reason instanceof Error ? ev.reason : new Error(String(ev.reason && ev.reason.message || ev.reason || 'خطأ غير متوقع'));
  showRenderError(err);
});

/* patch: add quick-add entry point into admin sections choice modal already includes startQuickAddSection */
function startQuickAddSection(){ nav('admin-quick-add'); }
function startMultiAddSections(){ nav('admin-multi-add'); }

/* ================= BOOT ================= */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="loader">جارِ التحميل...</div>`;
  const s = await sessionLoad();
  if(s && s.num){
    state.userNumber = s.num; state.isAdmin = s.isAdmin;
    nav('home');
  }else{
    render();
  }
})();
</script>
</body>
</html>
